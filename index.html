<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QuantByProf v2.0 — CAT QA Formula & Concept Recall</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap');

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    /* 1. Revise Theme: Royal Indigo & Warm Study Ivory */
    body.theme-revise {
      background-color: #f6f5ff;
      color: #1e1b4b;
    }
    .revise-card-gradient {
      background: linear-gradient(135deg, #1e1b4b 0%, #3730a3 100%);
    }

    /* 2. Recall Arcade Theme: Deep Slate & Warm Amber */
    body.theme-arcade {
      background-color: #0f172a;
      color: #f8fafc;
    }
    .arcade-gradient {
      background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #b45309 100%);
    }
    .arcade-card {
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
    }

    /* Hide scrollbars for horizontal pill bars */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="theme-revise min-h-screen flex flex-col pb-20">

  <!-- TOP NAVIGATION BAR -->
  <header id="app-header" class="sticky top-0 z-40 shadow-md transition-colors duration-300 bg-[#1e1b4b] text-white">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="font-black text-lg tracking-tight">QuantByProf</span>
        <span id="version-badge" class="text-[10px] font-mono-code uppercase px-2 py-0.5 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/40 font-semibold">v2.0 Formula Recall</span>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="window.app.openAddModal()" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/15 transition">+ Add Formula</button>
        <button onclick="window.app.openSyncModal()" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/15 transition">Sync</button>
      </div>
    </div>

    <!-- PRIMARY MODE SWITCHER (Formula Deck | Recall Games) -->
    <div class="max-w-3xl mx-auto px-4 pb-2.5">
      <div class="grid grid-cols-2 gap-1.5 bg-black/25 p-1 rounded-xl">
        <button id="tab-revise" onclick="window.app.setSection('revise')" class="py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1.5">
          <span>📖 Formula Deck</span>
        </button>
        <button id="tab-arcade" onclick="window.app.setSection('arcade')" class="py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1.5">
          <span>🧠 Recall Minigames</span>
        </button>
      </div>
    </div>

    <!-- SHARED CAT QA SYLLABUS TOPIC PILL BAR -->
    <div class="border-t border-white/10 bg-black/15">
      <div id="topic-bar" class="max-w-3xl mx-auto px-4 py-2 flex space-x-2 overflow-x-auto no-scrollbar"></div>
    </div>
  </header>

  <!-- SUB-FILTER / MINIGAME SELECTOR BAR -->
  <div id="subfilter-container" class="max-w-3xl w-full mx-auto px-4 pt-3">
    <div id="subfilter-bar" class="flex space-x-2 overflow-x-auto no-scrollbar pb-1"></div>
  </div>

  <!-- MAIN VIEWPORT -->
  <main id="main-content" class="max-w-3xl w-full mx-auto px-4 pt-3 flex-1"></main>

  <!-- + ADD CUSTOM FORMULA CARD MODAL -->
  <div id="add-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="w-full max-w-lg rounded-2xl bg-white text-slate-900 p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-base">Add Custom CAT Formula Card</h3>
        <button onclick="window.app.closeAddModal()" class="text-slate-400 hover:text-slate-700 text-xl">&times;</button>
      </div>
      <form id="add-form" onsubmit="window.app.saveCustomConcept(event)" class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold mb-1">CAT Syllabus Pillar</label>
            <select id="add-topic" class="w-full p-2 rounded-lg border border-slate-300">
              <option>Arithmetic</option>
              <option>Ratio & Mixtures</option>
              <option>Algebra</option>
              <option>Geometry</option>
              <option>Number Theory</option>
              <option>Modern Math</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold mb-1">Subtopic</label>
            <input id="add-subtopic" required placeholder="e.g., Logarithms" class="w-full p-2 rounded-lg border border-slate-300" />
          </div>
        </div>
        <div>
          <label class="block font-semibold mb-1">Concept Title</label>
          <input id="add-title" required placeholder="e.g., Base Change & Reciprocal Rule" class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Core Formula</label>
          <input id="add-formula" required placeholder="e.g., log_b(a) = log(a)/log(b) = 1 / log_a(b)" class="w-full p-2 rounded-lg border border-slate-300 font-mono-code" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold mb-1">Cloze Prompt (with [ ??? ])</label>
            <input id="add-cloze-prompt" placeholder="Optional: log_b(a) = 1 / [ ??? ]" class="w-full p-2 rounded-lg border border-slate-300 font-mono-code" />
          </div>
          <div>
            <label class="block font-semibold mb-1">Missing Term Answer</label>
            <input id="add-cloze-ans" placeholder="Optional: log_a(b)" class="w-full p-2 rounded-lg border border-slate-300 font-mono-code" />
          </div>
        </div>
        <div>
          <label class="block font-semibold mb-1">Gold Highlight (Key Condition / Shortcut)</label>
          <input id="add-highlight" required placeholder="e.g., Base > 0, Base ≠ 1, Argument > 0" class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Application / Pattern Trigger Bullet 1</label>
          <input id="add-b1" required placeholder="When to apply this formula..." class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Exam Trap / Edge Case Bullet 2</label>
          <input id="add-b2" required placeholder="Common mistake to avoid..." class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">1-Line Memory Hook</label>
          <input id="add-hook" required placeholder="Short punchy mnemonic..." class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold">Save Formula Card</button>
      </form>
    </div>
  </div>

  <!-- SYNC (EXPORT / IMPORT JSON) MODAL -->
  <div id="sync-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="w-full max-w-lg rounded-2xl bg-white text-slate-900 p-5 shadow-2xl">
      <div class="flex justify-between items-center mb-2">
        <h3 class="font-bold text-base">State Backup & JSON Sync</h3>
        <button onclick="window.app.closeSyncModal()" class="text-slate-400 hover:text-slate-700 text-xl">&times;</button>
      </div>
      <p class="text-xs text-slate-500 mb-3">Copy your `quantbyprof_v2_state` JSON backup or paste an existing state string below to restore your saved cards, revise queue, and recall stats.</p>
      <textarea id="sync-textarea" rows="7" class="w-full p-3 rounded-xl border border-slate-300 font-mono-code text-[11px] mb-3 focus:outline-none focus:border-indigo-600"></textarea>
      <div class="flex space-x-2">
        <button onclick="window.app.copySyncState()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-white font-bold text-xs">📋 Copy Backup</button>
        <button onclick="window.app.restoreSyncState()" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs">⚡ Restore State</button>
      </div>
    </div>
  </div>

  <!-- APPLICATION SCRIPT (ZERO-COMPILE ES6) -->
  <script>
    // =========================================================================
    // 1. COMPLETE CAT QA SYLLABUS FORMULA DECK (28 High-Yield Concept Cards)
    // =========================================================================
    const SEED_CONCEPTS = [
      // --- ARITHMETIC (7 Cards) ---
      {
        id: "c_ar_1",
        topic: "Arithmetic",
        subtopic: "Percentages & Profit",
        title: "Successive Percentage Change & Faulty Balance",
        formula: "Net % = a + b + (ab / 100)   |   Faulty Gain % = [(True − False) / False] × 100",
        clozePrompt: "Net % = a + b + [ ??? ]",
        clozeAnswer: "(ab / 100)",
        clozeOptions: ["(ab / 100)", "(a − b) / 100", "2ab / (a + b)", "(a + b) / 2"],
        highlight: "Selling at CP using 800g instead of 1000g gives (200/800) = 25% Profit (NOT 20%)",
        bullets: [
          "Price up by 1/n requires consumption drop of 1/(n + 1) to keep expenditure constant.",
          "Two items sold at same SP, one at +x% profit and one at −x% loss, ALWAYS yields net loss of (x/10)² %."
        ],
        hook: "Dishonest scale denominator is always actual weight dispensed."
      },
      {
        id: "c_ar_2",
        topic: "Arithmetic",
        subtopic: "Profit, Loss & Markup",
        title: "Markup, Discount & Profit Multiplier Chain",
        formula: "SP = CP × (1 + M/100) × (1 − D/100)   |   CP / MP = (100 − D%) / (100 + P%)",
        clozePrompt: "CP / MP = [ ??? ] / (100 + P%)",
        clozeAnswer: "(100 − D%)",
        clozeOptions: ["(100 − D%)", "(100 + D%)", "(100 − M%)", "D% / P%"],
        highlight: "Ratio of Cost Price to Marked Price is directly (100 − Discount%) : (100 + Profit%)",
        bullets: [
          "Buy 'x' get 'y' free ⇒ Equivalent Discount % = [y / (x + y)] × 100.",
          "Trap: Discount is ALWAYS calculated on Marked Price (MP); Profit is ALWAYS on Cost Price (CP)."
        ],
        hook: "CP to MP ratio? Subtract Discount on top, add Profit on bottom."
      },
      {
        id: "c_ar_3",
        topic: "Arithmetic",
        subtopic: "SI & CI Interest",
        title: "Compound vs Simple Interest 2-Year & 3-Year Gaps",
        formula: "2-Yr (CI − SI) = P(R / 100)²   |   3-Yr (CI − SI) = P(R / 100)² × (3 + R / 100)",
        clozePrompt: "2-Yr (CI − SI) = [ ??? ]",
        clozeAnswer: "P(R / 100)²",
        clozeOptions: ["P(R / 100)²", "P(R / 100)³", "2P(R / 100)", "P(1 + R/100)²"],
        highlight: "Ratio of 3-Yr (CI−SI) to 2-Yr (CI−SI) is strictly (300 + R) : 100",
        bullets: [
          "Rule of 72: Doubling time under CI at R% p.a. is approximately 72 / R years.",
          "If a sum becomes k times in T years under CI, it becomes kⁿ times in (n × T) years."
        ],
        hook: "Two-year CI minus SI is simply Principal times Rate-fraction squared."
      },
      {
        id: "c_ar_4",
        topic: "Arithmetic",
        subtopic: "Time, Speed & Distance",
        title: "Harmonic Mean Speed & Post-Crossing Meeting Rule",
        formula: "S_avg = 2ab / (a + b)   |   S₁ / S₂ = √(t₂ / t₁)   |   Meeting Time T = √(t₁ · t₂)",
        clozePrompt: "Post-crossing Speed Ratio: S₁ / S₂ = [ ??? ]",
        clozeAnswer: "√(t₂ / t₁)",
        clozeOptions: ["√(t₂ / t₁)", "√(t₁ / t₂)", "t₂ / t₁", "(t₁ + t₂) / 2"],
        highlight: "After passing each other, if A takes t₁ and B takes t₂ to reach ends, T_meet = √(t₁ · t₂)",
        bullets: [
          "Early/Late arrival formula: Distance D = [S₁S₂ / |S₁ − S₂|] × Δt.",
          "Trap: Average speed is NEVER (a + b)/2 unless equal TIME is traveled at each speed."
        ],
        hook: "Post-meeting times flip and take a square root for speed ratio."
      },
      {
        id: "c_ar_5",
        topic: "Arithmetic",
        subtopic: "Boats, Escalators & Races",
        title: "Streams, Moving Escalators & Linear Races",
        formula: "Boat u = (D + U)/2, Stream v = (D − U)/2   |   Total Escalator Steps N = s₁ + v_esc · t₁",
        clozePrompt: "Boat Speed u = (D + U)/2, Stream Speed v = [ ??? ]",
        clozeAnswer: "(D − U)/2",
        clozeOptions: ["(D − U)/2", "√(D · U)", "2DU / (D + U)", "D − U"],
        highlight: "Moving with escalator: Steps = s + k·t; Moving against: Steps = s − k·t",
        bullets: [
          "In a race of length L, if A beats B by x meters or t seconds, B's speed is x / t.",
          "Trap: Upstream/Downstream average speed for a round trip is (u² − v²) / u, always less than still-water speed u."
        ],
        hook: "Add and halve for boat; subtract and halve for stream."
      },
      {
        id: "c_ar_6",
        topic: "Arithmetic",
        subtopic: "Circular Tracks",
        title: "Circular Track First Meeting & Starting Point Sync",
        formula: "First Meet Anywhere = L / |S₁ ± S₂|   |   Meet at Start = LCM(L/S₁, L/S₂)",
        clozePrompt: "Time to meet at Starting Point = [ ??? ]",
        clozeAnswer: "LCM(L/S₁, L/S₂)",
        clozeOptions: ["LCM(L/S₁, L/S₂)", "HCF(L/S₁, L/S₂)", "L / (S₁ + S₂)", "L / |S₁ − S₂|"],
        highlight: "Distinct meeting points on track: |a − b| (same direction) or (a + b) (opposite), where a:b is reduced speed ratio",
        bullets: [
          "Always reduce the speed ratio S₁ : S₂ to coprime integers a : b before counting distinct meeting points.",
          "LCM of fractions: LCM(a/b, c/d) = LCM(a, c) / HCF(b, d)."
        ],
        hook: "Reduce speeds to coprime a:b → add for opposite, subtract for same."
      },
      {
        id: "c_ar_7",
        topic: "Arithmetic",
        subtopic: "Time & Work",
        title: "Extra-Days √(ab) Rule & Man-Days Equivalence",
        formula: "If A takes (T + a) and B takes (T + b) days, Combined Time T = √(ab)",
        clozePrompt: "Combined Time T when A takes +a and B takes +b days = [ ??? ]",
        clozeAnswer: "√(ab)",
        clozeOptions: ["√(ab)", "ab / (a + b)", "(a + b) / 2", "2ab / (a + b)"],
        highlight: "(M₁ × D₁ × H₁) / W₁ = (M₂ × D₂ × H₂) / W₂",
        bullets: [
          "Always take Total Work = LCM of individual days to convert fractions into integer efficiencies.",
          "Trap: In alternating pipes with a leak (negative work), reserve the final positive fill stroke before computing cycles."
        ],
        hook: "Extra days over combined time? Multiply and root for √(ab)."
      },

      // --- RATIO, MIXTURES & AVERAGES (4 Cards) ---
      {
        id: "c_rm_1",
        topic: "Ratio & Mixtures",
        subtopic: "Replacement",
        title: "Iterative Draw & Replacement Formula",
        formula: "Final Pure / Initial Total = (1 − x / V)^n",
        clozePrompt: "Final Pure / Initial Total = [ ??? ]",
        clozeAnswer: "(1 − x / V)^n",
        clozeOptions: ["(1 − x / V)^n", "(1 − n·x / V)", "(x / V)^n", "1 − (x / V)^n"],
        highlight: "Always track the UNCHANGED component (or pure remaining liquid) over TOTAL volume",
        bullets: [
          "x = volume drawn per step, V = total vessel volume, n = number of operations.",
          "Trap: If final ratio Milk : Water = 16 : 65, then Final Milk / Total = 16 / (16 + 65) = 16/81."
        ],
        hook: "Denominator is Total Mixture (Milk + Water), never just Water."
      },
      {
        id: "c_rm_2",
        topic: "Ratio & Mixtures",
        subtopic: "Alligation",
        title: "Weighted Average Criss-Cross Alligation Rule",
        formula: "w₁ / w₂ = (A₂ − A_avg) / (A_avg − A₁)   |   A_avg = (w₁A₁ + w₂A₂) / (w₁ + w₂)",
        clozePrompt: "Weight Ratio w₁ / w₂ = [ ??? ]",
        clozeAnswer: "(A₂ − A_avg) / (A_avg − A₁)",
        clozeOptions: ["(A₂ − A_avg) / (A_avg − A₁)", "(A₁ − A_avg) / (A₂ − A_avg)", "A₂ / A₁", "(A₁ + A₂) / 2"],
        highlight: "Always alligate with respect to the DENOMINATOR unit (e.g., Cost Price for % Profit, Time for Speed)",
        bullets: [
          "Mixing two speeds S₁ and S₂ gives weights in the ratio of TIME spent, never distance.",
          "Trap: If Selling Price of mixture is given with % profit, divide by (1 + P/100) to get CP_avg BEFORE alligating."
        ],
        hook: "Criss-cross the gaps; weights match the bottom unit."
      },
      {
        id: "c_rm_3",
        topic: "Ratio & Mixtures",
        subtopic: "Proportions",
        title: "Componendo-Dividendo & Equal Ratio Theorem",
        formula: "If a/b = c/d  ⟹  (a + b)/(a − b) = (c + d)/(c − d)",
        clozePrompt: "If a/b = c/d = e/f = k, then (a + c + e)/(b + d + f) = [ ??? ]",
        clozeAnswer: "k (unless denominator sum = 0)",
        clozeOptions: ["k (unless denominator sum = 0)", "3k", "k³", "a·c·e / b·d·f"],
        highlight: "If a/b = c/d = e/f = k, then (a + c + e)/(b + d + f) = k (provided b + d + f ≠ 0)",
        bullets: [
          "Applying Componendo-Dividendo twice immediately restores the original fraction a/b.",
          "Trap: In cyclic ratios a/(b+c) = b/(c+a) = c/(a+b) = k, k is 1/2 (if a+b+c ≠ 0) OR k = −1 (if a+b+c = 0)."
        ],
        hook: "Sum over Difference untangles symmetrically trapped variables."
      },
      {
        id: "c_rm_4",
        topic: "Ratio & Mixtures",
        subtopic: "Averages & Means",
        title: "AM-GM-HM Inequality & Two-Number Mean Identity",
        formula: "AM ≥ GM ≥ HM   |   For two positive numbers a, b: GM² = AM × HM",
        clozePrompt: "For two positive numbers a and b, GM² = [ ??? ]",
        clozeAnswer: "AM × HM",
        clozeOptions: ["AM × HM", "(AM + HM) / 2", "AM² − HM²", "AM / HM"],
        highlight: "Equality AM = GM = HM holds if and only if all numbers are strictly equal (a = b)",
        bullets: [
          "Deviation shortcut: Assumed Mean + [Σ(x_i − Assumed) / n].",
          "Joining/Leaving member: New Member = Old Avg ± (Change in Avg × New Total Count)."
        ],
        hook: "AM ≥ GM ≥ HM always; for two numbers, GM is the geometric mean of AM and HM."
      },

      // --- ALGEBRA (6 Cards) ---
      {
        id: "c_alg_1",
        topic: "Algebra",
        subtopic: "Cubic Identity",
        title: "Euler's Conditional Identity (a + b + c = 0)",
        formula: "a³ + b³ + c³ − 3abc = (a + b + c)(a² + b² + c² − ab − bc − ca)",
        clozePrompt: "If a + b + c = 0, then a³ + b³ + c³ = [ ??? ]",
        clozeAnswer: "3abc",
        clozeOptions: ["3abc", "0", "abc", "(a + b + c)³"],
        highlight: "If a + b + c = 0  ⟹  a³ + b³ + c³ = 3abc",
        bullets: [
          "Fraction form: (a²/bc) + (b²/ca) + (c²/ab) = 3 whenever a + b + c = 0.",
          "Converse trap: a³ + b³ + c³ = 3abc means EITHER a + b + c = 0 OR a = b = c."
        ],
        hook: "Zero sum kills the big bracket → cubes collapse to 3abc."
      },
      {
        id: "c_alg_2",
        topic: "Algebra",
        subtopic: "Symmetric Sum",
        title: "Sum of Squared Differences Transformation",
        formula: "a² + b² + c² − ab − bc − ca = ½[(a − b)² + (b − c)² + (c − a)²]",
        clozePrompt: "a² + b² + c² − ab − bc − ca = [ ??? ][(a − b)² + (b − c)² + (c − a)²]",
        clozeAnswer: "½",
        clozeOptions: ["½", "2", "⅓", "1"],
        highlight: "Expression ≥ 0 for all real a, b, c; equals 0 iff a = b = c",
        bullets: [
          "If a, b, c are consecutive integers (d = 1), [(a−b)² + (b−c)² + (c−a)²] = 1 + 1 + 4 = 6, so value is always 3.",
          "Never expand a² + b² + c² when numbers are close (e.g., 999, 1000, 1001); use pairwise differences."
        ],
        hook: "Large close numbers? Halve the sum of three squared gaps."
      },
      {
        id: "c_alg_3",
        topic: "Algebra",
        subtopic: "Reciprocal Powers",
        title: "x + 1/x Power Escalation Ladder",
        formula: "If x + 1/x = k  ⟹  x² + 1/x² = k² − 2  and  x³ + 1/x³ = k³ − 3k",
        clozePrompt: "If x + 1/x = k, then x³ + 1/x³ = [ ??? ]",
        clozeAnswer: "k³ − 3k",
        clozeOptions: ["k³ − 3k", "k³ + 3k", "k³ − 3", "k² − 2"],
        highlight: "Sign flip rule: If x − 1/x = k  ⟹  x² + 1/x² = k² + 2  and  x³ − 1/x³ = k³ + 3k",
        bullets: [
          "Special values: If x + 1/x = 2 ⇒ x = 1. If x + 1/x = −2 ⇒ x = −1.",
          "Trap: If x + 1/x = √3, then x³ + 1/x³ = 0, which implies x⁶ = −1 (not +1)."
        ],
        hook: "Square subtracts 2; Cube takes k³ minus 3k."
      },
      {
        id: "c_alg_4",
        topic: "Algebra",
        subtopic: "Quadratics & Vieta",
        title: "Vieta's Root Relations & Quadratic Extreme Value",
        formula: "α + β = −b/a,  αβ = c/a,  |α − β| = √(b² − 4ac) / |a|   |   Vertex x = −b/(2a)",
        clozePrompt: "Difference of roots |α − β| = [ ??? ]",
        clozeAnswer: "√(b² − 4ac) / |a|",
        clozeOptions: ["√(b² − 4ac) / |a|", "(b² − 4ac) / 2a", "−b / a", "c / a"],
        highlight: "Extreme value (Min if a > 0, Max if a < 0) is (4ac − b²) / (4a) at x = −b/(2a)",
        bullets: [
          "Equation with reciprocal roots (1/α, 1/β) is obtained simply by swapping coefficients a and c: cx² + bx + a = 0.",

    // =========================================================================
    // 2. STATE MANAGEMENT & LOCALSTORAGE (quantbyprof_v2_state)
    // =========================================================================
    const STORAGE_KEY = "quantbyprof_v2_state";
    const TOPICS = ["All", "Arithmetic", "Ratio & Mixtures", "Algebra", "Geometry", "Number Theory", "Modern Math"];

    const defaultState = () => ({
      savedConcepts: [],
      reviseQueue: [],
      masteredConcepts: [],
      customConcepts: [],
      arcade: {
        xp: 0,
        clozeStreakBest: 0,
        matcherScoreBest: 0,
        flashcardsNailed: 0
      }
    });

    class QuantApp {
      constructor() {
        this.state = this.loadState();
        this.section = "revise"; // 'revise' | 'arcade'
        this.topic = "All";
        this.reviseSub = "all"; // 'all' | 'saved' | 'queue' | 'mastered'
        this.arcadeGame = "cloze"; // 'cloze' | 'matcher' | 'flashcard'

        // Minigame 1: Formula Fill-In (Cloze Recall) runtime state
        this.clozeState = {
          streak: 0,
          round: null,
          picked: null,
          showHint: false
        };

        // Minigame 2: Hook-to-Formula Matcher runtime state
        this.matcherState = {
          streak: 0,
          score: 0,
          round: null,
          pickedId: null,
          showHint: false
        };

        // Minigame 3: Zen Flashcard Flip runtime state
        this.flashState = {
          active: false,
          index: 0,
          deck: [],
          revealed: false,
          nailedCount: 0
        };

        this.initClozeRound();
        this.initMatcherRound();
        this.renderAll();
      }

      loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultState();
          const parsed = JSON.parse(raw);
          return {
            ...defaultState(),
            ...parsed,
            arcade: { ...defaultState().arcade, ...(parsed.arcade || {}) }
          };
        } catch (e) {
          return defaultState();
        }
      }

      saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      }

      getAllConcepts() {
        return [...SEED_CONCEPTS, ...(this.state.customConcepts || [])];
      }

      getTopicPool() {
        const all = this.getAllConcepts();
        if (this.topic === "All") return all;
        const filtered = all.filter(c => c.topic === this.topic);
        return filtered.length > 0 ? filtered : all;
      }

      getFilteredConcepts() {
        let list = this.getAllConcepts();
        if (this.topic !== "All") list = list.filter(c => c.topic === this.topic);
        if (this.reviseSub === "saved") list = list.filter(c => this.state.savedConcepts.includes(c.id));
        if (this.reviseSub === "queue") list = list.filter(c => this.state.reviseQueue.includes(c.id));
        if (this.reviseSub === "mastered") list = list.filter(c => this.state.masteredConcepts.includes(c.id));
        return list;
      }

      // =======================================================================
      // NAVIGATION & THEME SWITCHING
      // =======================================================================
      setSection(sec) {
        this.section = sec;
        const body = document.body;
        const header = document.getElementById("app-header");
        body.classList.remove("theme-revise", "theme-arcade");

        if (sec === "revise") {
          body.classList.add("theme-revise");
          header.className = "sticky top-0 z-40 shadow-md transition-colors duration-300 bg-[#1e1b4b] text-white";
        } else {
          body.classList.add("theme-arcade");
          header.className = "sticky top-0 z-40 shadow-md transition-colors duration-300 arcade-gradient text-white";
        }
        this.renderAll();
      }

      setTopic(t) {
        this.topic = t;
        this.initClozeRound();
        this.initMatcherRound();
        if (this.flashState.active) this.startFlashcards();
        this.renderAll();
      }

      setReviseSub(sub) {
        this.reviseSub = sub;
        this.renderAll();
      }

      setArcadeGame(game) {
        this.arcadeGame = game;
        this.renderAll();
      }

      toggleArrayItem(arr, id) {
        const idx = arr.indexOf(id);
        if (idx === -1) arr.push(id);
        else arr.splice(idx, 1);
        this.saveState();
        this.renderAll();
      }

      // =======================================================================
      // MINIGAME 1: FORMULA FILL-IN (CLOZE RECALL — ZERO CALCULATION)
      // =======================================================================
      initClozeRound() {
        const pool = this.getTopicPool();
        const card = pool[Math.floor(Math.random() * pool.length)];

        let prompt = card.clozePrompt;
        let answer = card.clozeAnswer;
        let options = card.clozeOptions ? [...card.clozeOptions] : [];

        // Fallback generator for custom cards without explicit cloze fields
        if (!prompt || !answer || options.length < 2) {
          prompt = `Complete the core relation for: ${card.title}`;
          answer = card.formula;
          const distractors = this.getAllConcepts()
            .filter(c => c.id !== card.id)
            .sort(() => Math.random() - 0.5)
            .slice(0, 3)
            .map(c => c.formula);
          options = [answer, ...distractors];
        }

        options = options.sort(() => Math.random() - 0.5);
        this.clozeState.round = { card, prompt, answer, options };
        this.clozeState.picked = null;
        this.clozeState.showHint = false;
      }

      pickClozeOption(optText) {
        if (this.clozeState.picked !== null) return;
        this.clozeState.picked = optText;
        const { card, answer } = this.clozeState.round;

        if (optText === answer) {
          this.clozeState.streak += 1;
          this.state.arcade.xp += 5;
          if (this.clozeState.streak > this.state.arcade.clozeStreakBest) {
            this.state.arcade.clozeStreakBest = this.clozeState.streak;
          }
        } else {
          this.clozeState.streak = 0;
          if (!this.state.reviseQueue.includes(card.id)) {
            this.state.reviseQueue.push(card.id);
          }
        }
        this.saveState();
        this.renderMain();
      }

      nextClozeRound() {
        this.initClozeRound();
        this.renderMain();
      }

      toggleClozeHint() {
        this.clozeState.showHint = !this.clozeState.showHint;
        this.renderMain();
      }

      // =======================================================================
      // MINIGAME 2: HOOK-TO-FORMULA MATCHER (RELAXED PATTERN RECOGNITION)
      // =======================================================================
      initMatcherRound() {
        const pool = this.getTopicPool();
        const fullPool = this.getAllConcepts();
        const target = pool[Math.floor(Math.random() * pool.length)];
        const distractors = fullPool
          .filter(c => c.id !== target.id)
          .sort(() => Math.random() - 0.5)
          .slice(0, 3);

        const options = [target, ...distractors]
          .sort(() => Math.random() - 0.5)
          .map(c => ({
            id: c.id,
            formula: c.formula,
            subtopic: c.subtopic
          }));

        this.matcherState.round = { target, options };
        this.matcherState.pickedId = null;
        this.matcherState.showHint = false;
      }

      pickMatcherOption(pickedId) {
        if (this.matcherState.pickedId !== null) return;
        this.matcherState.pickedId = pickedId;
        const { target } = this.matcherState.round;

        if (pickedId === target.id) {
          this.matcherState.streak += 1;
          this.matcherState.score += 10;
          this.state.arcade.xp += 5;
          if (this.matcherState.score > this.state.arcade.matcherScoreBest) {
            this.state.arcade.matcherScoreBest = this.matcherState.score;
          }
        } else {
          this.matcherState.streak = 0;
          if (!this.state.reviseQueue.includes(target.id)) {
            this.state.reviseQueue.push(target.id);
          }
        }
        this.saveState();
        this.renderMain();
      }

      nextMatcherRound() {
        this.initMatcherRound();
        this.renderMain();
      }

      toggleMatcherHint() {
        this.matcherState.showHint = !this.matcherState.showHint;
        this.renderMain();
      }

      // =======================================================================
      // MINIGAME 3: ZEN FLASHCARD FLIP (SELF-PACED ACTIVE RECALL)
      // =======================================================================
      startFlashcards() {
        const pool = this.getTopicPool();
        // Weight towards Revise Queue & Saved cards
        const weighted = [...pool].sort((a, b) => {
          const wa = (this.state.reviseQueue.includes(a.id) ? -2 : 0) + (this.state.savedConcepts.includes(a.id) ? -1 : 0);
          const wb = (this.state.reviseQueue.includes(b.id) ? -2 : 0) + (this.state.savedConcepts.includes(b.id) ? -1 : 0);
          return wa - wb || Math.random() - 0.5;
        }).slice(0, 10);

        this.flashState = {
          active: true,
          index: 0,
          deck: weighted,
          revealed: false,
          nailedCount: 0
        };
        this.renderMain();
      }

      revealFlashcard() {
        this.flashState.revealed = true;
        this.renderMain();
      }

      gradeFlashcard(nailed) {
        const card = this.flashState.deck[this.flashState.index];
        if (nailed) {
          this.flashState.nailedCount += 1;
          this.state.arcade.xp += 8;
          this.state.arcade.flashcardsNailed += 1;
          if (!this.state.masteredConcepts.includes(card.id)) {
            this.state.masteredConcepts.push(card.id);
          }
          const qIdx = this.state.reviseQueue.indexOf(card.id);
          if (qIdx !== -1) this.state.reviseQueue.splice(qIdx, 1);
        } else {
          if (!this.state.reviseQueue.includes(card.id)) {
            this.state.reviseQueue.push(card.id);
          }
        }
        this.saveState();

        if (this.flashState.index >= this.flashState.deck.length - 1) {
          this.flashState.active = false;
        } else {
          this.flashState.index += 1;
          this.flashState.revealed = false;
        }
        this.renderAll();
      }

      // =======================================================================
      // MODALS (+ ADD & SYNC)
      // =======================================================================
      openAddModal() {
        document.getElementById("add-modal").classList.remove("hidden");
      }
      closeAddModal() {
        document.getElementById("add-modal").classList.add("hidden");
      }
      saveCustomConcept(e) {
        e.preventDefault();
        const formulaVal = document.getElementById("add-formula").value.trim();
        const clozePromptVal = document.getElementById("add-cloze-prompt").value.trim();
        const clozeAnsVal = document.getElementById("add-cloze-ans").value.trim();

        const newCard = {
          id: "c_custom_" + Date.now(),
          topic: document.getElementById("add-topic").value,
          subtopic: document.getElementById("add-subtopic").value.trim(),
          title: document.getElementById("add-title").value.trim(),
          formula: formulaVal,
          clozePrompt: clozePromptVal || `Recall the formula for ${document.getElementById("add-title").value.trim()}:`,
          clozeAnswer: clozeAnsVal || formulaVal,
          clozeOptions: clozeAnsVal ? [clozeAnsVal, "0", "1", "Undefined"] : [],
          highlight: document.getElementById("add-highlight").value.trim(),
          bullets: [
            document.getElementById("add-b1").value.trim(),
            document.getElementById("add-b2").value.trim()
          ],
          hook: document.getElementById("add-hook").value.trim()
        };
        this.state.customConcepts.push(newCard);
        this.saveState();
        document.getElementById("add-form").reset();
        this.closeAddModal();
        this.renderAll();
      }

      openSyncModal() {
        document.getElementById("sync-textarea").value = JSON.stringify(this.state, null, 2);
        document.getElementById("sync-modal").classList.remove("hidden");
      }
      closeSyncModal() {
        document.getElementById("sync-modal").classList.add("hidden");
      }
      copySyncState() {
        const el = document.getElementById("sync-textarea");
        el.select();
        navigator.clipboard.writeText(el.value);
        alert("State JSON copied to clipboard!");
      }
      restoreSyncState() {
        try {
          const parsed = JSON.parse(document.getElementById("sync-textarea").value);
          this.state = {
            ...defaultState(),
            ...parsed,
            arcade: { ...defaultState().arcade, ...(parsed.arcade || {}) }
          };
          this.saveState();
          this.closeSyncModal();
          this.renderAll();
        } catch (err) {
          alert("Invalid JSON string. Please check format.");
        }
      }

      // =======================================================================
      // RENDERING PIPELINE
      // =======================================================================
      renderAll() {
        this.renderHeaderTabs();
        this.renderTopicBar();
        this.renderSubfilters();
        this.renderMain();
      }

      renderHeaderTabs() {
        const activeStyle = "bg-white text-slate-950 shadow-sm";
        const idleStyle = "text-white/75 hover:text-white hover:bg-white/10";
        ["revise", "arcade"].forEach(s => {
          const btn = document.getElementById(`tab-${s}`);
          if (btn) {
            btn.className = `py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1.5 ${this.section === s ? activeStyle : idleStyle}`;
          }
        });
      }

      renderTopicBar() {
        const container = document.getElementById("topic-bar");
        container.innerHTML = TOPICS.map(t => {
          const active = this.topic === t;
          const count = t === "All"
            ? this.getAllConcepts().length
            : this.getAllConcepts().filter(c => c.topic === t).length;
          return `<button onclick="window.app.setTopic('${t}')" class="px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition ${
            active ? "bg-amber-400 text-slate-950 shadow" : "bg-white/10 text-white/80 hover:bg-white/20"
          }">${t} <span class="opacity-70 text-[10px]">(${count})</span></button>`;
        }).join("");
      }

      renderSubfilters() {
        const bar = document.getElementById("subfilter-bar");
        if (this.section === "revise") {
          const items = [
            { id: "all", label: `All Formulae (${this.getAllConcepts().length})` },
            { id: "saved", label: `🔖 Saved (${this.state.savedConcepts.length})` },
            { id: "queue", label: `⚡ Revise Queue (${this.state.reviseQueue.length})` },
            { id: "mastered", label: `✅ Mastered (${this.state.masteredConcepts.length})` }
          ];
          bar.innerHTML = items.map(i => `
            <button onclick="window.app.setReviseSub('${i.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border transition ${
              this.reviseSub === i.id
                ? "bg-[#1e1b4b] text-white border-[#1e1b4b] shadow-sm"
                : "bg-white text-slate-700 border-indigo-100 hover:border-indigo-300"
            }">${i.label}</button>
          `).join("");
        } else {
          const games = [
            { id: "cloze", label: "🧩 1. Formula Fill-In" },
            { id: "matcher", label: "⚡ 2. Hook Matcher" },
            { id: "flashcard", label: "🃏 3. Zen Flashcards" }
          ];
          bar.innerHTML = games.map(g => `
            <button onclick="window.app.setArcadeGame('${g.id}')" class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap border transition ${
              this.arcadeGame === g.id
                ? "bg-amber-400 text-slate-950 border-amber-300 shadow-lg shadow-amber-500/20"
                : "bg-slate-800 text-slate-300 border-slate-700 hover:border-slate-500"
            }">${g.label}</button>
          `).join("");
        }
      }

      renderMain() {
        const main = document.getElementById("main-content");
        if (this.section === "revise") {
          main.innerHTML = this.renderReviseSection();
        } else {
          main.innerHTML = this.renderArcadeSection();
        }
      }

      // -----------------------------------------------------------------------
      // FORMULA DECK VIEW (REVISE)
      // -----------------------------------------------------------------------
      renderReviseSection() {
        const list = this.getFilteredConcepts();
        if (list.length === 0) {
          return `<div class="p-8 text-center bg-white rounded-2xl border border-indigo-100 text-slate-500 text-sm">No formula cards match this filter yet.</div>`;
        }
        return `<div class="space-y-4">${list.map(c => {
          const isSaved = this.state.savedConcepts.includes(c.id);
          const inQueue = this.state.reviseQueue.includes(c.id);
          const isMastered = this.state.masteredConcepts.includes(c.id);
          return `
            <article class="revise-card-gradient text-white rounded-2xl p-5 shadow-lg border border-indigo-400/20">
              <div class="flex justify-between items-center mb-2">
                <div class="flex items-center space-x-2">
                  <span class="text-[10px] font-mono-code uppercase px-2.5 py-0.5 rounded-full bg-indigo-500/30 text-indigo-200 border border-indigo-400/30">${c.topic}</span>
                  <span class="text-xs text-indigo-200/80 font-medium">${c.subtopic}</span>
                </div>
                <div class="flex space-x-1.5">
                  <button title="Save Bookmark" onclick="window.app.toggleArrayItem(window.app.state.savedConcepts, '${c.id}')" class="px-2 py-1 rounded-lg text-xs border ${isSaved ? 'bg-amber-400 text-slate-950 border-amber-300 font-bold' : 'bg-white/10 text-white/70 border-white/10'}">🔖</button>
                  <button title="Add to Revise Queue" onclick="window.app.toggleArrayItem(window.app.state.reviseQueue, '${c.id}')" class="px-2 py-1 rounded-lg text-xs border ${inQueue ? 'bg-rose-500 text-white border-rose-400 font-bold' : 'bg-white/10 text-white/70 border-white/10'}">⚡</button>
                  <button title="Mark Mastered" onclick="window.app.toggleArrayItem(window.app.state.masteredConcepts, '${c.id}')" class="px-2 py-1 rounded-lg text-xs border ${isMastered ? 'bg-emerald-400 text-slate-950 border-emerald-300 font-bold' : 'bg-white/10 text-white/70 border-white/10'}">✅</button>
                </div>
              </div>
              <h2 class="text-base font-bold text-white mb-3">${c.title}</h2>
              <div class="p-3 rounded-xl bg-black/30 border border-indigo-300/20 font-mono-code text-xs text-indigo-100 mb-2.5 overflow-x-auto">${c.formula}</div>
              <div class="p-2.5 rounded-xl bg-amber-400/15 border border-amber-400/40 text-amber-200 text-xs font-semibold mb-3">★ ${c.highlight}</div>
              <ul class="space-y-1.5 text-xs text-indigo-100/90 mb-3 pl-4 list-disc">
                ${c.bullets.map(b => `<li>${b}</li>`).join("")}
              </ul>
              <div class="pt-2.5 border-t border-white/10 text-xs text-amber-300 font-medium flex items-center justify-between">
                <span>🧠 <em>${c.hook}</em></span>
              </div>
            </article>
          `;
        }).join("")}</div>`;
      }

      // -----------------------------------------------------------------------
      // RECALL MINIGAMES HUB (3 LOW-FRICTION FORMULA CONSOLIDATION GAMES)
      // -----------------------------------------------------------------------
      renderArcadeSection() {
        const statsBar = `
          <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="arcade-card border border-slate-800 rounded-xl p-3 text-center">
              <div class="text-[10px] font-mono-code uppercase text-slate-400">Recall XP</div>
              <div class="text-base font-black text-amber-400">⚡ ${this.state.arcade.xp}</div>
            </div>
            <div class="arcade-card border border-slate-800 rounded-xl p-3 text-center">
              <div class="text-[10px] font-mono-code uppercase text-slate-400">Fill-In Streak</div>
              <div class="text-base font-black text-emerald-400">🧩 ${this.state.arcade.clozeStreakBest}</div>
            </div>
            <div class="arcade-card border border-slate-800 rounded-xl p-3 text-center">
              <div class="text-[10px] font-mono-code uppercase text-slate-400">Cards Mastered</div>
              <div class="text-base font-black text-indigo-400">✅ ${this.state.masteredConcepts.length}</div>
            </div>
          </div>
        `;

        if (this.arcadeGame === "cloze") return statsBar + this.renderClozeGame();
        if (this.arcadeGame === "matcher") return statsBar + this.renderMatcherGame();
        return statsBar + this.renderFlashcardGame();
      }

      // Minigame 1: Formula Fill-In (Cloze Recall)
      renderClozeGame() {
        const { streak, round, picked, showHint } = this.clozeState;
        const { card, prompt, answer, options } = round;

        return `
          <div class="arcade-card border border-amber-400/40 rounded-2xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-3 pb-2.5 border-b border-slate-800">
              <div>
                <span class="text-xs font-bold text-amber-400">🧩 Formula Fill-In (Cloze Recall)</span>
                <p class="text-[11px] text-slate-400">Tap the missing piece of the formula — zero calculation needed.</p>
              </div>
              <span class="font-mono-code text-xs font-bold px-2.5 py-1 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">🔥 Streak: ${streak}</span>
            </div>

            <div class="mb-4">
              <div class="flex justify-between items-center mb-1">
                <span class="text-[10px] font-mono-code uppercase text-indigo-400">${card.topic} • ${card.subtopic}</span>
                <button onclick="window.app.toggleClozeHint()" class="text-[11px] text-amber-300 hover:underline">💡 ${showHint ? "Hide Hook" : "Peek Memory Hook"}</button>
              </div>
              <h3 class="text-sm font-bold text-white mb-2">${card.title}</h3>
              ${showHint ? `<div class="mb-2.5 p-2.5 rounded-lg bg-amber-400/10 border border-amber-400/30 text-amber-200 text-xs italic">🧠 Hook: "${card.hook}"</div>` : ""}
              <div class="p-4 rounded-xl bg-slate-900 border border-indigo-500/40 font-mono-code text-sm text-amber-300 font-bold tracking-wide">
                ${prompt}
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-4">
              ${options.map(opt => {
                let cls = "bg-slate-800/90 hover:bg-slate-700 border-slate-600 text-slate-100";
                if (picked !== null) {
                  if (opt === answer) cls = "bg-emerald-950 border-emerald-400 text-emerald-200 font-bold";
                  else if (opt === picked) cls = "bg-rose-950 border-rose-500 text-rose-200";
                  else cls = "bg-slate-900 border-slate-800 opacity-40";
                }
                const escapedOpt = opt.replace(/'/g, "\\'");
                return `
                  <button
                    ${picked !== null ? "disabled" : ""}
                    onclick="window.app.pickClozeOption('${escapedOpt}')"
                    class="p-3.5 rounded-xl border text-left font-mono-code text-xs transition ${cls}"
                  >
                    ${opt}
                  </button>
                `;
              }).join("")}
            </div>

            ${picked !== null ? `
              <div class="p-3.5 rounded-xl bg-slate-900/90 border border-slate-700 text-xs space-y-1.5 mb-3">
                <div class="font-mono-code text-indigo-200"><strong>Full Formula:</strong> ${card.formula}</div>
                <div class="text-amber-300 font-semibold">★ ${card.highlight}</div>
                <div class="text-slate-300 italic">🧠 ${card.hook}</div>
              </div>
              <button onclick="window.app.nextClozeRound()" class="w-full py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs uppercase tracking-wider transition">
                Next Formula Fill-In →
              </button>
            ` : ""}
          </div>
        `;
      }

      // Minigame 2: Hook-to-Formula Matcher (Relaxed Pattern Recognition)
      renderMatcherGame() {
        const { streak, score, round, pickedId, showHint } = this.matcherState;
        const { target, options } = round;

        return `
          <div class="arcade-card border border-indigo-400/40 rounded-2xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-3 pb-2.5 border-b border-slate-800">
              <div>
                <span class="text-xs font-bold text-indigo-300">⚡ Hook-to-Formula Matcher</span>
                <p class="text-[11px] text-slate-400">Match the memory hook & condition to its exact mathematical formula.</p>
              </div>
              <span class="font-mono-code text-xs font-bold px-2.5 py-1 rounded bg-amber-400/20 text-amber-300 border border-amber-400/30">🔥 Streak: ${streak} | ${score} pts</span>
            </div>

            <div class="mb-4">
              <div class="flex justify-between items-center mb-1">
                <span class="text-[10px] font-mono-code uppercase text-amber-400">${target.topic} • ${target.subtopic}</span>
                <button onclick="window.app.toggleMatcherHint()" class="text-[11px] text-indigo-300 hover:underline">💡 ${showHint ? "Hide Title" : "Show Concept Title"}</button>
              </div>
              ${showHint ? `<div class="text-xs font-bold text-white mb-1.5">${target.title}</div>` : ""}
              <div class="p-4 rounded-xl bg-slate-900 border border-slate-700 space-y-2">
                <div class="text-sm font-bold text-amber-300">🧠 "${target.hook}"</div>
                <div class="text-xs text-slate-300">★ ${target.highlight}</div>
              </div>
            </div>

            <div class="space-y-2.5 mb-4">
              ${options.map(opt => {
                let cls = "bg-slate-800/90 hover:bg-slate-700 border-slate-600 text-slate-100";
                if (pickedId !== null) {
                  if (opt.id === target.id) cls = "bg-emerald-950 border-emerald-400 text-emerald-200 font-bold";
                  else if (opt.id === pickedId) cls = "bg-rose-950 border-rose-500 text-rose-200";
                  else cls = "bg-slate-900 border-slate-800 opacity-40";
                }
                return `
                  <button
                    ${pickedId !== null ? "disabled" : ""}
                    onclick="window.app.pickMatcherOption('${opt.id}')"
                    class="w-full text-left p-3.5 rounded-xl border font-mono-code text-xs transition ${cls}"
                  >
                    ${opt.formula}
                  </button>
                `;
              }).join("")}
            </div>

            ${pickedId !== null ? `
              <button onclick="window.app.nextMatcherRound()" class="w-full py-3 rounded-xl bg-indigo-500 hover:bg-indigo-400 text-white font-black text-xs uppercase tracking-wider transition">
                Next Hook Match →
              </button>
            ` : ""}
          </div>
        `;
      }

      // Minigame 3: Zen Flashcard Flip (Self-Paced Active Recall)
      renderFlashcardGame() {
        if (!this.flashState.active) {
          return `
            <div class="arcade-card border border-slate-700 rounded-2xl p-6 text-center shadow-2xl">
              <div class="text-3xl mb-2">🃏</div>
              <h2 class="text-lg font-black text-white mb-1">Zen Flashcard Flip (10-Card Recall Hand)</h2>
              <p class="text-xs text-slate-300 max-w-md mx-auto mb-4">
                Zero timers, zero stress. Deals 10 formula cards weighted toward your <strong>⚡ Revise Queue</strong> and <strong>🔖 Saved</strong> list. Mentally picture the formula from the title & hook, tap to reveal, and mark whether you consolidated it!
              </p>
              ${this.flashState.deck.length > 0 ? `<div class="mb-4 p-3 rounded-xl bg-emerald-400/10 border border-emerald-400/30 text-emerald-300 text-xs font-bold">Last Hand Consolidated: ${this.flashState.nailedCount} / ${this.flashState.deck.length} Formulae</div>` : ""}
              <button onclick="window.app.startFlashcards()" class="w-full max-w-xs py-3 rounded-xl bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-black text-xs uppercase tracking-wider shadow-lg shadow-emerald-500/20 transition">
                Deal 10 Formula Cards →
              </button>
            </div>
          `;
        }

        const { index, deck, revealed, nailedCount } = this.flashState;
        const card = deck[index];
        const progressPct = ((index + 1) / deck.length) * 100;

        return `
          <div class="arcade-card border border-emerald-400/40 rounded-2xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-2 text-xs font-mono-code">
              <span class="text-emerald-300">Card ${index + 1} of ${deck.length}</span>
              <span class="text-amber-300">✅ Consolidated: ${nailedCount}</span>
            </div>

            <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-4">
              <div class="h-full bg-emerald-400 transition-all duration-300" style="width: ${progressPct}%"></div>
            </div>

            <div class="text-[10px] font-mono-code uppercase text-emerald-400 mb-1">${card.topic} • ${card.subtopic}</div>
            <h3 class="text-base font-bold text-white mb-2">${card.title}</h3>

            <div class="p-3 rounded-xl bg-slate-900/90 border border-slate-800 text-xs text-amber-300 italic mb-3">
              🧠 Clue Hook: "${card.hook}"
            </div>

            <!-- Tap-to-Reveal Formula & Conditions Zone -->
            <div
              onclick="window.app.revealFlashcard()"
              class="cursor-pointer p-4 rounded-xl bg-indigo-950/60 border border-indigo-500/30 transition-all ${revealed ? '' : 'blur-md select-none'}"
            >
              <div class="font-mono-code text-xs text-indigo-100 mb-2">${card.formula}</div>
              <div class="text-xs font-semibold text-amber-300 mb-2">★ ${card.highlight}</div>
              <ul class="space-y-1 text-[11px] text-indigo-200 list-disc pl-4">
                ${card.bullets.map(b => `<li>${b}</li>`).join("")}
              </ul>
            </div>

            ${!revealed ? `
              <button onclick="window.app.revealFlashcard()" class="mt-4 w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold text-xs border border-slate-700">
                👁️ Tap to Reveal Formula
              </button>
            ` : `
              <div class="grid grid-cols-2 gap-2.5 mt-4">
                <button onclick="window.app.gradeFlashcard(false)" class="py-3 rounded-xl bg-rose-600/20 hover:bg-rose-600/30 border border-rose-500/40 text-rose-200 font-bold text-xs">
                  🔄 Review Again (To Queue)
                </button>
                <button onclick="window.app.gradeFlashcard(true)" class="py-3 rounded-xl bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-black text-xs">
                  ✅ Consolidated (+8 XP)
                </button>
              </div>
            `}
          </div>
        `;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      window.app = new QuantApp();
    });
  </script>
</body>
</html>
