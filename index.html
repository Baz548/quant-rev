<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QuantByProf v2.1 — 26-Chapter Master Syllabus Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap');

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    /* 1. Revise Theme: Royal Indigo & Warm Study Ivory */
    body.theme-revise {
      background-color: #f6f5ff;
      color: #1e1b4b;
    }
    .revise-card-gradient {
      background: linear-gradient(135deg, #1e1b4b 0%, #3730a3 100%);
    }

    /* 2. Questions Theme: Cyber Teal & Crisp Slate Arena */
    body.theme-questions {
      background-color: #ecfeff;
      color: #042f2e;
    }
    .questions-header-gradient {
      background: linear-gradient(135deg, #042f2e 0%, #0d9488 100%);
    }

    /* 3. Arcade Theme: Electric Amber & Deep Slate */
    body.theme-arcade {
      background-color: #0f172a;
      color: #f8fafc;
    }
    .arcade-gradient {
      background: linear-gradient(135deg, #311042 0%, #7c2d12 50%, #b45309 100%);
    }
    .arcade-card {
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
    }

    /* Hide scrollbars for horizontal pill bars */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="theme-revise min-h-screen flex flex-col pb-20">

  <!-- TOP NAVIGATION BAR -->
  <header id="app-header" class="sticky top-0 z-40 shadow-md transition-colors duration-300 bg-[#1e1b4b] text-white">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="font-black text-lg tracking-tight">QuantByProf</span>
        <span id="version-badge" class="text-[10px] font-mono-code uppercase px-2 py-0.5 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/40 font-semibold">v2.1 • 26 Ch</span>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="window.app.openAddModal()" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/15 transition">+ Add</button>
        <button onclick="window.app.openSyncModal()" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/15 transition">Sync</button>
      </div>
    </div>

    <!-- PRIMARY MODE SWITCHER (Revise | Questions | Arcade) -->
    <div class="max-w-3xl mx-auto px-4 pb-2.5">
      <div class="grid grid-cols-3 gap-1.5 bg-black/25 p-1 rounded-xl">
        <button id="tab-revise" onclick="window.app.setSection('revise')" class="py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1">
          <span>📖 Revise</span>
        </button>
        <button id="tab-questions" onclick="window.app.setSection('questions')" class="py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1">
          <span>🎯 Questions</span>
        </button>
        <button id="tab-arcade" onclick="window.app.setSection('arcade')" class="py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1">
          <span>🎮 Minigames</span>
        </button>
      </div>
    </div>

    <!-- 1. SHARED PARENT TOPIC PILL BAR (6 PILLS + ALL) -->
    <div class="border-t border-white/10 bg-black/15">
      <div id="topic-bar" class="max-w-3xl mx-auto px-4 py-2 flex space-x-2 overflow-x-auto no-scrollbar"></div>
    </div>

    <!-- 2. NEW SUBTOPIC (26 CHAPTERS) MENU BAR -->
    <div class="border-t border-white/10 bg-black/30">
      <div class="max-w-3xl mx-auto px-4 py-2 flex items-center space-x-2">
        <span class="text-[10px] font-mono-code uppercase tracking-wider text-amber-300 font-bold shrink-0">📑 Subtopic:</span>
        <select
          id="subtopic-select"
          onchange="window.app.setSubtopic(this.value)"
          class="bg-white/10 hover:bg-white/15 text-white text-xs font-semibold rounded-lg px-2.5 py-1.5 border border-white/20 focus:outline-none focus:border-amber-400 shrink-0 max-w-[210px] sm:max-w-xs truncate"
        ></select>
        <div id="subtopic-pills" class="flex space-x-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
      </div>
    </div>
  </header>

  <!-- SUB-FILTER / ARCADE MODE BAR -->
  <div id="subfilter-container" class="max-w-3xl w-full mx-auto px-4 pt-3">
    <div id="subfilter-bar" class="flex space-x-2 overflow-x-auto no-scrollbar pb-1"></div>
  </div>

  <!-- MAIN VIEWPORT -->
  <main id="main-content" class="max-w-3xl w-full mx-auto px-4 pt-3 flex-1"></main>

  <!-- CONCEPT SHIELD / REFERENCE POPUP MODAL -->
  <div id="concept-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl border border-indigo-400/30 bg-[#1e1b4b] text-white p-5">
      <div class="flex justify-between items-start mb-3">
        <span id="modal-concept-badge" class="text-[11px] font-mono-code uppercase px-2.5 py-0.5 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/40">🛡️ Concept Shield</span>
        <button onclick="window.app.closeConceptModal()" class="text-white/60 hover:text-white text-lg leading-none">&times;</button>
      </div>
      <h3 id="modal-concept-title" class="text-base font-bold text-white mb-2"></h3>
      <div class="p-3 rounded-xl bg-black/30 border border-white/10 font-mono-code text-xs text-indigo-200 mb-2" id="modal-concept-formula"></div>
      <div class="p-2.5 rounded-lg bg-amber-400/15 border border-amber-400/40 text-amber-200 text-xs font-semibold mb-3" id="modal-concept-highlight"></div>
      <ul id="modal-concept-bullets" class="space-y-1.5 text-xs text-indigo-100 mb-3 list-disc pl-4"></ul>
      <div class="text-xs italic text-amber-300 bg-black/20 p-2.5 rounded-lg border border-white/5" id="modal-concept-hook"></div>
      <button onclick="window.app.closeConceptModal()" class="mt-4 w-full py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs transition">Got It — Continue</button>
    </div>
  </div>

  <!-- + ADD CUSTOM ITEM MODAL -->
  <div id="add-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="w-full max-w-lg rounded-2xl bg-white text-slate-900 p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-base">Add Custom Concept Card</h3>
        <button onclick="window.app.closeAddModal()" class="text-slate-400 hover:text-slate-700 text-xl">&times;</button>
      </div>
      <form id="add-form" onsubmit="window.app.saveCustomConcept(event)" class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-semibold mb-1">Topic (6 Categories)</label>
            <select id="add-topic" onchange="window.app.populateAddSubtopics()" class="w-full p-2 rounded-lg border border-slate-300">
              <option value="Algebra">Algebra</option>
              <option value="Number Theory">Number Theory</option>
              <option value="Geometry">Geometry</option>
              <option value="Ratio & Mixtures">Ratio & Mixtures</option>
              <option value="Arithmetic">Arithmetic</option>
              <option value="Modern Math">Modern Math</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold mb-1">Subtopic (26 Chapters)</label>
            <select id="add-subtopic" class="w-full p-2 rounded-lg border border-slate-300"></select>
          </div>
        </div>
        <div>
          <label class="block font-semibold mb-1">Concept Title</label>
          <input id="add-title" required placeholder="e.g., Vieta's Root Relations" class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Core Formula</label>
          <input id="add-formula" required placeholder="e.g., α + β = -b/a, αβ = c/a" class="w-full p-2 rounded-lg border border-slate-300 font-mono-code" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Gold Highlight (Key Condition)</label>
          <input id="add-highlight" required placeholder="e.g., Sum of roots flips sign; product keeps sign" class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Recognition / Trap Bullet 1</label>
          <input id="add-b1" required placeholder="Pattern recognition trigger..." class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Recognition / Trap Bullet 2</label>
          <input id="add-b2" required placeholder="Common exam converse trap..." class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">1-Line Memory Hook</label>
          <input id="add-hook" required placeholder="Short punchy mnemonic..." class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold">Save Concept Card</button>
      </form>
    </div>
  </div>

  <!-- SYNC (EXPORT / IMPORT JSON) MODAL -->
  <div id="sync-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="w-full max-w-lg rounded-2xl bg-white text-slate-900 p-5 shadow-2xl">
      <div class="flex justify-between items-center mb-2">
        <h3 class="font-bold text-base">State Backup & JSON Sync</h3>
        <button onclick="window.app.closeSyncModal()" class="text-slate-400 hover:text-slate-700 text-xl">&times;</button>
      </div>
      <p class="text-xs text-slate-500 mb-3">Copy your `quantbyprof_v2_state` JSON backup or paste an existing state string below to restore progress and arcade stats.</p>
      <textarea id="sync-textarea" rows="7" class="w-full p-3 rounded-xl border border-slate-300 font-mono-code text-[11px] mb-3 focus:outline-none focus:border-indigo-600"></textarea>
      <div class="flex space-x-2">
        <button onclick="window.app.copySyncState()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-white font-bold text-xs">📋 Copy Backup</button>
        <button onclick="window.app.restoreSyncState()" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs">⚡ Restore State</button>
      </div>
    </div>
  </div>

  <!-- APPLICATION SCRIPT (ZERO-COMPILE ES6) -->
  <script>
    // =========================================================================
    // 1. MASTER 6 TOPICS & 26 CHAPTERS MAPPING (T.I.M.E. Booklets 1, 2, 3)
    // =========================================================================
    const TOPICS = [
      "All",
      "Algebra",
      "Number Theory",
      "Geometry",
      "Ratio & Mixtures",
      "Arithmetic",
      "Modern Math"
    ];

    const TOPIC_CHAPTERS = {
      "Algebra": [
        "Simple Equations",
        "Special Equations",
        "Quadratic Equations",
        "Inequalities and Modulus",
        "Sequences and Series",
        "Functions",
        "Graphs",
        "Indices – Surds",
        "Logarithms",
        "Operator Based Questions"
      ],
      "Number Theory": [
        "Numbers – I",
        "Numbers – II",
        "Number Systems"
      ],
      "Geometry": [
        "Geometry",
        "Mensuration",
        "Co-ordinate Geometry",
        "Trigonometry"
      ],
      "Ratio & Mixtures": [
        "Ratio – Proportion – Variation",
        "Averages – Mixtures – Alligations"
      ],
      "Arithmetic": [
        "Percentages – Profit & Loss – Partnerships",
        "Simple Interest and Compound Interest",
        "Time and Distance",
        "Time and Work"
      ],
      "Modern Math": [
        "Permutations and Combinations",
        "Probability",
        "Statistics"
      ]
    };

    const ALL_26_CHAPTERS = Object.values(TOPIC_CHAPTERS).flat();

    // Reverse lookup helper: Subtopic -> Parent Topic
    const SUBTOPIC_TO_TOPIC = {};
    Object.entries(TOPIC_CHAPTERS).forEach(([t, subs]) => {
      subs.forEach(s => { SUBTOPIC_TO_TOPIC[s] = t; });
    });

    // =========================================================================
    // 2. SEED CONCEPTS (28 High-Yield Cards Covering All 26 Chapters)
    // =========================================================================
    const SEED_CONCEPTS = [
      // --- ALGEBRA (10 Chapters + Algebraic Identities) ---
      {
        id: "c_alg_1",
        topic: "Algebra",
        subtopic: "Simple Equations",
        title: "Euler's Conditional Cubic Identity (a + b + c = 0)",
        formula: "a³ + b³ + c³ − 3abc = (a + b + c)(a² + b² + c² − ab − bc − ca)",
        highlight: "If a + b + c = 0  ⟹  a³ + b³ + c³ = 3abc",
        bullets: [
          "Fraction form: (a²/bc) + (b²/ca) + (c²/ab) = 3 whenever a + b + c = 0.",
          "Converse trap: a³ + b³ + c³ = 3abc means EITHER a + b + c = 0 OR a = b = c."
        ],
        hook: "Zero sum kills the big bracket → cubes collapse to 3abc."
      },
      {
        id: "c_alg_2",
        topic: "Algebra",
        subtopic: "Simple Equations",
        title: "Linear System Consistency & Two-Digit Reversal Rule",
        formula: "|(10a + b) − (10b + a)| = 9|a − b|   |   (10a + b) + (10b + a) = 11(a + b)",
        highlight: "No Solution: a₁/a₂ = b₁/b₂ ≠ c₁/c₂   |   Infinite Solutions: a₁/a₂ = b₁/b₂ = c₁/c₂",
        bullets: [
          "For 3-digit number abc reversed to cba: |abc − cba| = 99|a − c| (middle digit cancels).",
          "Trap: Unique solution requires a₁/a₂ ≠ b₁/b₂ regardless of constant terms c₁, c₂."
        ],
        hook: "Digit swap difference is always a multiple of 9; sum is a multiple of 11."
      },
      {
        id: "c_alg_3",
        topic: "Algebra",
        subtopic: "Special Equations",
        title: "Linear Diophantine Equations (ax + by = N)",
        formula: "If (x₀, y₀) is one solution to ax + by = N  ⟹  x = x₀ + k·b,  y = y₀ − k·a",
        highlight: "Frobenius Coin Number: Largest N with NO non-negative solution is ab − a − b",
        bullets: [
          "Always verify gcd(a, b) divides N first; if not, zero integer solutions exist.",
          "Trap: Carefully distinguish 'positive integers' (x, y ≥ 1) from 'non-negative integers' (x, y ≥ 0)."
        ],
        hook: "Step x by b and step y backward by a in opposite directions."
      },
      {
        id: "c_alg_4",
        topic: "Algebra",
        subtopic: "Quadratic Equations",
        title: "Vieta's Root Relations & Symmetric Sum Transformation",
        formula: "α + β = −b/a,  αβ = c/a   |   a² + b² + c² − ab − bc − ca = ½[(a−b)² + (b−c)² + (c−a)²]",
        highlight: "Equation with reciprocal roots (1/α, 1/β) is cx² + bx + a = 0 (flip coefficients)",
        bullets: [
          "Difference of roots: |α − β| = √(b² − 4ac) / |a|. Extreme value occurs at vertex x = −b/(2a).",
          "Trap: Rational roots require Rational coefficients AND Discriminant D = b² − 4ac to be a perfect square."
        ],
        hook: "Sum flips sign (−b/a), Product keeps sign (c/a), Reciprocal flips the ends."
      },
      {
        id: "c_alg_5",
        topic: "Algebra",
        subtopic: "Inequalities and Modulus",
        title: "AM-GM Reciprocal Floor & Double Modulus Flat-Bottom",
        formula: "For x > 0: ax + b/x ≥ 2√(ab)   |   Min of |x − a| + |x − b| = |a − b|",
        highlight: "Equality in AM-GM holds iff all terms are equal; |x−a| + |x−b| is constant on [a, b]",
        bullets: [
          "For sum of odd number of moduli |x−a₁| + |x−a₂| + |x−a₃|, minimum is at the median value.",
          "Trap: Never cross-multiply an inequality by a variable expression without knowing its sign."
        ],
        hook: "Positive reciprocal sum? Equate the pieces; Modulus sum? Pick the median."
      },
      {
        id: "c_alg_6",
        topic: "Algebra",
        subtopic: "Sequences and Series",
        title: "AP-GP-HP Means & Telescoping Partial Fractions",
        formula: "G² = A · H   |   ∑ 1 / [n(n + d)] = (1/d) × [First Term − Last Term]",
        highlight: "If S_n = an² + bn (zero constant term), the series is an AP with common difference d = 2a",
        bullets: [
          "Sum of first n odd natural numbers is n²; sum of cubes ∑k³ = [n(n+1)/2]².",
          "Trap: T_n = S_n − S_(n−1) applies only for n ≥ 2; always check T₁ = S₁ separately if constant c ≠ 0."
        ],
        hook: "Double the n² coefficient of S_n to get the AP common difference Instantly."
      },
      {
        id: "c_alg_7",
        topic: "Algebra",
        subtopic: "Functions",
        title: "Standard Functional Equations & Inverse Symmetry",
        formula: "f(x + y) = f(x) + f(y) ⟹ f(x) = kx   |   f(x)·f(1/x) = f(x) + f(1/x) ⟹ f(x) = 1 ± xⁿ",
        highlight: "f(x + y) = f(x)·f(y) ⟹ f(x) = aˣ   |   f(xy) = f(x) + f(y) ⟹ f(x) = k·log(x)",
        bullets: [
          "A function has an inverse f⁻¹ iff it is strictly Bijective (both One-to-One and Onto).",
          "Trap: Self-inverse functions of form f(x) = (ax + b)/(cx − a) always satisfy f(f(x)) = x."
        ],
        hook: "Product equals sum for x and 1/x? Power expression 1 ± xⁿ."
      },
      {
        id: "c_alg_8",
        topic: "Algebra",
        subtopic: "Graphs",
        title: "Graph Shifts, Reflections & Modulus Diamond Area",
        formula: "Area enclosed by a|x| + b|y| = c is (2c²) / (ab)",
        highlight: "y = f(|x|) mirrors right half onto left; y = |f(x)| flips negative lobes upward",
        bullets: [
          "f(x − h) shifts graph RIGHT by h units; f(x) + k shifts graph UP by k units.",
          "Trap: Number of real solutions to f(x) = g(x) is the number of intersection points of their graphs."
        ],
        hook: "Modulus diamond area is 2c² over ab."
      },
      {
        id: "c_alg_9",
        topic: "Algebra",
        subtopic: "Indices – Surds",
        title: "x + 1/x Power Ladder & Nested Square Root Surds",
        formula: "√(a + 2√b) = √x + √y  where x + y = a and xy = b",
        highlight: "If x + 1/x = k  ⟹  x² + 1/x² = k² − 2  and  x³ + 1/x³ = k³ − 3k",
        bullets: [
          "Infinite nested surd: √(a + √(a + √(a + …))) = [1 + √(1 + 4a)] / 2.",
          "Trap: To compare large powers like 2³⁰⁰ vs 3²⁰⁰, reduce exponents by gcd(300, 200) = 100 → compare 2³ vs 3²."
        ],
        hook: "Factor the inner surd under 2√b into two numbers that add to a."
      },
      {
        id: "c_alg_10",
        topic: "Algebra",
        subtopic: "Logarithms",
        title: "Base Power Extraction & Chain-Cancel Rule",
        formula: "log_(b^k)(x^m) = (m / k) · log_b(x)   |   a^(log_b c) = c^(log_b a)",
        highlight: "Number of digits in N is ⌊log₁₀(N)⌋ + 1",
        bullets: [
          "Telescoping base change: log_a(b) × log_b(c) × log_c(d) = log_a(d).",
          "Trap: Domain of log_b(x) requires x > 0 AND base b > 0, b ≠ 1. Always discard extraneous negative roots!"
        ],
        hook: "Input power jumps to numerator; Base power drops to denominator."
      },
      {
        id: "c_alg_11",
        topic: "Algebra",
        subtopic: "Operator Based Questions",
        title: "Custom Binary Operations, Identity & Inverse",
        formula: "For a * b = a + b + ab  ⟹  (a * b) + 1 = (a + 1)(b + 1)",
        highlight: "Identity e satisfies a * e = a; Inverse a⁻¹ satisfies a * a⁻¹ = e",
        bullets: [
          "In a * b = a + b + ab, identity is e = 0 and inverse of a is −a / (a + 1) (for a ≠ −1).",
          "Trap: Associativity a*(b*c) = (a*b)*c does NOT automatically mean commutativity a*b = b*a."
        ],
        hook: "See a + b + ab? Add 1 and factor into (a+1)(b+1)."
      },

      // --- NUMBER THEORY (3 Chapters) ---
      {
        id: "c_nt_1",
        topic: "Number Theory",
        subtopic: "Numbers – I",
        title: "Divisors, Odd-Factor Squares & HCF/LCM Remainder Models",
        formula: "If N = p₁^a · p₂^b · p₃^c  ⟹  d(N) = (a + 1)(b + 1)(c + 1)",
        highlight: "N has an ODD number of factors iff N is a Perfect Square",
        bullets: [
          "Largest divisor leaving remainders r₁, r₂ on A, B is HCF(A − r₁, B − r₂).",
          "Trap: Product of two numbers = HCF × LCM holds ONLY for two numbers, never for three."
        ],
        hook: "Add 1 to prime exponents and multiply; odd factor count means square."
      },
      {
        id: "c_nt_2",
        topic: "Number Theory",
        subtopic: "Numbers – II",
        title: "Euler's Totient, Fermat's Little Theorem & Legendre's n!",
        formula: "a^φ(n) ≡ 1 (mod n) for gcd(a,n) = 1   |   E_p(n!) = ⌊n/p⌋ + ⌊n/p²⌋ + ⌊n/p³⌋ + …",
        highlight: "Wilson's Theorem: (p − 1)! ≡ −1 (mod p)  and  (p − 2)! ≡ 1 (mod p) for prime p",
        bullets: [
          "Trailing zeroes of n! equals E₅(n!) because 5s are scarcer than 2s.",
          "Trap: Cyclicity of last digit is at most 4 (for 2, 3, 7, 8). If power mod 4 = 0, use power 4 (not 0)."
        ],
        hook: "Coprime base? Chop power by Totient φ(n); Factorial zeroes? Divide by 5s."
      },
      {
        id: "c_nt_3",
        topic: "Number Theory",
        subtopic: "Number Systems",
        title: "Base Conversion & Base-b Divisibility Rules",
        formula: "(d₂d₁d₀)_b = d₂·b² + d₁·b¹ + d₀   |   1 octal digit = 3 bits, 1 hex digit = 4 bits",
        highlight: "In base b: Sum of digits tests divisibility by (b − 1); Alternating sum tests (b + 1)",
        bullets: [
          "Largest k-digit number in base b is bᵏ − 1; smallest k-digit number is b^(k−1).",
          "Trap: Trailing zeroes of N in base b is the highest power of b dividing N."
        ],
        hook: "Base b−1 works just like 9 in base 10; Base b+1 works just like 11."
      },

      // --- GEOMETRY (4 Chapters) ---
      {

        question: "The difference between Compound Interest and Simple Interest on a certain sum at 10% per annum for 2 years is ₹65. What is the principal sum?",
        options: ["₹6,500", "₹5,000", "₹6,000", "₹13,000"],
        correctIndex: 0,
        shortcut: "2-Yr (CI − SI) = P(R/100)² ⇒ 65 = P(10/100)² = P / 100 ⇒ P = ₹6,500.",
        trap: "Using R/100 instead of (R/100)².",
        concept_ref: "c_ar_2"
      },
      {
        id: "q_ar_3",
        topic: "Arithmetic",
        subtopic: "Time and Distance",
        difficulty: "Medium",
        question: "Trains A and B start simultaneously from stations X and Y toward each other. After passing each other, A takes 9 hours to reach Y and B takes 4 hours to reach X. If A's speed is 40 km/hr, what is B's speed?",
        options: ["50 km/hr", "60 km/hr", "80 km/hr", "90 km/hr"],
        correctIndex: 1,
        shortcut: "S_A / S_B = √(t_B / t_A) = √(4 / 9) = 2 / 3. Given S_A = 40, we get S_B = 40 × (3/2) = 60 km/hr.",
        trap: "Using linear ratio 9:4 or forgetting the square root.",
        concept_ref: "c_ar_3"
      },
      {
        id: "q_ar_4",
        topic: "Arithmetic",
        subtopic: "Time and Work",
        difficulty: "Medium",
        question: "A alone takes 16 days more than (A + B) together to complete a job, while B alone takes 9 days more than (A + B) together. In how many days can (A + B) finish the job together?",
        options: ["10 days", "12 days", "12.5 days", "14 days"],
        correctIndex: 1,
        shortcut: "Combined time T = √(a × b) = √(16 × 9) = 4 × 3 = 12 days.",
        trap: "Taking the arithmetic average (16 + 9)/2 = 12.5 days.",
        concept_ref: "c_ar_4"
      },

      // --- MODERN MATH ---
      {
        id: "q_mm_1",
        topic: "Modern Math",
        subtopic: "Permutations and Combinations",
        difficulty: "Medium",
        question: "In how many ways can 5 boys and 4 girls sit around a circular table such that no two girls sit adjacent to each other?",
        options: ["2,880", "14,400", "576", "1,152"],
        correctIndex: 0,
        shortcut: "Seat 5 boys around a circle in (5 − 1)! = 24 ways. This creates 5 gaps between boys. Seat 4 girls in 5 gaps in ⁵P₄ = 120 ways. Total = 24 × 120 = 2,880.",
        trap: "Using 5! = 120 instead of (5 − 1)! = 24 for the first circular arrangement.",
        concept_ref: "c_mm_1"
      },
      {
        id: "q_mm_2",
        topic: "Modern Math",
        subtopic: "Probability",
        difficulty: "Easy",
        question: "Three students A, B, and C independently attempt to solve a problem with probabilities of success 1/2, 1/3, and 1/4 respectively. What is the probability that the problem is solved?",
        options: ["1/4", "3/4", "23/24", "1/24"],
        correctIndex: 1,
        shortcut: "P(Solved) = 1 − P(None solve) = 1 − (1 − 1/2)(1 − 1/3)(1 − 1/4) = 1 − (1/2)(2/3)(3/4) = 1 − 1/4 = 3/4.",
        trap: "Adding 1/2 + 1/3 + 1/4 directly as if mutually exclusive.",
        concept_ref: "c_mm_2"
      },
      {
        id: "q_mm_3",
        topic: "Modern Math",
        subtopic: "Statistics",
        difficulty: "Easy",
        question: "The standard deviation of 15 observations is 6. If each observation is multiplied by 3 and then increased by 10, what is the new standard deviation?",
        options: ["6", "16", "18", "28"],
        correctIndex: 2,
        shortcut: "SD(aX + b) = |a|·SD(X). Adding 10 has zero effect on spread; multiplying by 3 scales SD to 3 × 6 = 18.",
        trap: "Adding 10 to get 18 + 10 = 28.",
        concept_ref: "c_mm_3"
      }
    ];

    // =========================================================================
    // 4. STATE MANAGEMENT & LOCALSTORAGE (quantbyprof_v2_state)
    // =========================================================================
    const STORAGE_KEY = "quantbyprof_v2_state";

    const defaultState = () => ({
      savedConcepts: [],
      reviseQueue: [],
      masteredConcepts: [],
      savedQuestions: [],
      questionStatus: {}, // { q_id: 'correct' | 'retry' }
      customConcepts: [],
      arcade: {
        xp: 0,
        blitzHigh: 0,
        survivalBest: 0,
        trapSessions: 0
      }
    });

    class QuantApp {
      constructor() {
        this.state = this.loadState();
        this.section = "revise"; // 'revise' | 'questions' | 'arcade'
        this.topic = "All"; // 'All' | 6 Parent Topics
        this.subtopic = "All"; // 'All' | Any of the 26 Chapters
        this.reviseSub = "all"; // 'all' | 'saved' | 'queue' | 'mastered'
        this.questionSub = "all"; // 'all' | 'unattempted' | 'retry' | 'saved' | 'correct'
        this.arcadeGame = "blitz"; // 'blitz' | 'survival' | 'traphunter'

        this.selectedAnswers = {};
        this.openShortcuts = {};

        this.activeTimer = null;
        this.blitzState = { active: false, timeLeft: 60, score: 0, streak: 0, current: null, feedback: null };
        this.survivalState = { active: false, hearts: 3, timeLeft: 60, score: 0, streak: 0, qIndex: 0, deck: [], answered: null };
        this.trapState = { active: false, index: 0, deck: [], revealed: false, timeLeft: 10, nailedCount: 0 };

        this.populateAddSubtopics();
        this.renderAll();
      }

      loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultState();
          const parsed = JSON.parse(raw);
          return {
            ...defaultState(),
            ...parsed,
            arcade: { ...defaultState().arcade, ...(parsed.arcade || {}) }
          };
        } catch (e) {
          return defaultState();
        }
      }

      saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      }

      getAllConcepts() {
        return [...SEED_CONCEPTS, ...(this.state.customConcepts || [])];
      }

      getAvailableSubtopics() {
        if (this.topic === "All") return ALL_26_CHAPTERS;
        return TOPIC_CHAPTERS[this.topic] || ALL_26_CHAPTERS;
      }

      getFilteredConcepts() {
        let list = this.getAllConcepts();
        if (this.topic !== "All") list = list.filter(c => c.topic === this.topic);
        if (this.subtopic !== "All") list = list.filter(c => c.subtopic === this.subtopic);
        if (this.reviseSub === "saved") list = list.filter(c => this.state.savedConcepts.includes(c.id));
        if (this.reviseSub === "queue") list = list.filter(c => this.state.reviseQueue.includes(c.id));
        if (this.reviseSub === "mastered") list = list.filter(c => this.state.masteredConcepts.includes(c.id));
        return list;
      }

      getFilteredQuestions() {
        let list = [...SEED_QUESTIONS];
        if (this.topic !== "All") list = list.filter(q => q.topic === this.topic);
        if (this.subtopic !== "All") list = list.filter(q => q.subtopic === this.subtopic);
        if (this.questionSub === "unattempted") list = list.filter(q => !this.state.questionStatus[q.id]);
        if (this.questionSub === "retry") list = list.filter(q => this.state.questionStatus[q.id] === "retry");
        if (this.questionSub === "saved") list = list.filter(q => this.state.savedQuestions.includes(q.id));
        if (this.questionSub === "correct") list = list.filter(q => this.state.questionStatus[q.id] === "correct");
        return list;
      }

      clearTimers() {
        if (this.activeTimer) {
          clearInterval(this.activeTimer);
          this.activeTimer = null;
        }
      }

      // =======================================================================
      // NAVIGATION, TOPIC & 26-CHAPTER SUBTOPIC SWITCHING
      // =======================================================================
      setSection(sec) {
        this.clearTimers();
        this.blitzState.active = false;
        this.survivalState.active = false;
        this.trapState.active = false;
        this.section = sec;

        const body = document.body;
        const header = document.getElementById("app-header");
        body.classList.remove("theme-revise", "theme-questions", "theme-arcade");

        if (sec === "revise") {
          body.classList.add("theme-revise");
          header.className = "sticky top-0 z-40 shadow-md transition-colors duration-300 bg-[#1e1b4b] text-white";
        } else if (sec === "questions") {
          body.classList.add("theme-questions");
          header.className = "sticky top-0 z-40 shadow-md transition-colors duration-300 questions-header-gradient text-white";
        } else {
          body.classList.add("theme-arcade");
          header.className = "sticky top-0 z-40 shadow-md transition-colors duration-300 arcade-gradient text-white";
        }

        this.renderAll();
      }

      setTopic(t) {
        this.topic = t;
        // Reset subtopic if it doesn't belong to the newly chosen topic
        if (t !== "All" && this.subtopic !== "All") {
          const validSubs = TOPIC_CHAPTERS[t] || [];
          if (!validSubs.includes(this.subtopic)) {
            this.subtopic = "All";
          }
        }
        this.renderAll();
      }

      setSubtopic(sub) {
        this.subtopic = sub;
        // If a specific chapter is chosen while topic is mismatched, sync topic
        if (sub !== "All" && this.topic !== "All") {
          const parentTopic = SUBTOPIC_TO_TOPIC[sub];
          if (parentTopic && parentTopic !== this.topic) {
            this.topic = parentTopic;
          }
        }
        this.renderAll();
      }

      setReviseSub(sub) {
        this.reviseSub = sub;
        this.renderAll();
      }

      setQuestionSub(sub) {
        this.questionSub = sub;
        this.renderAll();
      }

      setArcadeGame(game) {
        this.clearTimers();
        this.blitzState.active = false;
        this.survivalState.active = false;
        this.trapState.active = false;
        this.arcadeGame = game;
        this.renderAll();
      }

      // =======================================================================
      // STATE MUTATIONS
      // =======================================================================
      toggleArrayItem(arr, id) {
        const idx = arr.indexOf(id);
        if (idx === -1) arr.push(id);
        else arr.splice(idx, 1);
        this.saveState();
        this.renderAll();
      }

      answerQuestion(qId, optIdx, correctIdx) {
        this.selectedAnswers[qId] = optIdx;
        if (optIdx === correctIdx) {
          this.state.questionStatus[qId] = "correct";
          this.state.arcade.xp += 5;
        } else {
          this.state.questionStatus[qId] = "retry";
          const q = SEED_QUESTIONS.find(item => item.id === qId);
          if (q && q.concept_ref && !this.state.reviseQueue.includes(q.concept_ref)) {
            this.state.reviseQueue.push(q.concept_ref);
          }
        }
        this.saveState();
        this.renderMain();
        this.renderSubfilters();
      }

      retryQuestion(qId) {
        delete this.selectedAnswers[qId];
        this.renderMain();
      }

      toggleShortcut(qId) {
        this.openShortcuts[qId] = !this.openShortcuts[qId];
        this.renderMain();
      }

      openConceptModal(conceptId, badgeLabel = "🛡️ Concept Shield") {
        const c = this.getAllConcepts().find(item => item.id === conceptId);
        if (!c) return;
        document.getElementById("modal-concept-badge").textContent = `${badgeLabel} • ${c.topic} • ${c.subtopic}`;
        document.getElementById("modal-concept-title").textContent = c.title;
        document.getElementById("modal-concept-formula").textContent = c.formula;
        document.getElementById("modal-concept-highlight").textContent = c.highlight;
        document.getElementById("modal-concept-bullets").innerHTML = c.bullets.map(b => `<li>${b}</li>`).join("");
        document.getElementById("modal-concept-hook").textContent = `💡 Hook: ${c.hook}`;
        document.getElementById("concept-modal").classList.remove("hidden");
      }

      closeConceptModal() {
        document.getElementById("concept-modal").classList.add("hidden");
      }

      // =======================================================================
      // MINIGAME 1: FORMULA BLITZ
      // =======================================================================
      getArcadeConceptPool() {
        let pool = this.getAllConcepts();
        if (this.topic !== "All") pool = pool.filter(c => c.topic === this.topic);
        if (this.subtopic !== "All") pool = pool.filter(c => c.subtopic === this.subtopic);
        return pool.length > 0 ? pool : this.getAllConcepts();
      }

      getArcadeQuestionPool() {
        let pool = [...SEED_QUESTIONS];
        if (this.topic !== "All") pool = pool.filter(q => q.topic === this.topic);
        if (this.subtopic !== "All") pool = pool.filter(q => q.subtopic === this.subtopic);
        return pool.length > 0 ? pool : [...SEED_QUESTIONS];
      }

      startBlitz() {
        this.clearTimers();
        this.blitzState = {
          active: true,
          timeLeft: 60,
          score: 0,
          streak: 0,
          current: this.generateBlitzRound(),
          feedback: null
        };
        this.activeTimer = setInterval(() => {
          this.blitzState.timeLeft -= 1;
          if (this.blitzState.timeLeft <= 0) {
            this.clearTimers();
            this.blitzState.active = false;
            if (this.blitzState.score > this.state.arcade.blitzHigh) {
              this.state.arcade.blitzHigh = this.blitzState.score;
              this.saveState();
            }
          }
          this.renderMain();
        }, 1000);
        this.renderMain();
      }

      generateBlitzRound() {
        const pool = this.getArcadeConceptPool();
        const fullPool = this.getAllConcepts();
        const target = pool[Math.floor(Math.random() * pool.length)] || fullPool[0];
        const distractors = fullPool
          .filter(c => c.id !== target.id)
          .sort(() => Math.random() - 0.5)
          .slice(0, 3);
        const useHighlight = Math.random() > 0.5;
        const options = [target, ...distractors]
          .sort(() => Math.random() - 0.5)
          .map(c => ({
            id: c.id,
            text: useHighlight ? c.highlight : c.formula
          }));
        return {
          target,
          promptType: Math.random() > 0.4 ? "hook" : "title",
          options
        };
      }

      pickBlitzOption(pickedId) {
        if (!this.blitzState.active) return;
        const { target } = this.blitzState.current;
        if (pickedId === target.id) {
          this.blitzState.streak += 1;
          const mult = this.blitzState.streak >= 6 ? 4 : this.blitzState.streak >= 3 ? 2 : 1;
          const pts = 10 * mult;
          this.blitzState.score += pts;
          this.state.arcade.xp += 3;
          this.blitzState.feedback = `✅ +${pts} pts (${mult}x Combo!)`;
        } else {
          this.blitzState.streak = 0;
          this.blitzState.feedback = `❌ Missed! Added "${target.subtopic}" to ⚡ Revise Queue`;
          if (!this.state.reviseQueue.includes(target.id)) {
            this.state.reviseQueue.push(target.id);
          }
        }
        if (this.blitzState.score > this.state.arcade.blitzHigh) {
          this.state.arcade.blitzHigh = this.blitzState.score;
        }
        this.saveState();
        this.blitzState.current = this.generateBlitzRound();
        this.renderMain();
      }

      // =======================================================================
      // MINIGAME 2: SURVIVAL ARENA
      // =======================================================================
      startSurvival() {
        this.clearTimers();
        const basePool = this.getArcadeQuestionPool();

        const prioritized = basePool.sort((a, b) => {
          const sa = this.state.questionStatus[a.id];
          const sb = this.state.questionStatus[b.id];
          const weight = s => (s === "retry" ? 0 : !s ? 1 : 2);
          return weight(sa) - weight(sb) || Math.random() - 0.5;
        });

        this.survivalState = {
          active: true,
          hearts: 3,
          timeLeft: 60,
          score: 0,
          streak: 0,
          qIndex: 0,
          deck: prioritized,
          answered: null
        };
        this.startSurvivalShotClock();
        this.renderMain();
      }

      startSurvivalShotClock() {
        this.clearTimers();
        this.survivalState.timeLeft = 60;
        this.activeTimer = setInterval(() => {
          if (this.survivalState.answered !== null) return;
          this.survivalState.timeLeft -= 1;
          if (this.survivalState.timeLeft <= 0) {
            this.handleSurvivalAnswer(-1);
          } else {
            this.renderMain();
          }
        }, 1000);
      }

      handleSurvivalAnswer(optIdx) {
        if (this.survivalState.answered !== null) return;
        this.survivalState.answered = optIdx;
        const currentQ = this.survivalState.deck[this.survivalState.qIndex];

        if (optIdx === currentQ.correctIndex) {
          this.survivalState.streak += 1;
          this.survivalState.score += 1;
          this.state.arcade.xp += 10;
          this.state.questionStatus[currentQ.id] = "correct";
          if (this.survivalState.streak % 3 === 0 && this.survivalState.hearts < 3) {
            this.survivalState.hearts += 1;
          }
          if (this.survivalState.score > this.state.arcade.survivalBest) {
            this.state.arcade.survivalBest = this.survivalState.score;
          }
        } else {
          this.survivalState.hearts -= 1;
          this.survivalState.streak = 0;
          this.state.questionStatus[currentQ.id] = "retry";
          if (currentQ.concept_ref) {
            if (!this.state.reviseQueue.includes(currentQ.concept_ref)) {
              this.state.reviseQueue.push(currentQ.concept_ref);
            }
            this.openConceptModal(currentQ.concept_ref, "🛡️ Shield Recovery");
          }
        }
        this.saveState();
        this.renderMain();
      }

      nextSurvivalQuestion() {
        if (this.survivalState.hearts <= 0 || this.survivalState.qIndex >= this.survivalState.deck.length - 1) {
          this.clearTimers();
          this.survivalState.active = false;
          this.renderMain();
          return;
        }
        this.survivalState.qIndex += 1;
        this.survivalState.answered = null;
        this.startSurvivalShotClock();
        this.renderMain();
      }

      // =======================================================================
      // MINIGAME 3: TRAP-HUNTER
      // =======================================================================
      startTrapHunter() {
        this.clearTimers();
        const pool = this.getArcadeConceptPool();

        const weighted = [...pool].sort((a, b) => {
          const wa = (this.state.reviseQueue.includes(a.id) ? -2 : 0) + (this.state.savedConcepts.includes(a.id) ? -1 : 0);
          const wb = (this.state.reviseQueue.includes(b.id) ? -2 : 0) + (this.state.savedConcepts.includes(b.id) ? -1 : 0);
          return wa - wb || Math.random() - 0.5;
        }).slice(0, 10);

        this.trapState = {
          active: true,
          index: 0,
          deck: weighted,
          revealed: false,
          timeLeft: 10,
          nailedCount: 0
        };
        this.startTrapTimer();
        this.renderMain();
      }

      startTrapTimer() {
        this.clearTimers();
        this.trapState.timeLeft = 10;
        this.activeTimer = setInterval(() => {
          if (this.trapState.revealed) return;
          this.trapState.timeLeft -= 1;
          if (this.trapState.timeLeft <= 0) {
            this.trapState.revealed = true;
            this.clearTimers();
          }
          this.renderMain();
        }, 1000);
      }

      revealTrapCard() {
        this.trapState.revealed = true;
        this.clearTimers();
        this.renderMain();
      }

      gradeTrapCard(nailed) {
        const card = this.trapState.deck[this.trapState.index];
        if (nailed) {
          this.trapState.nailedCount += 1;
          this.state.arcade.xp += 10;
          if (!this.state.masteredConcepts.includes(card.id)) {
            this.state.masteredConcepts.push(card.id);
          }
          const qIdx = this.state.reviseQueue.indexOf(card.id);
          if (qIdx !== -1) this.state.reviseQueue.splice(qIdx, 1);
        } else {
          if (!this.state.reviseQueue.includes(card.id)) {
            this.state.reviseQueue.push(card.id);
          }
        }
        this.saveState();

        if (this.trapState.index >= this.trapState.deck.length - 1) {
          this.clearTimers();
          this.trapState.active = false;
          this.state.arcade.trapSessions += 1;
          this.saveState();
          this.renderMain();
        } else {
          this.trapState.index += 1;
          this.trapState.revealed = false;
          this.startTrapTimer();
          this.renderMain();
        }
      }

      // =======================================================================
      // MODALS (+ ADD & SYNC)
      // =======================================================================
      populateAddSubtopics() {
        const topicEl = document.getElementById("add-topic");
        const subEl = document.getElementById("add-subtopic");
        if (!topicEl || !subEl) return;
        const subs = TOPIC_CHAPTERS[topicEl.value] || ALL_26_CHAPTERS;
        subEl.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join("");
      }

      openAddModal() {
        this.populateAddSubtopics();
        document.getElementById("add-modal").classList.remove("hidden");
      }
      closeAddModal() {
        document.getElementById("add-modal").classList.add("hidden");
      }
      saveCustomConcept(e) {
        e.preventDefault();
        const newCard = {
          id: "c_custom_" + Date.now(),
          topic: document.getElementById("add-topic").value,
          subtopic: document.getElementById("add-subtopic").value,
          title: document.getElementById("add-title").value.trim(),
          formula: document.getElementById("add-formula").value.trim(),
          highlight: document.getElementById("add-highlight").value.trim(),
          bullets: [
            document.getElementById("add-b1").value.trim(),
            document.getElementById("add-b2").value.trim()
          ],
          hook: document.getElementById("add-hook").value.trim()
        };
        this.state.customConcepts.push(newCard);
        this.saveState();
        document.getElementById("add-form").reset();
        this.closeAddModal();
        this.renderAll();
      }

      openSyncModal() {
        document.getElementById("sync-textarea").value = JSON.stringify(this.state, null, 2);
        document.getElementById("sync-modal").classList.remove("hidden");
      }
      closeSyncModal() {
        document.getElementById("sync-modal").classList.add("hidden");
      }
      copySyncState() {
        const el = document.getElementById("sync-textarea");
        el.select();
        navigator.clipboard.writeText(el.value);
        alert("State JSON copied to clipboard!");
      }
      restoreSyncState() {
        try {
          const parsed = JSON.parse(document.getElementById("sync-textarea").value);
          this.state = { ...defaultState(), ...parsed };
          this.saveState();
          this.closeSyncModal();
          this.renderAll();
        } catch (err) {
          alert("Invalid JSON string. Please check format.");
        }
      }

      // =======================================================================
      // RENDERING PIPELINE
      // =======================================================================
      renderAll() {
        this.renderHeaderTabs();
        this.renderTopicBar();
        this.renderSubtopicBar();
        this.renderSubfilters();
        this.renderMain();
      }

      renderHeaderTabs() {
        const activeStyle = "bg-white text-slate-950 shadow-sm";
        const idleStyle = "text-white/75 hover:text-white hover:bg-white/10";
        ["revise", "questions", "arcade"].forEach(s => {
          const btn = document.getElementById(`tab-${s}`);
          btn.className = `py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1 ${this.section === s ? activeStyle : idleStyle}`;
        });
      }

      renderTopicBar() {
        const container = document.getElementById("topic-bar");
        container.innerHTML = TOPICS.map(t => {
          const active = this.topic === t;
          return `<button onclick="window.app.setTopic('${t}')" class="px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition ${
            active ? "bg-amber-400 text-slate-950 shadow font-bold" : "bg-white/10 text-white/80 hover:bg-white/20"
          }">${t}</button>`;
        }).join("");
      }

      renderSubtopicBar() {
        const selectEl = document.getElementById("subtopic-select");
        const pillsEl = document.getElementById("subtopic-pills");

        // 1. Populate Dropdown Menu (Grouped by Topic when 'All' is active)
        if (this.topic === "All") {
          let html = `<option value="All" class="bg-slate-900 text-white">All 26 Chapters</option>`;
          Object.entries(TOPIC_CHAPTERS).forEach(([tName, chList]) => {
            html += `<optgroup label="── ${tName} ──" class="bg-slate-900 text-amber-300">`;
            chList.forEach(ch => {
              const sel = this.subtopic === ch ? "selected" : "";
              html += `<option value="${ch}" ${sel} class="bg-slate-900 text-white">${ch}</option>`;
            });
            html += `</optgroup>`;
          });
          selectEl.innerHTML = html;
        } else {
          const chList = TOPIC_CHAPTERS[this.topic] || [];
          let html = `<option value="All" class="bg-slate-900 text-white">All ${this.topic} (${chList.length} Ch)</option>`;
          chList.forEach(ch => {
            const sel = this.subtopic === ch ? "selected" : "";
            html += `<option value="${ch}" ${sel} class="bg-slate-900 text-white">${ch}</option>`;
          });
          selectEl.innerHTML = html;
        }

        // 2. Populate Quick-Tap Subtopic Pills alongside the dropdown
        const quickList = this.getAvailableSubtopics();
        pillsEl.innerHTML = ["All", ...quickList].map(ch => {
          const active = this.subtopic === ch;
          const label = ch === "All" ? "All Ch" : ch;
          return `<button onclick="window.app.setSubtopic('${ch}')" class="px-2.5 py-1 rounded-lg text-[11px] font-medium whitespace-nowrap transition border ${
            active
              ? "bg-white text-slate-950 border-white font-bold shadow-sm"
              : "bg-white/5 text-white/75 border-white/10 hover:bg-white/15"
          }">${label}</button>`;
        }).join("");
      }

      renderSubfilters() {
        const bar = document.getElementById("subfilter-bar");
        if (this.section === "revise") {
          const allConcepts = this.getAllConcepts();
          const items = [
            { id: "all", label: `All Concepts (${allConcepts.length})` },
            { id: "saved", label: `🔖 Saved (${this.state.savedConcepts.length})` },
            { id: "queue", label: `⚡ Revise Queue (${this.state.reviseQueue.length})` },
            { id: "mastered", label: `✅ Mastered (${this.state.masteredConcepts.length})` }
          ];
          bar.innerHTML = items.map(i => `
            <button onclick="window.app.setReviseSub('${i.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border transition ${
              this.reviseSub === i.id
                ? "bg-[#1e1b4b] text-white border-[#1e1b4b] shadow-sm"
                : "bg-white text-slate-700 border-indigo-100 hover:border-indigo-300"
            }">${i.label}</button>
          `).join("");
        } else if (this.section === "questions") {
          const unattempted = SEED_QUESTIONS.filter(q => !this.state.questionStatus[q.id]).length;
          const retry = SEED_QUESTIONS.filter(q => this.state.questionStatus[q.id] === "retry").length;
          const correct = SEED_QUESTIONS.filter(q => this.state.questionStatus[q.id] === "correct").length;
          const items = [
            { id: "all", label: `All Questions (${SEED_QUESTIONS.length})` },
            { id: "unattempted", label: `❓ Unattempted (${unattempted})` },
            { id: "retry", label: `❌ Needs Retry (${retry})` },
            { id: "saved", label: `🔖 Saved (${this.state.savedQuestions.length})` },
            { id: "correct", label: `✅ Correct (${correct})` }
          ];
          bar.innerHTML = items.map(i => `
            <button onclick="window.app.setQuestionSub('${i.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border transition ${
              this.questionSub === i.id
                ? "bg-[#042f2e] text-white border-[#042f2e] shadow-sm"
                : "bg-white text-teal-950 border-teal-200 hover:border-teal-400"
            }">${i.label}</button>
          `).join("");
        } else {
          const games = [
            { id: "blitz", label: "⚡ 1. Formula Blitz (60s)" },
            { id: "survival", label: "🛡️ 2. Survival Arena (3❤️)" },
            { id: "traphunter", label: "🃏 3. Trap-Hunter (Recall)" }
          ];
          bar.innerHTML = games.map(g => `
            <button onclick="window.app.setArcadeGame('${g.id}')" class="px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap border transition ${
              this.arcadeGame === g.id
                ? "bg-amber-400 text-slate-950 border-amber-300 shadow-lg shadow-amber-500/20"
                : "bg-slate-800 text-slate-300 border-slate-700 hover:border-slate-500"
            }">${g.label}</button>
          `).join("");
        }
      }

      renderMain() {
        const main = document.getElementById("main-content");
        if (this.section === "revise") {
          main.innerHTML = this.renderReviseSection();
        } else if (this.section === "questions") {
          main.innerHTML = this.renderQuestionsSection();
        } else {
          main.innerHTML = this.renderArcadeSection();
        }
      }

      // -----------------------------------------------------------------------
      // REVISE VIEW
      // -----------------------------------------------------------------------
      renderReviseSection() {
        const list = this.getFilteredConcepts();
        if (list.length === 0) {
          return `<div class="p-8 text-center bg-white rounded-2xl border border-indigo-100 text-slate-500 text-sm">
            No concept cards match <strong>${this.topic}</strong> → <strong>${this.subtopic}</strong> in this filter.
            <div class="mt-3"><button onclick="window.app.setSubtopic('All')" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold">Reset Subtopic Filter</button></div>
          </div>`;
        }
        return `<div class="space-y-4">${list.map(c => {
          const isSaved = this.state.savedConcepts.includes(c.id);
          const inQueue = this.state.reviseQueue.includes(c.id);
          const isMastered = this.state.masteredConcepts.includes(c.id);
          return `
            <article class="revise-card-gradient text-white rounded-2xl p-5 shadow-lg border border-indigo-400/20">
              <div class="flex justify-between items-center mb-2 gap-2">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="text-[10px] font-mono-code uppercase px-2.5 py-0.5 rounded-full bg-indigo-500/30 text-indigo-200 border border-indigo-400/30">${c.topic}</span>
                  <button onclick="window.app.setSubtopic('${c.subtopic}')" class="text-[11px] text-amber-300 hover:underline font-semibold">📑 ${c.subtopic}</button>
                </div>
                <div class="flex space-x-1.5 shrink-0">
                  <button onclick="window.app.toggleArrayItem(window.app.state.savedConcepts, '${c.id}')" class="px-2 py-1 rounded-lg text-xs border ${isSaved ? 'bg-amber-400 text-slate-950 border-amber-300 font-bold' : 'bg-white/10 text-white/70 border-white/10'}">🔖</button>
                  <button onclick="window.app.toggleArrayItem(window.app.state.reviseQueue, '${c.id}')" class="px-2 py-1 rounded-lg text-xs border ${inQueue ? 'bg-rose-500 text-white border-rose-400 font-bold' : 'bg-white/10 text-white/70 border-white/10'}">⚡</button>
                  <button onclick="window.app.toggleArrayItem(window.app.state.masteredConcepts, '${c.id}')" class="px-2 py-1 rounded-lg text-xs border ${isMastered ? 'bg-emerald-400 text-slate-950 border-emerald-300 font-bold' : 'bg-white/10 text-white/70 border-white/10'}">✅</button>
                </div>
              </div>
              <h2 class="text-base font-bold text-white mb-3">${c.title}</h2>
              <div class="p-3 rounded-xl bg-black/30 border border-indigo-300/20 font-mono-code text-xs text-indigo-100 mb-2.5 overflow-x-auto">${c.formula}</div>
              <div class="p-2.5 rounded-xl bg-amber-400/15 border border-amber-400/40 text-amber-200 text-xs font-semibold mb-3">★ ${c.highlight}</div>
              <ul class="space-y-1.5 text-xs text-indigo-100/90 mb-3 pl-4 list-disc">
                ${c.bullets.map(b => `<li>${b}</li>`).join("")}
              </ul>
              <div class="pt-2.5 border-t border-white/10 text-xs text-amber-300 font-medium flex items-center justify-between">
                <span>🧠 <em>${c.hook}</em></span>
              </div>
            </article>
          `;
        }).join("")}</div>`;
      }

      // -----------------------------------------------------------------------
      // QUESTIONS VIEW
      // -----------------------------------------------------------------------
      renderQuestionsSection() {
        const list = this.getFilteredQuestions();
        if (list.length === 0) {
          return `<div class="p-8 text-center bg-white rounded-2xl border border-teal-200 text-teal-900/60 text-sm">
            No questions match <strong>${this.topic}</strong> → <strong>${this.subtopic}</strong> in this filter.
            <div class="mt-3"><button onclick="window.app.setSubtopic('All')" class="px-3 py-1.5 rounded-lg bg-teal-800 text-white text-xs font-bold">Reset Subtopic Filter</button></div>
          </div>`;
        }
        return `<div class="space-y-4">${list.map((q, idx) => {
          const picked = this.selectedAnswers[q.id];
          const status = this.state.questionStatus[q.id];
          const isSaved = this.state.savedQuestions.includes(q.id);
          const showShortcut = this.openShortcuts[q.id];
          const diffColor = q.difficulty === "Easy"
            ? "bg-emerald-100 text-emerald-800 border-emerald-300"
            : q.difficulty === "Medium"
            ? "bg-amber-100 text-amber-800 border-amber-300"
            : "bg-rose-100 text-rose-800 border-rose-300";

          return `
            <article class="bg-white rounded-2xl p-5 shadow-md border border-teal-200 text-slate-900">
              <div class="flex justify-between items-center mb-2.5 gap-2">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="text-[10px] font-mono-code uppercase px-2 py-0.5 rounded bg-teal-900 text-teal-100 font-semibold">${q.topic}</span>
                  <button onclick="window.app.setSubtopic('${q.subtopic}')" class="text-[11px] font-semibold px-2 py-0.5 rounded bg-teal-50 text-teal-800 border border-teal-200 hover:bg-teal-100">📑 ${q.subtopic}</button>
                  <span class="text-[10px] font-semibold px-2 py-0.5 rounded border ${diffColor}">${q.difficulty}</span>
                  ${status === "correct" ? `<span class="text-xs font-bold text-emerald-600">✅ Solved</span>` : status === "retry" ? `<span class="text-xs font-bold text-rose-600">❌ Needs Retry</span>` : ""}
                </div>
                <button onclick="window.app.toggleArrayItem(window.app.state.savedQuestions, '${q.id}')" class="px-2.5 py-1 rounded-lg text-xs border shrink-0 ${isSaved ? 'bg-amber-400 border-amber-500 font-bold text-slate-950' : 'bg-slate-100 border-slate-200 text-slate-600'}">🔖</button>
              </div>
              <p class="text-sm font-semibold text-slate-900 mb-4 leading-relaxed">Q${idx + 1}. ${q.question}</p>
              <div class="space-y-2 mb-3">
                ${q.options.map((opt, oIdx) => {
                  let btnStyle = "bg-slate-50 border-slate-200 text-slate-800 hover:border-teal-500";
                  if (picked !== undefined) {
                    if (oIdx === q.correctIndex) btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-900 font-bold";
                    else if (picked === oIdx) btnStyle = "bg-rose-50 border-rose-500 text-rose-900 font-semibold";
                    else btnStyle = "bg-slate-50 border-slate-200 opacity-50";
                  }
                  return `
                    <button
                      ${picked !== undefined ? "disabled" : ""}
                      onclick="window.app.answerQuestion('${q.id}', ${oIdx}, ${q.correctIndex})"
                      class="w-full text-left p-3 rounded-xl border text-xs transition flex items-center justify-between ${btnStyle}"
                    >
                      <span><strong class="font-mono-code mr-2">${String.fromCharCode(65 + oIdx)}.</strong> ${opt}</span>
                      ${picked !== undefined && oIdx === q.correctIndex ? `<span class="text-emerald-600 font-bold">✓</span>` : ""}
                      ${picked !== undefined && picked === oIdx && oIdx !== q.correctIndex ? `<span class="text-rose-600 font-bold">✕</span>` : ""}
                    </button>
                  `;
                }).join("")}
              </div>

              <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-slate-100 text-xs">
                <div class="flex space-x-2">
                  <button onclick="window.app.toggleShortcut('${q.id}')" class="px-3 py-1.5 rounded-lg bg-teal-50 hover:bg-teal-100 text-teal-900 font-semibold border border-teal-200">
                    ${showShortcut ? "Hide Shortcut ▲" : "⚡ View Shortcut ▼"}
                  </button>
                  ${q.concept_ref ? `<button onclick="window.app.openConceptModal('${q.concept_ref}', '📖 Linked Concept')" class="px-3 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-semibold border border-indigo-200">🔗 Concept Card</button>` : ""}
                </div>
                ${picked !== undefined ? `<button onclick="window.app.retryQuestion('${q.id}')" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold">🔄 Retry</button>` : ""}
              </div>

              ${showShortcut || picked !== undefined ? `
                <div class="mt-3 p-3.5 rounded-xl bg-teal-950 text-teal-50 text-xs space-y-1.5">
                  <div><span class="text-amber-300 font-bold">⚡ 15-Sec Shortcut:</span> ${q.shortcut}</div>
                  <div><span class="text-rose-300 font-bold">⚠️ Exam Trap:</span> ${q.trap}</div>
                </div>
              ` : ""}
            </article>
          `;
        }).join("")}</div>`;
      }

      // -----------------------------------------------------------------------
      // ARCADE VIEW (COMBINED 3-IN-1 MINIGAME HUB)
      // -----------------------------------------------------------------------
      renderArcadeSection() {
        const statsBar = `
          <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="arcade-card border border-slate-800 rounded-xl p-3 text-center">
              <div class="text-[10px] font-mono-code uppercase text-slate-400">Total XP</div>
              <div class="text-base font-black text-amber-400">⚡ ${this.state.arcade.xp}</div>
            </div>
            <div class="arcade-card border border-slate-800 rounded-xl p-3 text-center">
              <div class="text-[10px] font-mono-code uppercase text-slate-400">Blitz Record</div>
              <div class="text-base font-black text-emerald-400">🏆 ${this.state.arcade.blitzHigh}</div>
            </div>
            <div class="arcade-card border border-slate-800 rounded-xl p-3 text-center">
              <div class="text-[10px] font-mono-code uppercase text-slate-400">Survival Best</div>
              <div class="text-base font-black text-rose-400">🔥 ${this.state.arcade.survivalBest} Qs</div>
            </div>
          </div>
        `;

        if (this.arcadeGame === "blitz") return statsBar + this.renderBlitzGame();
        if (this.arcadeGame === "survival") return statsBar + this.renderSurvivalGame();
        return statsBar + this.renderTrapHunterGame();
      }

      renderBlitzGame() {
        if (!this.blitzState.active) {
          return `
            <div class="arcade-card border border-slate-700 rounded-2xl p-6 text-center shadow-2xl">
              <div class="text-3xl mb-2">⚡</div>
              <h2 class="text-lg font-black text-white mb-1">Formula Blitz (60-Second Sprint)</h2>
              <p class="text-xs text-slate-300 max-w-md mx-auto mb-2">
                Active Filter: <strong class="text-amber-300">${this.topic} → ${this.subtopic}</strong>
              </p>
              <p class="text-xs text-slate-400 max-w-md mx-auto mb-4">
                Match the 1-line memory hook or concept title to its exact formula or highlight before the clock runs out.
              </p>
              ${this.blitzState.score > 0 ? `<div class="mb-4 p-3 rounded-xl bg-amber-400/10 border border-amber-400/30 text-amber-300 text-xs font-bold">Last Run Score: ${this.blitzState.score} pts</div>` : ""}
              <button onclick="window.app.startBlitz()" class="w-full max-w-xs py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs uppercase tracking-wider shadow-lg shadow-amber-500/20 transition">
                Launch 60s Blitz →
              </button>
            </div>
          `;
        }

        const { timeLeft, score, streak, current, feedback } = this.blitzState;
        const mult = streak >= 6 ? 4 : streak >= 3 ? 2 : 1;
        const promptText = current.promptType === "hook" ? `🧠 "${current.target.hook}"` : current.target.title;

        return `
          <div class="arcade-card border border-amber-400/40 rounded-2xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
              <span class="font-mono-code text-xs font-bold px-2.5 py-1 rounded bg-rose-500/20 text-rose-300 border border-rose-500/30">⏱️ ${timeLeft}s</span>
              <span class="font-mono-code text-xs font-bold px-2.5 py-1 rounded bg-amber-400/20 text-amber-300 border border-amber-400/30">🔥 Streak: ${streak} (${mult}x)</span>
              <span class="font-mono-code text-xs font-bold text-emerald-400">Score: ${score}</span>
            </div>

            <div class="mb-4">
              <div class="text-[10px] font-mono-code uppercase text-amber-400 mb-1">${current.target.topic} • ${current.target.subtopic}</div>
              <div class="p-4 rounded-xl bg-slate-900 border border-slate-700 text-sm font-bold text-white leading-snug">
                ${promptText}
              </div>
            </div>

            <div class="space-y-2.5 mb-3">
              ${current.options.map(opt => `
                <button
                  onclick="window.app.pickBlitzOption('${opt.id}')"
                  class="w-full text-left p-3.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-600 text-xs font-mono-code text-slate-100 transition active:scale-[0.99]"
                >
                  ${opt.text}
                </button>
              `).join("")}
            </div>

            ${feedback ? `<div class="text-center text-xs font-bold text-amber-300 pt-2">${feedback}</div>` : ""}
          </div>
        `;
      }

      renderSurvivalGame() {
        if (!this.survivalState.active) {
          return `
            <div class="arcade-card border border-slate-700 rounded-2xl p-6 text-center shadow-2xl">
              <div class="text-3xl mb-2">🛡️</div>
              <h2 class="text-lg font-black text-white mb-1">Survival Arena (3-Lives Gauntlet)</h2>
              <p class="text-xs text-slate-300 max-w-md mx-auto mb-2">
                Active Filter: <strong class="text-emerald-300">${this.topic} → ${this.subtopic}</strong>
              </p>
              <p class="text-xs text-slate-400 max-w-md mx-auto mb-4">
                Enter with <strong>3 Hearts (❤️❤️❤️)</strong> and a 60s shot clock per question. Losing a heart triggers the <strong>Concept Shield</strong> popup!
              </p>
              ${this.survivalState.score > 0 ? `<div class="mb-4 p-3 rounded-xl bg-emerald-400/10 border border-emerald-400/30 text-emerald-300 text-xs font-bold">Last Run Survived: ${this.survivalState.score} Questions</div>` : ""}
              <button onclick="window.app.startSurvival()" class="w-full max-w-xs py-3 rounded-xl bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-black text-xs uppercase tracking-wider shadow-lg shadow-emerald-500/20 transition">
                Enter Survival Arena →
              </button>
            </div>
          `;
        }

        const { hearts, timeLeft, score, streak, qIndex, deck, answered } = this.survivalState;
        const q = deck[qIndex];
        const heartsDisplay = "❤️".repeat(Math.max(0, hearts)) + "🖤".repeat(Math.max(0, 3 - hearts));

        return `
          <div class="arcade-card border border-emerald-400/40 rounded-2xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
              <span class="text-sm tracking-widest">${heartsDisplay}</span>
              <span class="font-mono-code text-xs font-bold px-2.5 py-1 rounded bg-slate-800 text-amber-300 border border-slate-700">⏱️ ${timeLeft}s</span>
              <span class="font-mono-code text-xs font-bold text-emerald-400">🔥 Streak: ${streak} | Cleared: ${score}</span>
            </div>

            <div class="text-[10px] font-mono-code uppercase text-emerald-400 mb-1">${q.topic} • ${q.subtopic} • ${q.difficulty}</div>
            <p class="text-sm font-semibold text-white mb-4 leading-relaxed">${q.question}</p>

            <div class="space-y-2 mb-4">
              ${q.options.map((opt, idx) => {
                let cls = "bg-slate-800 border-slate-700 text-slate-200 hover:border-emerald-400";
                if (answered !== null) {
                  if (idx === q.correctIndex) cls = "bg-emerald-950 border-emerald-400 text-emerald-200 font-bold";
                  else if (idx === answered) cls = "bg-rose-950 border-rose-500 text-rose-200 font-semibold";
                  else cls = "bg-slate-900 border-slate-800 opacity-40";
                }
                return `
                  <button
                    ${answered !== null ? "disabled" : ""}
                    onclick="window.app.handleSurvivalAnswer(${idx})"
                    class="w-full text-left p-3 rounded-xl border text-xs transition ${cls}"
                  >
                    <strong class="font-mono-code mr-2">${String.fromCharCode(65 + idx)}.</strong> ${opt}
                  </button>
                `;
              }).join("")}
            </div>

            ${answered !== null ? `
              <div class="p-3 rounded-xl bg-slate-900 border border-slate-700 text-xs text-slate-300 mb-3">
                <strong class="text-amber-300">⚡ Shortcut:</strong> ${q.shortcut}
              </div>
              <button onclick="window.app.nextSurvivalQuestion()" class="w-full py-2.5 rounded-xl bg-amber-400 text-slate-950 font-black text-xs uppercase">
                ${hearts <= 0 ? "View Run Summary" : "Next Arena Question →"}
              </button>
            ` : ""}
          </div>
        `;
      }

      renderTrapHunterGame() {
        if (!this.trapState.active) {
          return `
            <div class="arcade-card border border-slate-700 rounded-2xl p-6 text-center shadow-2xl">
              <div class="text-3xl mb-2">🃏</div>
              <h2 class="text-lg font-black text-white mb-1">Trap-Hunter (10-Card Active Recall)</h2>
              <p class="text-xs text-slate-300 max-w-md mx-auto mb-2">
                Active Filter: <strong class="text-indigo-300">${this.topic} → ${this.subtopic}</strong>
              </p>
              <p class="text-xs text-slate-400 max-w-md mx-auto mb-4">
                Deals up to 10 cards weighted toward your <strong>⚡ Revise Queue</strong> and <strong>🔖 Saved</strong> cards with a 10s recall bar.
              </p>
              ${this.trapState.deck.length > 0 ? `<div class="mb-4 p-3 rounded-xl bg-indigo-400/10 border border-indigo-400/30 text-indigo-300 text-xs font-bold">Last Hand Nailed: ${this.trapState.nailedCount} / ${this.trapState.deck.length} Cards</div>` : ""}
              <button onclick="window.app.startTrapHunter()" class="w-full max-w-xs py-3 rounded-xl bg-indigo-500 hover:bg-indigo-400 text-white font-black text-xs uppercase tracking-wider shadow-lg shadow-indigo-500/20 transition">
                Deal Recall Hand →
              </button>
            </div>
          `;
        }

        const { index, deck, revealed, timeLeft, nailedCount } = this.trapState;
        const card = deck[index];
        const pct = (timeLeft / 10) * 100;

        return `
          <div class="arcade-card border border-indigo-400/40 rounded-2xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-2 text-xs font-mono-code">
              <span class="text-indigo-300">Card ${index + 1} of ${deck.length}</span>
              <span class="text-amber-300">⚡ Nailed: ${nailedCount}</span>
            </div>

            <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-4">
              <div class="h-full bg-amber-400 transition-all duration-500" style="width: ${pct}%"></div>
            </div>

            <div class="text-[10px] font-mono-code uppercase text-indigo-400 mb-1">${card.topic} • ${card.subtopic}</div>
            <h3 class="text-base font-bold text-white mb-3">${card.title}</h3>

            <div class="p-3 rounded-xl bg-slate-900/90 border border-slate-800 text-xs text-slate-300 mb-3">
              <strong class="text-rose-400 block mb-1">🎯 Exam Trap Cue:</strong>
              ${card.bullets[1] || card.bullets[0]}
            </div>

            <div
              onclick="window.app.revealTrapCard()"
              class="cursor-pointer p-4 rounded-xl bg-indigo-950/60 border border-indigo-500/30 transition-all ${revealed ? '' : 'blur-md select-none'}"
            >
              <div class="font-mono-code text-xs text-indigo-100 mb-2">${card.formula}</div>
              <div class="text-xs font-semibold text-amber-300 mb-1">★ ${card.highlight}</div>
              <div class="text-[11px] italic text-indigo-200">🧠 ${card.hook}</div>
            </div>

            ${!revealed ? `
              <button onclick="window.app.revealTrapCard()" class="mt-4 w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold text-xs border border-slate-700">
                👁️ Tap to Unblur Formula (${timeLeft}s)
              </button>
            ` : `
              <div class="grid grid-cols-2 gap-2.5 mt-4">
                <button onclick="window.app.gradeTrapCard(false)" class="py-3 rounded-xl bg-rose-600/20 hover:bg-rose-600/30 border border-rose-500/40 text-rose-200 font-bold text-xs">
                  🔄 Fumbled (To Queue)
                </button>
                <button onclick="window.app.gradeTrapCard(true)" class="py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs">
                  ⚡ Nailed It (+10 XP)
                </button>
              </div>
            `}
          </div>
        `;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      window.app = new QuantApp();
    });
  </script>
</body>
</html>
