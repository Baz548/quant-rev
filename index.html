<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QuantByProf v2.2 — Foundations to Advanced + Visual Diagrams</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap');

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    /* 1. Revise Theme: Royal Indigo & Warm Study Ivory */
    body.theme-revise {
      background-color: #f6f5ff;
      color: #1e1b4b;
    }
    .revise-card-gradient {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
    }
    .revise-card-foundation {
      background: linear-gradient(135deg, #172554 0%, #1e3a8a 100%);
    }

    /* 2. Questions Theme: Cyber Teal & Crisp Slate Arena */
    body.theme-questions {
      background-color: #ecfeff;
      color: #042f2e;
    }
    .questions-header-gradient {
      background: linear-gradient(135deg, #042f2e 0%, #0d9488 100%);
    }

    /* 3. Arcade Theme: Electric Amber & Deep Slate */
    body.theme-arcade {
      background-color: #0f172a;
      color: #f8fafc;
    }
    .arcade-gradient {
      background: linear-gradient(135deg, #311042 0%, #7c2d12 50%, #b45309 100%);
    }
    .arcade-card {
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="theme-revise min-h-screen flex flex-col pb-20">

  <!-- TOP NAVIGATION BAR -->
  <header id="app-header" class="sticky top-0 z-40 shadow-md transition-colors duration-300 bg-[#1e1b4b] text-white">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="font-black text-lg tracking-tight">QuantByProf</span>
        <span id="version-badge" class="text-[10px] font-mono-code uppercase px-2 py-0.5 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/40 font-semibold">v2.2 • 52 Cards</span>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="window.app.openAddModal()" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/15 transition">+ Add</button>
        <button onclick="window.app.openSyncModal()" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/15 transition">Sync</button>
      </div>
    </div>

    <!-- PRIMARY MODE SWITCHER (Revise | Questions | Arcade) -->
    <div class="max-w-3xl mx-auto px-4 pb-2.5">
      <div class="grid grid-cols-3 gap-1.5 bg-black/25 p-1 rounded-xl">
        <button id="tab-revise" onclick="window.app.setSection('revise')" class="py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1">
          <span>📖 Revise</span>
        </button>
        <button id="tab-questions" onclick="window.app.setSection('questions')" class="py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1">
          <span>🎯 Questions</span>
        </button>
        <button id="tab-arcade" onclick="window.app.setSection('arcade')" class="py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1">
          <span>🎮 Minigames</span>
        </button>
      </div>
    </div>

    <!-- 1. SHARED PARENT TOPIC PILL BAR (6 PILLS + ALL) -->
    <div class="border-t border-white/10 bg-black/15">
      <div id="topic-bar" class="max-w-3xl mx-auto px-4 py-2 flex space-x-2 overflow-x-auto no-scrollbar"></div>
    </div>

    <!-- 2. SUBTOPIC (26 CHAPTERS) MENU BAR (STRICTLY SCOPED TO SELECTED TOPIC) -->
    <div class="border-t border-white/10 bg-black/30">
      <div class="max-w-3xl mx-auto px-4 py-2 flex items-center space-x-2">
        <span class="text-[10px] font-mono-code uppercase tracking-wider text-amber-300 font-bold shrink-0">📑 Chapter:</span>
        <select
          id="subtopic-select"
          onchange="window.app.setSubtopic(this.value)"
          class="bg-white/10 hover:bg-white/15 text-white text-xs font-semibold rounded-lg px-2.5 py-1.5 border border-white/20 focus:outline-none focus:border-amber-400 shrink-0 max-w-[220px] sm:max-w-xs truncate"
        ></select>
        <div id="subtopic-pills" class="flex space-x-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
      </div>
    </div>
  </header>

  <!-- SUB-FILTER & LEVEL PROGRESSION BAR -->
  <div id="subfilter-container" class="max-w-3xl w-full mx-auto px-4 pt-3 space-y-2">
    <div id="subfilter-bar" class="flex space-x-2 overflow-x-auto no-scrollbar pb-0.5"></div>
    <div id="level-bar" class="flex space-x-2 overflow-x-auto no-scrollbar pb-0.5"></div>
  </div>

  <!-- MAIN VIEWPORT -->
  <main id="main-content" class="max-w-3xl w-full mx-auto px-4 pt-3 flex-1"></main>

  <!-- CONCEPT SHIELD / REFERENCE POPUP MODAL -->
  <div id="concept-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl border border-indigo-400/30 bg-[#1e1b4b] text-white p-5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-start mb-3">
        <span id="modal-concept-badge" class="text-[11px] font-mono-code uppercase px-2.5 py-0.5 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/40">🛡️ Concept Shield</span>
        <button onclick="window.app.closeConceptModal()" class="text-white/60 hover:text-white text-lg leading-none">&times;</button>
      </div>
      <h3 id="modal-concept-title" class="text-base font-bold text-white mb-2"></h3>
      <div class="p-3 rounded-xl bg-black/30 border border-white/10 font-mono-code text-xs text-indigo-200 mb-2 whitespace-pre-line" id="modal-concept-formula"></div>
      <div id="modal-concept-diagram" class="mb-3 hidden"></div>
      <div class="p-2.5 rounded-lg bg-amber-400/15 border border-amber-400/40 text-amber-200 text-xs font-semibold mb-3" id="modal-concept-highlight"></div>
      <ul id="modal-concept-bullets" class="space-y-1.5 text-xs text-indigo-100 mb-3 list-disc pl-4"></ul>
      <div class="text-xs italic text-amber-300 bg-black/20 p-2.5 rounded-lg border border-white/5" id="modal-concept-hook"></div>
      <button onclick="window.app.closeConceptModal()" class="mt-4 w-full py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs transition">Got It — Continue</button>
    </div>
  </div>

  <!-- + ADD CUSTOM ITEM MODAL -->
  <div id="add-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="w-full max-w-lg rounded-2xl bg-white text-slate-900 p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-base">Add Custom Concept Card</h3>
        <button onclick="window.app.closeAddModal()" class="text-slate-400 hover:text-slate-700 text-xl">&times;</button>
      </div>
      <form id="add-form" onsubmit="window.app.saveCustomConcept(event)" class="space-y-3 text-xs">
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block font-semibold mb-1">Topic</label>
            <select id="add-topic" onchange="window.app.populateAddSubtopics()" class="w-full p-2 rounded-lg border border-slate-300">
              <option value="Algebra">Algebra</option>
              <option value="Number Theory">Number Theory</option>
              <option value="Geometry">Geometry</option>
              <option value="Ratio & Mixtures">Ratio & Mixtures</option>
              <option value="Arithmetic">Arithmetic</option>
              <option value="Modern Math">Modern Math</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold mb-1">Chapter (26)</label>
            <select id="add-subtopic" class="w-full p-2 rounded-lg border border-slate-300"></select>
          </div>
          <div>
            <label class="block font-semibold mb-1">Level</label>
            <select id="add-level" class="w-full p-2 rounded-lg border border-slate-300">
              <option value="Foundation">🌱 Foundation</option>
              <option value="Advanced">🚀 Advanced</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block font-semibold mb-1">Concept Title</label>
          <input id="add-title" required placeholder="e.g., Basic Laws of Logarithms" class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Core Formula</label>
          <input id="add-formula" required placeholder="e.g., log(ab) = log(a) + log(b)" class="w-full p-2 rounded-lg border border-slate-300 font-mono-code" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Gold Highlight (Key Rule / Takeaway)</label>
          <input id="add-highlight" required placeholder="e.g., log_b(1) = 0 and log_b(b) = 1 for b > 0, b ≠ 1" class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Step-by-Step / Recognition Bullet 1</label>
          <input id="add-b1" required placeholder="How to apply or derive..." class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Watch-Out / Trap Bullet 2</label>
          <input id="add-b2" required placeholder="Common mistake to avoid..." class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">1-Line Memory Hook</label>
          <input id="add-hook" required placeholder="Short punchy mnemonic..." class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold">Save Concept Card</button>
      </form>
    </div>
  </div>

  <!-- SYNC (EXPORT / IMPORT JSON) MODAL -->
  <div id="sync-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="w-full max-w-lg rounded-2xl bg-white text-slate-900 p-5 shadow-2xl">
      <div class="flex justify-between items-center mb-2">
        <h3 class="font-bold text-base">State Backup & JSON Sync</h3>
        <button onclick="window.app.closeSyncModal()" class="text-slate-400 hover:text-slate-700 text-xl">&times;</button>
      </div>
      <p class="text-xs text-slate-500 mb-3">Copy your `quantbyprof_v2_state` JSON backup or paste an existing state string below to restore progress and arcade stats.</p>
      <textarea id="sync-textarea" rows="7" class="w-full p-3 rounded-xl border border-slate-300 font-mono-code text-[11px] mb-3 focus:outline-none focus:border-indigo-600"></textarea>
      <div class="flex space-x-2">
        <button onclick="window.app.copySyncState()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-white font-bold text-xs">📋 Copy Backup</button>
        <button onclick="window.app.restoreSyncState()" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs">⚡ Restore State</button>
      </div>
    </div>
  </div>

      "Number Theory",
      "Geometry",
      "Ratio & Mixtures",
      "Arithmetic",
      "Modern Math"

      "Algebra": [
        "Simple Equations",
        "Special Equations",
        "Quadratic Equations",
        "Inequalities and Modulus",
        "Sequences and Series",
        "Functions",
        "Graphs",
        "Indices – Surds",
        "Logarithms",
        "Operator Based Questions"
      ],
      "Number Theory": [
        "Numbers – I",
        "Numbers – II",
        "Number Systems"
      ],

        "Geometry",

      ],

        "Ratio – Proportion – Variation",
        "Averages – Mixtures – Alligations"
      ],

        "Percentages – Profit & Loss – Partnerships",

        "Time and Distance",
        "Time and Work"
      ],
      "Modern Math": [
        "Permutations and Combinations",
        "Probability",
        "Statistics"

    const ALL_26_CHAPTERS = Object.values(TOPIC_CHAPTERS).flat();

    // Reverse lookup: Subtopic -> Authoritative Parent Topic
    const SUBTOPIC_TO_TOPIC = {};
    Object.entries(TOPIC_CHAPTERS).forEach(([t, subs]) => {
      subs.forEach(s => { SUBTOPIC_TO_TOPIC[s] = t; });

    // =========================================================================
    // 5. STATE MANAGEMENT & LOCALSTORAGE (quantbyprof_v2_state)
    // =========================================================================
    const STORAGE_KEY = "quantbyprof_v2_state";

    const defaultState = () => ({
      savedConcepts: [],
      reviseQueue: [],
      masteredConcepts: [],
      savedQuestions: [],
      questionStatus: {},
      customConcepts: [],
      arcade: {
        xp: 0,
        blitzHigh: 0,
        survivalBest: 0,
        trapSessions: 0
      }
    });

    class QuantApp {
      constructor() {
        this.state = this.loadState();
        this.section = "revise";     // 'revise' | 'questions' | 'arcade'
        this.topic = "All";          // 'All' | 6 Parent Topics
        this.subtopic = "All";       // 'All' | 26 Chapters
        this.reviseSub = "all";      // 'all' | 'saved' | 'queue' | 'mastered'
        this.levelFilter = "all";    // 'all' | 'Foundation' | 'Advanced'
        this.questionSub = "all";    // 'all' | 'unattempted' | 'retry' | 'saved' | 'correct'
        this.arcadeGame = "blitz";   // 'blitz' | 'survival' | 'traphunter'

        this.selectedAnswers = {};
        this.openShortcuts = {};

        this.activeTimer = null;
        this.blitzState = { active: false, timeLeft: 60, score: 0, streak: 0, current: null, feedback: null };
        this.survivalState = { active: false, hearts: 3, timeLeft: 60, score: 0, streak: 0, qIndex: 0, deck: [], answered: null };
        this.trapState = { active: false, index: 0, deck: [], revealed: false, timeLeft: 10, nailedCount: 0 };

        this.populateAddSubtopics();
        this.renderAll();
      }

      loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultState();
          const parsed = JSON.parse(raw);
          // Enforce strict topic-subtopic consistency on any custom cards
          const customConcepts = (parsed.customConcepts || []).map(c => ({
            ...c,
            topic: SUBTOPIC_TO_TOPIC[c.subtopic] || c.topic || "Algebra",
            level: c.level || "Foundation"
          }));
          return {
            ...defaultState(),
            ...parsed,
            customConcepts,
            arcade: { ...defaultState().arcade, ...(parsed.arcade || {}) }
          };
        } catch (e) {
          return defaultState();
        }
      }

      saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      }

      getAllConcepts() {
        return [...SEED_CONCEPTS, ...(this.state.customConcepts || [])].map(c => ({
          ...c,
          topic: SUBTOPIC_TO_TOPIC[c.subtopic] || c.topic
        }));
      }

      getAvailableSubtopics() {
        if (this.topic === "All") return ALL_26_CHAPTERS;
        return TOPIC_CHAPTERS[this.topic] || [];
      }

      // Base topic/subtopic filtered concepts (before status/level sub-filters)
      getTopicScopedConcepts() {
        let list = this.getAllConcepts();
        if (this.topic !== "All") list = list.filter(c => c.topic === this.topic);
        if (this.subtopic !== "All") list = list.filter(c => c.subtopic === this.subtopic);
        return list;
      }

      getFilteredConcepts() {
        let list = this.getTopicScopedConcepts();
        if (this.levelFilter !== "all") list = list.filter(c => c.level === this.levelFilter);
        if (this.reviseSub === "saved") list = list.filter(c => this.state.savedConcepts.includes(c.id));
        if (this.reviseSub === "queue") list = list.filter(c => this.state.reviseQueue.includes(c.id));
        if (this.reviseSub === "mastered") list = list.filter(c => this.state.masteredConcepts.includes(c.id));
        return list;
      }

      getTopicScopedQuestions() {
        let list = [...SEED_QUESTIONS];
        if (this.topic !== "All") list = list.filter(q => q.topic === this.topic);
        if (this.subtopic !== "All") list = list.filter(q => q.subtopic === this.subtopic);
        return list;
      }

      getFilteredQuestions() {
        let list = this.getTopicScopedQuestions();
        if (this.questionSub === "unattempted") list = list.filter(q => !this.state.questionStatus[q.id]);
        if (this.questionSub === "retry") list = list.filter(q => this.state.questionStatus[q.id] === "retry");
        if (this.questionSub === "saved") list = list.filter(q => this.state.savedQuestions.includes(q.id));
        if (this.questionSub === "correct") list = list.filter(q => this.state.questionStatus[q.id] === "correct");
        return list;
      }

      clearTimers() {
        if (this.activeTimer) {
          clearInterval(this.activeTimer);
          this.activeTimer = null;
        }
      }

      // =======================================================================
      // NAVIGATION, TOPIC & 26-CHAPTER SUBTOPIC SWITCHING
      // =======================================================================
      setSection(sec) {
        this.clearTimers();
        this.blitzState.active = false;
        this.survivalState.active = false;
        this.trapState.active = false;
        this.section = sec;

        const body = document.body;
        const header = document.getElementById("app-header");
        body.classList.remove("theme-revise", "theme-questions", "theme-arcade");

        if (sec === "revise") {
          body.classList.add("theme-revise");
          header.className = "sticky top-0 z-40 shadow-md transition-colors duration-300 bg-[#1e1b4b] text-white";
        } else if (sec === "questions") {
          body.classList.add("theme-questions");
          header.className = "sticky top-0 z-40 shadow-md transition-colors duration-300 questions-header-gradient text-white";
        } else {
          body.classList.add("theme-arcade");
          header.className = "sticky top-0 z-40 shadow-md transition-colors duration-300 arcade-gradient text-white";
        }

        this.renderAll();
      }

      setTopic(t) {
        this.topic = t;
        // Strictly reset subtopic if it does not belong to the selected topic
        if (t === "All") {
          this.subtopic = "All";
        } else if (this.subtopic !== "All") {
          const validSubs = TOPIC_CHAPTERS[t] || [];
          if (!validSubs.includes(this.subtopic)) {
            this.subtopic = "All";
          }
        }
        this.renderAll();
      }

      setSubtopic(sub) {
        this.subtopic = sub;
        // Automatically align parent topic if a specific chapter is chosen
        if (sub !== "All") {
          const parentTopic = SUBTOPIC_TO_TOPIC[sub];
          if (parentTopic) {
            this.topic = parentTopic;
          }
        }
        this.renderAll();
      }

      setReviseSub(sub) {
        this.reviseSub = sub;
        this.renderAll();
      }

      setLevelFilter(lvl) {
        this.levelFilter = lvl;
        this.renderAll();
      }

      setQuestionSub(sub) {
        this.questionSub = sub;
        this.renderAll();
      }

      setArcadeGame(game) {
        this.clearTimers();
        this.blitzState.active = false;
        this.survivalState.active = false;
        this.trapState.active = false;
        this.arcadeGame = game;
        this.renderAll();
      }

      // =======================================================================
      // STATE MUTATIONS
      // =======================================================================
      toggleArrayItem(arr, id) {
        const idx = arr.indexOf(id);
        if (idx === -1) arr.push(id);
        else arr.splice(idx, 1);
        this.saveState();
        this.renderAll();
      }

      answerQuestion(qId, optIdx, correctIdx) {
        this.selectedAnswers[qId] = optIdx;
        if (optIdx === correctIdx) {
          this.state.questionStatus[qId] = "correct";
          this.state.arcade.xp += 5;
        } else {
          this.state.questionStatus[qId] = "retry";
          const q = SEED_QUESTIONS.find(item => item.id === qId);
          if (q && q.concept_ref && !this.state.reviseQueue.includes(q.concept_ref)) {
            this.state.reviseQueue.push(q.concept_ref);
          }
        }
        this.saveState();
        this.renderMain();
        this.renderSubfilters();
      }

      retryQuestion(qId) {
        delete this.selectedAnswers[qId];
        this.renderMain();
      }

      toggleShortcut(qId) {
        this.openShortcuts[qId] = !this.openShortcuts[qId];
        this.renderMain();
      }

      openConceptModal(conceptId, badgeLabel = "🛡️ Concept Shield") {
        let c = this.getAllConcepts().find(item => item.id === conceptId);
        // Backwards-compatible fallback if old v2.0/v2.1 ID is passed
        if (!c) {
          c = this.getAllConcepts().find(item => item.id.startsWith(conceptId));
        }
        if (!c) return;
        document.getElementById("modal-concept-badge").textContent = `${badgeLabel} • ${c.topic} • ${c.subtopic} (${c.level})`;
        document.getElementById("modal-concept-title").textContent = c.title;
        document.getElementById("modal-concept-formula").textContent = c.formula;

        const diagEl = document.getElementById("modal-concept-diagram");
        if (c.diagram && DIAGRAMS[c.diagram]) {
          diagEl.innerHTML = DIAGRAMS[c.diagram];
          diagEl.classList.remove("hidden");
        } else {
          diagEl.innerHTML = "";
          diagEl.classList.add("hidden");
        }

        document.getElementById("modal-concept-highlight").textContent = `★ ${c.highlight}`;
        document.getElementById("modal-concept-bullets").innerHTML = c.bullets.map(b => `<li>${b}</li>`).join("");
        document.getElementById("modal-concept-hook").textContent = `💡 Hook: ${c.hook}`;
        document.getElementById("concept-modal").classList.remove("hidden");
      }

      closeConceptModal() {
        document.getElementById("concept-modal").classList.add("hidden");
      }

      // =======================================================================
      // MINIGAMES (BLITZ, SURVIVAL, TRAP-HUNTER)
      // =======================================================================
      getArcadeConceptPool() {
        const pool = this.getTopicScopedConcepts();
        return pool.length > 0 ? pool : this.getAllConcepts();
      }

      getArcadeQuestionPool() {
        const pool = this.getTopicScopedQuestions();
        return pool.length > 0 ? pool : [...SEED_QUESTIONS];
      }

      startBlitz() {
        this.clearTimers();
        this.blitzState = {
          active: true,
          timeLeft: 60,
          score: 0,
          streak: 0,
          current: this.generateBlitzRound(),
          feedback: null
        };
        this.activeTimer = setInterval(() => {
          this.blitzState.timeLeft -= 1;
          if (this.blitzState.timeLeft <= 0) {
            this.clearTimers();
            this.blitzState.active = false;
            if (this.blitzState.score > this.state.arcade.blitzHigh) {
              this.state.arcade.blitzHigh = this.blitzState.score;
              this.saveState();
            }
          }
          this.renderMain();
        }, 1000);
        this.renderMain();
      }

      generateBlitzRound() {
        const pool = this.getArcadeConceptPool();
        const fullPool = this.getAllConcepts();
        const target = pool[Math.floor(Math.random() * pool.length)] || fullPool[0];
        const distractors = fullPool
          .filter(c => c.id !== target.id)
          .sort(() => Math.random() - 0.5)
          .slice(0, 3);
        const useHighlight = Math.random() > 0.5;
        const options = [target, ...distractors]
          .sort(() => Math.random() - 0.5)
          .map(c => ({
            id: c.id,
            text: useHighlight ? c.highlight : c.formula.split("\n")[0]
          }));
        return {
          target,
          promptType: Math.random() > 0.4 ? "hook" : "title",
          options
        };
      }

      pickBlitzOption(pickedId) {
        if (!this.blitzState.active) return;
        const { target } = this.blitzState.current;
        if (pickedId === target.id) {
          this.blitzState.streak += 1;
          const mult = this.blitzState.streak >= 6 ? 4 : this.blitzState.streak >= 3 ? 2 : 1;
          const pts = 10 * mult;
          this.blitzState.score += pts;
          this.state.arcade.xp += 3;
          this.blitzState.feedback = `✅ +${pts} pts (${mult}x Combo!)`;
        } else {
          this.blitzState.streak = 0;
          this.blitzState.feedback = `❌ Missed! Added "${target.subtopic}" to ⚡ Revise Queue`;
          if (!this.state.reviseQueue.includes(target.id)) {
            this.state.reviseQueue.push(target.id);
          }
        }
        if (this.blitzState.score > this.state.arcade.blitzHigh) {
          this.state.arcade.blitzHigh = this.blitzState.score;
        }
        this.saveState();
        this.blitzState.current = this.generateBlitzRound();
        this.renderMain();
      }

      startSurvival() {
        this.clearTimers();
        const basePool = this.getArcadeQuestionPool();
        const prioritized = basePool.sort((a, b) => {
          const sa = this.state.questionStatus[a.id];
          const sb = this.state.questionStatus[b.id];
          const weight = s => (s === "retry" ? 0 : !s ? 1 : 2);
          return weight(sa) - weight(sb) || Math.random() - 0.5;
        });

        this.survivalState = {
          active: true,
          hearts: 3,
          timeLeft: 60,
          score: 0,
          streak: 0,
          qIndex: 0,
          deck: prioritized,
          answered: null
        };
        this.startSurvivalShotClock();
        this.renderMain();
      }

      startSurvivalShotClock() {
        this.clearTimers();
        this.survivalState.timeLeft = 60;
        this.activeTimer = setInterval(() => {
          if (this.survivalState.answered !== null) return;
          this.survivalState.timeLeft -= 1;
          if (this.survivalState.timeLeft <= 0) {
            this.handleSurvivalAnswer(-1);
          } else {
            this.renderMain();
          }
        }, 1000);
      }

      handleSurvivalAnswer(optIdx) {
        if (this.survivalState.answered !== null) return;
        this.survivalState.answered = optIdx;
        const currentQ = this.survivalState.deck[this.survivalState.qIndex];

        if (optIdx === currentQ.correctIndex) {
          this.survivalState.
