    // 4. STATE MANAGEMENT & DYNAMIC FILTER SYNC (quantbyprof_v2_state)
    // =========================================================================
    const STORAGE_KEY = "quantbyprof_v2_state";

    const defaultState = () => ({
      savedConcepts: [],
      reviseQueue: [],
      masteredConcepts: [],
      customConcepts: [],
      arcade: {
        xp: 0,
        blitzHigh: 0,
        survivalBest: 0,
        trapSessions: 0,
        afterimageBest: 0,
        faultlineBest: 0,
        afterimageRuns: 0,
        faultlineRuns: 0
      }
    });

    class QuantApp {
      constructor() {
        this.state = this.loadState();
        this.section = "revise";     // 'revise' | 'arcade'
        this.topic = "All";          // Parent Topic ('All' or one of the 6 core topics)
        this.subtopic = "All";       // Scoped Chapter selection
        this.levelFilter = "All";    // 'All' | 'Foundation' | 'Advanced'
        this.reviseSub = "all";      // 'all' | 'saved' | 'queue' | 'mastered'
        this.arcadeGame = "afterimage"; // 'afterimage' | 'faultline'

        this.activeTimer = null;
        this.afterimageState = { active: false, phase: "idle", deck: [], index: 0, current: null, score: 0, streak: 0, lastRunScore: 0 };
        this.faultlineState = { active: false, phase: "idle", deck: [], index: 0, current: null, score: 0, streak: 0, maxStreak: 0, speedBonusCount: 0, runResults: [], lastRunScore: 0 };

        this.populateModalSubtopics();
        this.renderAll();
      }

      loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultState();
          const parsed = JSON.parse(raw);
          return {
            ...defaultState(),
            ...parsed,
            arcade: { ...defaultState().arcade, ...(parsed.arcade || {}) }
          };
        } catch (e) {
          return defaultState();
        }
      }

      saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      }

      getAllConcepts() {
        return [...SEED_CONCEPTS, ...(this.state.customConcepts || [])];
      }

      // Scoped chapters strictly belonging to current parent topic
      getAvailableSubtopics() {
        if (this.topic === "All") {
          return Object.values(TOPIC_CHAPTER_MAP).flat();
        }
        return TOPIC_CHAPTER_MAP[this.topic] || [];
      }

      // Helper to find parent topic for any chapter
      findParentTopicForChapter(chapterName) {
        for (const [t, chapters] of Object.entries(TOPIC_CHAPTER_MAP)) {
          if (chapters.includes(chapterName)) return t;
        }
        return "All";
      }

      // Concepts scoped by Topic + Subtopic (before status/level sub-filters)
      getTopicScopedConcepts() {
        let list = this.getAllConcepts();
        if (this.topic !== "All") list = list.filter(c => c.topic === this.topic);
        if (this.subtopic !== "All") list = list.filter(c => c.subtopic === this.subtopic);
        return list;
      }

      getFilteredConcepts() {
        let list = this.getTopicScopedConcepts();
        if (this.levelFilter !== "All") list = list.filter(c => (c.level || "Foundation") === this.levelFilter);
        if (this.reviseSub === "saved") list = list.filter(c => this.state.savedConcepts.includes(c.id));
        if (this.reviseSub === "queue") list = list.filter(c => this.state.reviseQueue.includes(c.id));
        if (this.reviseSub === "mastered") list = list.filter(c => this.state.masteredConcepts.includes(c.id));
        return list;
      }

      clearTimers() {
        if (this.activeTimer) {
          clearInterval(this.activeTimer);
          this.activeTimer = null;
        }
      }

      // =======================================================================
      // NAVIGATION, DROPDOWN <-> NEIGHBORING BUTTONS SYNC & THEME SWITCHING
      // =======================================================================
      setSection(sec) {
        this.clearTimers();
        this.stopArcadeRuns();
        this.section = sec;

        const body = document.body;
        const header = document.getElementById("app-header");
        body.classList.remove("theme-revise", "theme-arcade");

        if (sec === "revise") {
          body.classList.add("theme-revise");
          header.className = "sticky top-0 z-40 shadow-md transition-colors duration-300 bg-[#1e1b4b] text-white";
        } else {
          body.classList.add("theme-arcade");
          header.className = "sticky top-0 z-40 shadow-md transition-colors duration-300 arcade-gradient text-white";
        }

        this.renderAll();
      }

      setTopic(t) {
        this.topic = t;
        const validSubs = this.getAvailableSubtopics();
        if (this.subtopic !== "All" && !validSubs.includes(this.subtopic)) {
          this.subtopic = "All";
        }
        this.renderAll();
      }

      // Handles selections from the left dropdown (#subtopic-select)
      // - "All": Resets both topic & subtopic ("All 26 Chapters")
      // - "TOPIC:<TopicName>": Scopes neighboring buttons to that Topic's chapters
      // - "<ChapterName>": Scopes neighboring buttons to that Chapter's parent topic AND highlights the chapter
      handleDropdownChange(val) {
        if (val === "All") {
          this.topic = "All";
          this.subtopic = "All";
        } else if (val.startsWith("TOPIC:")) {
          this.topic = val.replace("TOPIC:", "");
          this.subtopic = "All";
        } else {
          this.subtopic = val;
          const parentTopic = this.findParentTopicForChapter(val);
          if (parentTopic !== "All") {
            this.topic = parentTopic;
          }
        }
        this.renderAll();
      }

      // Handles clicks on the neighboring horizontal chapter buttons (#subtopic-bar)
      setSubtopic(sub) {
        if (sub === "All") {
          this.subtopic = "All";
        } else if (this.subtopic === sub) {
          // Clicking the already-active chapter button toggles back to showing all chapters in current scope
          this.subtopic = "All";
        } else {
          this.subtopic = sub;
          if (this.topic !== "All") {
            const parentOfSub = this.findParentTopicForChapter(sub);
            if (parentOfSub !== this.topic) {
              this.topic = parentOfSub;
            }
          }
        }
        this.renderAll();
      }

      setLevelFilter(lvl) {
        this.levelFilter = lvl;
        this.renderAll();
      }

      setReviseSub(sub) {
        this.reviseSub = sub;
        this.renderAll();
      }

      setArcadeGame(game) {
        this.stopArcadeRuns();
        this.arcadeGame = game;
        this.renderAll();
      }

      stopArcadeRuns() {
        this.clearTimers();
        for (const key of ["afterimageState", "faultlineState"]) {
          const game = this[key];
          if (game && game.active) {
            game.lastRunScore = game.score || 0;
            game.active = false;
            if (game.phase !== "complete") game.phase = "idle";
          }
        }
      }

      // =======================================================================
      // STATE MUTATIONS (BOOKMARKS, QUEUE, MASTERY)
      // =======================================================================
      goToReviseQueue() {
        this.stopArcadeRuns();
        this.section = "revise";
        this.topic = "All";
        this.subtopic = "All";
        this.levelFilter = "All";
        this.reviseSub = "queue";
        this.renderAll();
      }

      toggleArrayItem(arr, id) {
        const idx = arr.indexOf(id);
        if (idx === -1) arr.push(id);
        else arr.splice(idx, 1);
        this.saveState();
        this.renderAll();
      }

      openConceptModal(conceptId, badgeLabel = "🛡️ Concept Shield") {
        const c = this.getAllConcepts().find(item => item.id === conceptId);
        if (!c) return;
        document.getElementById("modal-concept-badge").textContent = `${badgeLabel} • ${c.topic} › ${c.subtopic}`;
        const lvlEl = document.getElementById("modal-concept-level");
        const isAdv = c.level === "Advanced";
        lvlEl.textContent = isAdv ? "🚀 Advanced" : "🌱 Foundation";
        lvlEl.className = `text-[10px] font-mono-code uppercase px-2 py-0.5 rounded-full border ${
          isAdv ? "bg-rose-500/20 text-rose-200 border-rose-400/40" : "bg-emerald-500/20 text-emerald-200 border-emerald-400/40"
        }`;
        document.getElementById("modal-concept-title").textContent = c.title;
        const svgContainer = document.getElementById("modal-concept-svg");
        if (c.svg) {
          svgContainer.innerHTML = c.svg;
          svgContainer.classList.remove("hidden");
        } else {
          svgContainer.innerHTML = "";
          svgContainer.classList.add("hidden");
        }
        document.getElementById("modal-concept-formula").innerHTML = this.formatMathText(c.formula);
        document.getElementById("modal-concept-highlight").innerHTML = `★ ${this.formatMathText(c.highlight)}`;
        document.getElementById("modal-concept-bullets").innerHTML = c.bullets.map(b => `<li>${this.formatMathText(b)}</li>`).join("");
        document.getElementById("modal-concept-hook").innerHTML = `🧠 ${this.formatMathText(c.hook)}`;
        document.getElementById("concept-modal").classList.remove("hidden");
      }

      closeConceptModal() {
        document.getElementById("concept-modal").classList.add("hidden");
      }

      // =======================================================================
      // v3.1 MINIGAMES: AFTERIMAGE + FAULTLINE
      // =======================================================================
      escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, ch => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[ch]));
      }

      // Render plain-text math notation safely, preserving both subscripts and superscripts.
      // Examples: log_b(x), log_(b^m)(x), x^2, x^{n+1}, T_((n+1)/2), b^(log_b x).
      // The parser operates on raw text and HTML-escapes every literal segment before adding tags.
      formatMathText(value) {
        const source = String(value ?? "");
        const pairs = { "(": ")", "{": "}" };
        const readScriptArgument = (text, markerIndex) => {
          let start = markerIndex + 1;
          if (start >= text.length) return null;
          const opener = text[start];
          if (pairs[opener]) {
            const stack = [pairs[opener]];
            for (let j = start + 1; j < text.length; j++) {
              const ch = text[j];
              if (pairs[ch]) stack.push(pairs[ch]);
              else if (stack.length && ch === stack[stack.length - 1]) {
                stack.pop();
                if (!stack.length) return { value: text.slice(start + 1, j), end: j + 1 };
              }
            }
            return null;
          }
          // For a bare exponent, include a leading sign when present; otherwise consume one atom.
          if ((text[markerIndex] === "^") && (opener === "+" || opener === "-" || opener === "−")) start++;
          const match = text.slice(start).match(/^[\p{L}\p{N}∞]+/u);
          if (!match) return null;
          return { value: (start > markerIndex + 1 ? opener : "") + match[0], end: start + match[0].length };
        };
        const renderSegment = text => {
          let html = "";
          let literal = "";
          const flush = () => {
            if (literal) { html += this.escapeHTML(literal); literal = ""; }
          };
          for (let i = 0; i < text.length;) {
            const marker = text[i];
            if (marker !== "_" && marker !== "^") { literal += marker; i++; continue; }
            const arg = readScriptArgument(text, i);
            if (!arg || !arg.value.length) { literal += marker; i++; continue; }
            flush();
            const tag = marker === "_" ? "sub" : "sup";
            html += `<${tag}>${renderSegment(arg.value)}</${tag}>`;
            i = arg.end;
          }
          flush();
          return html;
        };
        return `<span class="math-text">${renderSegment(source)}</span>`;
      }

      shuffleList(items) {
        const out = [...items];
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [out[i], out[j]] = [out[j], out[i]];
        }
        return out;
      }

      getFormulaParts(concept) {
        if (!concept || !concept.formula) return [];
        const out = [];
        const seen = new Set();
        const lines = String(concept.formula).split(/\r?\n/)
          .map(line => line.trim().replace(/^[•\-*]\s*/, ""))
          .filter(Boolean);
        lines.forEach((line, lineIndex) => {
          const parts = line.split(/\s+\|\s+|;\s+/).map(part => part.trim()).filter(Boolean);
          parts.forEach((part, partIndex) => {
            if (!/[=≠≤≥<>⟹⟺↔≈]/.test(part) || part.length < 6 || part.length > 240) return;
            const normalized = this.normalizeFact(part);
            if (seen.has(normalized)) return;
            seen.add(normalized);
            const prefix = part.includes(":") ? part.split(":", 1)[0].trim() : "";
            const label = prefix && prefix.length <= 36 && !/[=<>≤≥]/.test(prefix) ? prefix : "Formula";
            const score = (part.includes("=") ? 5 : 0) + (part.length <= 100 ? 3 : part.length <= 155 ? 1 : -2) - partIndex * 0.4 - lineIndex * 0.15;
            out.push({ text: part, label, lineIndex, partIndex, score });
          });
        });
        return out.sort((a, b) => b.score - a.score);
      }

      normalizeFact(value) {
        return String(value ?? "").toLowerCase().replace(/\s+/g, " ").replace(/[–—]/g, "-").trim();
      }

      getFormulaSnippet(concept) {
        const parts = this.getFormulaParts(concept);
        return parts.length ? parts[0].text : "";
      }

      getFormulaItems(pool) {
        const items = [];
        const seen = new Set();
        (pool || []).forEach(concept => {
          this.getFormulaParts(concept).forEach((part, index) => {
            const norm = this.normalizeFact(part.text);
            const key = `${concept.id}::formula::${norm}`;
            if (seen.has(key)) return;
            seen.add(key);
            items.push({
              key, concept, kind: "formula", value: part.text, label: part.label,
              sourceIndex: index
            });
          });
        });
        return items;
      }

      getGameScopeTiers() {
        const all = this.getAllConcepts();
        const levelScope = pool => this.levelFilter === "All" ? pool : pool.filter(c => (c.level || "Foundation") === this.levelFilter);
        const tiers = [];
        const pushTier = (pool, label, ignoreLevel = false) => {
          const filtered = ignoreLevel ? pool : levelScope(pool);
          if (filtered.length && !tiers.some(t => t.pool.map(c => c.id).sort().join("|") === filtered.map(c => c.id).sort().join("|"))) {
            tiers.push({ pool: filtered, label: this.levelFilter === "All" ? label : `${label} · ${this.levelFilter}` });
          }
        };
        if (this.subtopic !== "All") {
          pushTier(all.filter(c => c.subtopic === this.subtopic && (this.topic === "All" || c.topic === this.topic)), `Chapter · ${this.subtopic}`);
          if (this.topic !== "All") pushTier(all.filter(c => c.topic === this.topic), `Expanded to ${this.topic}`);
          pushTier(all, "Expanded to all topics");
        } else if (this.topic !== "All") {
          pushTier(all.filter(c => c.topic === this.topic), `Topic · ${this.topic}`);
          pushTier(all, "Expanded to all topics");
        } else {
          pushTier(all, "All 26 chapters");
        }
        // If the current level alone still cannot provide a full run, explicitly permit both levels.
        if (this.levelFilter !== "All") pushTier(all, "Expanded to all topics · both levels", true);
        if (!tiers.length) tiers.push({ pool: all, label: "All concept cards" });
        return tiers;
      }

      chooseGameScope(itemBuilder, minItems = 10) {
        const tiers = this.getGameScopeTiers();
        let best = null;
        for (const tier of tiers) {
          const items = itemBuilder(tier.pool);
          const candidate = { ...tier, items };
          if (!best || items.length > best.items.length) best = candidate;
          if (items.length >= minItems) return candidate;
        }
        return best || { pool: this.getAllConcepts(), label: "All concept cards", items: itemBuilder(this.getAllConcepts()) };
      }

      buildUniqueDeck(items, count = 10) {
        const shuffled = this.shuffleList(items || []);
        const out = [];
        const used = new Set();
        for (const item of shuffled) {
          if (used.has(item.key)) continue;
          used.add(item.key);
          out.push(item);
          if (out.length >= count) break;
        }
        return out;
      }

      getOptionPools(concept, difficulty = 1) {
        const all = this.getAllConcepts();
        const parent = all.filter(c => c.topic === concept.topic);
        const chapter = all.filter(c => c.topic === concept.topic && c.subtopic === concept.subtopic);
        const siblingChapters = parent.filter(c => c.subtopic !== concept.subtopic);
        if (difficulty <= 0) return [chapter, parent, all];
        if (difficulty === 1) return [chapter, siblingChapters, parent, all];
        // Hard rounds draw first from same-level sibling chapters to make distractors more plausible.
        const sameLevelSiblings = siblingChapters.filter(c => (c.level || "Foundation") === (concept.level || "Foundation"));
        return [sameLevelSiblings, siblingChapters, chapter, parent, all];
      }

      getConceptOptionLabel(concept) {
        const title = String(concept?.title || "Untitled concept").trim();
        const chapter = String(concept?.subtopic || "").trim();
        const level = String(concept?.level || "Foundation").trim();
        return [title, chapter, level].filter(Boolean).join(" · ");
      }

      makeConceptOptions(targetConcept, difficulty = 1) {
        if (!targetConcept?.id) return null;
        const distractors = [];
        const usedIds = new Set([targetConcept.id]);
        const usedLabels = new Set([this.normalizeFact(this.getConceptOptionLabel(targetConcept))]);
        // Prefer nearby/sibling concepts, then broaden the pool only when needed.
        for (const pool of this.getOptionPools(targetConcept, difficulty)) {
          for (const candidate of this.shuffleList(pool)) {
            if (!candidate?.id || usedIds.has(candidate.id)) continue;
            // Do not use a same-titled card as a distractor; only the level may differ.
            if (this.normalizeFact(candidate.title) === this.normalizeFact(targetConcept.title)) continue;
            const label = this.getConceptOptionLabel(candidate);
            const normalized = this.normalizeFact(label);
            if (!normalized || usedLabels.has(normalized)) continue;
            usedIds.add(candidate.id);
            usedLabels.add(normalized);
            distractors.push(candidate);
            if (distractors.length === 3) break;
          }
          if (distractors.length === 3) break;
        }
        if (distractors.length !== 3) return null;
        const options = this.shuffleList([targetConcept, ...distractors]);
        return { options, correctIndex: options.findIndex(option => option.id === targetConcept.id) };
      }

      getShortConceptTitle(title) {
        const raw = String(title ?? "").trim();
        if (raw.length <= 44) return raw;
        const firstClause = raw.split(/\s+[—–]\s+|,|\s+&\s+|\s+and\s+|\s*\(/i)[0].trim();
        if (firstClause.length >= 8 && firstClause.length <= 44) return firstClause;
        const words = raw.split(/\s+/).slice(0, 6).join(" ");
        return words.length < raw.length ? `${words}…` : raw;
      }

      makeOptions(correctText, targetConcept, kind, difficulty, isFormula = false) {
        const correctNorm = this.normalizeFact(correctText);
        const wrong = [];
        const seen = new Set([correctNorm]);
        for (const pool of this.getOptionPools(targetConcept, difficulty)) {
          const items = this.getFormulaItems(pool);
          for (const item of this.shuffleList(items)) {
            if (item.concept.id === targetConcept.id) continue;
            const normalized = this.normalizeFact(item.value);
            if (!normalized || seen.has(normalized)) continue;
            seen.add(normalized);
            wrong.push(item.value);
            if (wrong.length >= 3) break;
          }
          if (wrong.length >= 3) break;
        }
        if (wrong.length < 3) return null;
        const options = this.shuffleList([correctText, ...wrong.slice(0, 3)]);
        if (new Set(options.map(value => this.normalizeFact(value))).size !== 4) return null;
        return { options, correctIndex: options.findIndex(value => this.normalizeFact(value) === correctNorm) };
      }

      createFormulaChallenge(formulaItem, difficulty = 1) {
        if (!formulaItem || !formulaItem.concept || !formulaItem.value) return null;
        const correctFormula = formulaItem.value;
        const optionSet = this.makeOptions(correctFormula, formulaItem.concept, "formula", difficulty, true);
        if (!optionSet) return null;
        return { formula: correctFormula, options: optionSet.options, correctIndex: optionSet.correctIndex, formulaLabel: formulaItem.label || "Formula" };
      }

      // Restore the existing Afterimage round setup: a formula is previewed,
      // hidden, and then matched against formula-only distractors.
      prepareAfterimageRound() {
        const state = this.afterimageState;
        const item = state.deck[state.index];
        if (!item) {
          state.active = false;
          state.phase = "idle";
          state.current = null;
          return;
        }
        const difficulty = state.index < 3 ? 0 : state.index < 7 ? 1 : 2;
        const challenge = this.createFormulaChallenge(item, difficulty);
        if (!challenge) {
          state.active = false;
          state.phase = "idle";
          state.current = null;
          return;
        }
        state.current = {
          ...challenge,
          target: item.concept,
          sourceItem: item,
          formula: item.value,
          selectedIndex: null,
          result: null
        };
        state.phase = "preview";
        state.previewDurationMs = 2300;
        state.phaseStartedAt = Date.now();
        state.answerStartedAt = Date.now();
      }

      startAfterimage() {
        this.clearTimers();
        const scope = this.chooseGameScope(pool => this.getFormulaItems(pool), 10);
        const deck = this.buildUniqueDeck(scope.items, 10);
        this.afterimageState = {
          active: deck.length > 0,
          phase: "preview",
          deck,
          index: 0,
          current: null,
          score: 0,
          streak: 0,
          speedBonusCount: 0,
          scopeLabel: scope.label,
          lastRunScore: this.afterimageState.lastRunScore || 0,
          previewDurationMs: 2300,
          phaseStartedAt: Date.now(),
          answerStartedAt: Date.now()
        };
        this.prepareAfterimageRound();
        if (!this.afterimageState.deck.length || !this.afterimageState.active) {
          this.afterimageState.active = false;
          this.afterimageState.phase = "idle";
        } else {
          this.startGameTicker();
        }
        this.renderMain();
      }

      // -----------------------------------------------------------------------
      // v4.0 FAULTLINE: complete source-linked challenge bank, one challenge per built-in concept card;
      // source concept cards. No generated or cross-topic answer fabrication.
      // -----------------------------------------------------------------------
      getFaultlineChallenges() {
        const concepts = new Map(this.getAllConcepts().map(concept => [concept.id, concept]));
        return FAULTLINE_CHALLENGES.map(challenge => {
          const target = concepts.get(challenge.conceptId);
          const options = Array.isArray(challenge.options) ? challenge.options : [];
          const normal = value => this.normalizeFact(value);
          const distinct = new Set(options.map(normal));
          if (!target || options.length !== 4 || distinct.size !== 4 || !options.some(option => normal(option) === normal(challenge.answer))) return null;
          return { ...challenge, target };
        }).filter(Boolean);
      }

      buildFaultlineDeck(count = 10) {
        const all = this.getFaultlineChallenges();
        const byLevel = items => this.levelFilter === "All" ? items : items.filter(item => (item.level || item.target.level || "Foundation") === this.levelFilter);
        const chapterPool = items => items.filter(item => item.target.subtopic === this.subtopic && (this.topic === "All" || item.target.topic === this.topic));
        const topicPool = items => this.topic === "All" ? items : items.filter(item => item.target.topic === this.topic);
        const tiers = [];
        if (this.subtopic !== "All") {
          tiers.push({ label: `Chapter · ${this.subtopic}`, items: byLevel(chapterPool(all)) });
          if (this.topic !== "All") tiers.push({ label: `Expanded to ${this.topic}`, items: byLevel(topicPool(all)) });
          tiers.push({ label: "Expanded to all chapters", items: byLevel(all) });
        } else if (this.topic !== "All") {
          tiers.push({ label: `Topic · ${this.topic}`, items: byLevel(topicPool(all)) });
          tiers.push({ label: "Expanded to all chapters", items: byLevel(all) });
        } else {
          tiers.push({ label: "All reviewed challenges", items: byLevel(all) });
        }
        if (this.levelFilter !== "All") tiers.push({ label: "Included both Foundation and Advanced", items: all });

        const selected = [];
        const seen = new Set();
        let lastTier = tiers[0]?.label || "Reviewed challenge bank";
        let usedTierCount = 0;
        for (const tier of tiers) {
          const candidates = this.shuffleList(tier.items.filter(item => !seen.has(item.id)));
          if (!candidates.length) continue;
          usedTierCount++;
          lastTier = tier.label;
          for (const item of candidates) {
            if (seen.has(item.id)) continue;
            seen.add(item.id);
            selected.push(item);
            if (selected.length >= count) break;
          }
          if (selected.length >= count) break;
        }
        // Put straightforward checks first, then reasoning-heavy challenges at the end.
        const deck = [];
        [0, 1, 2].forEach(level => {
          deck.push(...this.shuffleList(selected.filter(item => Number(item.difficulty || 0) === level)));
        });
        const scopeLabel = usedTierCount > 1 || selected.length < count
          ? (this.levelFilter !== "All" && lastTier.includes("both Foundation") ? "Scope widened · both levels included" : "Scope widened · more chapters included")
          : lastTier;
        return { deck: deck.slice(0, count), scopeLabel };
      }

      prepareFaultlineRound() {
        const state = this.faultlineState;
        const challenge = state.deck[state.index];
        if (!challenge) {
          state.active = false;
          state.phase = "idle";
          return;
        }
        const options = this.shuffleList([...challenge.options]);
        const answerNorm = this.normalizeFact(challenge.answer);
        const correctIndex = options.findIndex(option => this.normalizeFact(option) === answerNorm);
        if (correctIndex < 0 || new Set(options.map(option => this.normalizeFact(option))).size !== 4) {
          state.active = false;
          state.phase = "idle";
          state.current = null;
          return;
        }
        state.current = {
          ...challenge,
          options,
          correctIndex,
          selectedIndex: null,
          result: null,
          questionType: challenge.type
        };
        state.phase = "answer";
        state.phaseStartedAt = Date.now();
        state.answerStartedAt = Date.now();
      }

      startFaultline() {
        this.clearTimers();
        const built = this.buildFaultlineDeck(10);
        this.faultlineState = {
          active: built.deck.length > 0,
          phase: "answer",
          deck: built.deck,
          index: 0,
          current: null,
          score: 0,
          streak: 0,
          maxStreak: 0,
          speedBonusCount: 0,
          scopeLabel: built.scopeLabel,
          runResults: [],
          lastRunScore: this.faultlineState.lastRunScore || 0,
          phaseStartedAt: Date.now(),
          answerStartedAt: Date.now()
        };
        this.prepareFaultlineRound();
        if (!this.faultlineState.deck.length || !this.faultlineState.active) {
          this.faultlineState.active = false;
          this.faultlineState.phase = "idle";
        } else {
          this.startGameTicker();
        }
        this.renderMain();
      }

      startGameTicker() {
        this.clearTimers();
        this.activeTimer = setInterval(() => this.tickGameTimers(), 100);
      }

      tickGameTimers() {
        const now = Date.now();
        const after = this.afterimageState;
        if (after.active) {
          if (after.phase === "preview") {
            const remaining = Math.max(0, after.previewDurationMs - (now - after.phaseStartedAt));
            const label = document.getElementById("after-time-label");
            const bar = document.getElementById("after-preview-progress");
            if (label) label.textContent = `Preview ${(remaining / 1000).toFixed(1)}s`;
            if (bar) bar.style.width = `${(remaining / after.previewDurationMs) * 100}%`;
            if (remaining <= 0) {
              after.phase = "answer";
              after.answerStartedAt = now;
              this.renderMain();
            }
          } else if (after.phase === "answer") {
            this.updateAnswerClock("after", now - after.answerStartedAt, 15000);
            if (now - after.answerStartedAt >= 15000) this.resolveFormulaAnswer("afterimage", -1, true);
          }
        } else {
          const fault = this.faultlineState;
          if (fault.active && fault.phase === "answer") {
            this.updateAnswerClock("faultline", now - fault.answerStartedAt, 25000);
            if (now - fault.answerStartedAt >= 25000) this.resolveFormulaAnswer("faultline", -1, true);
          }
        }
      }

      updateAnswerClock(prefix, elapsedMs, limitMs) {
        const remainingMs = Math.max(0, limitMs - elapsedMs);
        const label = document.getElementById(`${prefix}-time-label`);
        const bar = document.getElementById(`${prefix}-answer-progress`);
        if (label) label.textContent = `${(remainingMs / 1000).toFixed(1)}s`;
        if (bar) bar.style.width = `${(remainingMs / limitMs) * 100}%`;
      }

      answerAfterimage(index) {
        this.resolveFormulaAnswer("afterimage", index, false);
      }

      answerFaultline(index) {
        this.resolveFormulaAnswer("faultline", index, false);
      }

      resolveFormulaAnswer(gameName, selectedIndex, timedOut = false) {
        const isAfterimage = gameName === "afterimage";
        const isFaultline = gameName === "faultline";
        if (!isAfterimage && !isFaultline) return;
        const state = isAfterimage ? this.afterimageState : this.faultlineState;
        if (!state.active || state.phase !== "answer" || !state.current) return;
        const elapsedMs = Math.max(0, Date.now() - state.answerStartedAt);
        const elapsedSeconds = elapsedMs / 1000;
        const correct = !timedOut && selectedIndex === state.current.correctIndex;
        let bonus = 0;
        let points = 0;
        let multiplier = 1;
        const base = correct ? 100 : 0;
        if (correct) {
          state.streak += 1;
          if (isFaultline) state.maxStreak = Math.max(state.maxStreak || 0, state.streak);
          const bonusCap = isAfterimage ? 100 : 30;
          bonus = elapsedSeconds <= 10 ? Math.max(0, Math.round(bonusCap * (1 - elapsedSeconds / 10))) : 0;
          if (bonus > 0) state.speedBonusCount = (state.speedBonusCount || 0) + 1;
          multiplier = Math.min(isAfterimage ? 1.5 : 1.3, 1 + Math.floor(state.streak / 3) * 0.1);
          points = Math.round((base + bonus) * multiplier);
          state.score += points;
          this.state.arcade.xp += Math.max(1, Math.round(points / 10));
        } else {
          state.streak = 0;
          if (!this.state.reviseQueue.includes(state.current.target.id)) this.state.reviseQueue.push(state.current.target.id);
        }
        if (isFaultline) {
          state.runResults = state.runResults || [];
          state.runResults.push({
            conceptId: state.current.target.id,
            challengeId: state.current.id,
            questionType: state.current.questionType || "error diagnosis",
            correct, timedOut, elapsedSeconds, points, round: state.index + 1
          });
        }
        state.current.selectedIndex = selectedIndex;
        state.current.result = { correct, timedOut, elapsedSeconds, base, bonus, multiplier, points };
        state.phase = "feedback";
        state.lastRunScore = state.score;
        const bestKey = isAfterimage ? "afterimageBest" : "faultlineBest";
        this.state.arcade[bestKey] = Math.max(this.state.arcade[bestKey] || 0, state.score);
        this.clearTimers();
        this.saveState();
        this.renderMain();
      }

      continueAfterimage() {
        const state = this.afterimageState;
        if (!state.active || state.phase !== "feedback") return;
        if (state.index >= state.deck.length - 1) {
          state.active = false;
          state.phase = "complete";
          state.lastRunScore = state.score;
          this.state.arcade.afterimageRuns = (this.state.arcade.afterimageRuns || 0) + 1;
          this.saveState();
          this.renderMain();
          return;
        }
        state.index += 1;
        this.prepareAfterimageRound();
        this.startGameTicker();
        this.renderMain();
      }

      continueFaultline() {
        const state = this.faultlineState;
        if (!state.active || state.phase !== "feedback") return;
        if (state.index >= state.deck.length - 1) {
          state.active = false;
          state.phase = "complete";
          state.lastRunScore = state.score;
          this.state.arcade.faultlineRuns = (this.state.arcade.faultlineRuns || 0) + 1;
          this.saveState();
          this.renderMain();
          return;
        }
        state.index += 1;
        this.prepareFaultlineRound();
        this.startGameTicker();
        this.renderMain();
      }

      // =======================================================================
      // MODALS (+ ADD & SYNC)
      // =======================================================================
      populateModalSubtopics() {
        const topicEl = document.getElementById("add-topic");
        const subEl = document.getElementById("add-subtopic");
        if (!topicEl || !subEl) return;
        const chapters = TOPIC_CHAPTER_MAP[topicEl.value] || [];
        subEl.innerHTML = chapters.map(ch => `<option value="${ch}">${ch}</option>`).join("");
      }

      openAddModal() {
        this.populateModalSubtopics();
        document.getElementById("add-modal").classList.remove("hidden");
      }
      closeAddModal() {
        document.getElementById("add-modal").classList.add("hidden");
      }
      saveCustomConcept(e) {
        e.preventDefault();
        const newCard = {
          id: "c_custom_" + Date.now(),
          topic: document.getElementById("add-topic").value,
          subtopic: document.getElementById("add-subtopic").value,
          level: document.getElementById("add-level").value,
          title: document.getElementById("add-title").value.trim(),
          formula: document.getElementById("add-formula").value.trim(),
          highlight: document.getElementById("add-highlight").value.trim(),
          bullets: [
            document.getElementById("add-b1").value.trim(),
            document.getElementById("add-b2").value.trim()
          ],
          hook: document.getElementById("add-hook").value.trim()
        };
        this.state.customConcepts.push(newCard);
        this.saveState();
        document.getElementById("add-form").reset();
        this.closeAddModal();
        this.renderAll();
      }

      openSyncModal() {
        document.getElementById("sync-textarea").value = JSON.stringify(this.state, null, 2);
        document.getElementById("sync-modal").classList.remove("hidden");
      }
      closeSyncModal() {
        document.getElementById("sync-modal").classList.add("hidden");
      }
      copySyncState() {
        const el = document.getElementById("sync-textarea");
        el.select();
        navigator.clipboard.writeText(el.value);
        alert("State JSON copied to clipboard!");
      }
      restoreSyncState() {
        try {
          const parsed = JSON.parse(document.getElementById("sync-textarea").value);
          this.state = { ...defaultState(), ...parsed, arcade: { ...defaultState().arcade, ...(parsed.arcade || {}) } };
          this.saveState();
          this.closeSyncModal();
          this.renderAll();
        } catch (err) {
          alert("Invalid JSON string. Please check format.");
        }
      }

      // =======================================================================
      // RENDERING PIPELINE
      // =======================================================================
      renderAll() {
        this.renderHeaderTabs();
        this.renderTopicBar();
        this.renderSubtopicBar();
        this.renderSubfilters();
        this.renderMain();
      }

      renderHeaderTabs() {
        const activeStyle = "bg-white text-slate-950 shadow-sm";
        const idleStyle = "text-white/75 hover:text-white hover:bg-white/10";
        ["revise", "arcade"].forEach(s => {
          const btn = document.getElementById(`tab-${s}`);
          if (btn) {
            btn.className = `py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1 ${this.section === s ? activeStyle : idleStyle}`;
          }
        });
      }

      renderTopicBar() {
        const container = document.getElementById("topic-bar");
        container.innerHTML = TOPICS.map(t => {
          const active = this.topic === t;
          const chCount = t === "All" ? 26 : (TOPIC_CHAPTER_MAP[t] || []).length;
          return `<button onclick="window.app.setTopic('${t}')" class="px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition flex items-center space-x-1 ${
            active ? "bg-amber-400 text-slate-950 shadow font-bold" : "bg-white/10 text-white/80 hover:bg-white/20"
          }"><span>${t}</span><span class="text-[10px] opacity-75">(${chCount})</span></button>`;
        }).join("");
      }

      renderSubtopicBar() {
        const selectEl = document.getElementById("subtopic-select");
        const container = document.getElementById("subtopic-bar");
        const chapters = this.getAvailableSubtopics();

        // 1. Populate Left Dropdown (#subtopic-select)
        // Always includes "All 26 Chapters" at top to reset selection, plus Topic-group & Chapter options
        if (selectEl) {
          const isGlobalAll = this.topic === "All" && this.subtopic === "All";
          let optionsHtml = `<option value="All" ${isGlobalAll ? "selected" : ""}>📂 All 26 Chapters</option>`;

          for (const [grpTopic, grpChapters] of Object.entries(TOPIC_CHAPTER_MAP)) {
            optionsHtml += `<optgroup label="── ${grpTopic} (${grpChapters.length}) ──">`;
            const isTopicAll = this.topic === grpTopic && this.subtopic === "All";
            optionsHtml += `<option value="TOPIC:${grpTopic}" ${isTopicAll ? "selected" : ""}>📂 All ${grpTopic} (${grpChapters.length})</option>`;
            grpChapters.forEach(ch => {
              const isSelected = this.subtopic === ch ? "selected" : "";
              optionsHtml += `<option value="${ch}" ${isSelected}>${ch}</option>`;
            });
            optionsHtml += `</optgroup>`;
          }
          selectEl.innerHTML = optionsHtml;
        }

        // 2. Populate Neighboring Horizontal Chapter Buttons (#subtopic-bar)
        // Dynamically changes according to what's selected in the dropdown (no redundant "All 26 Chapters" button)
        container.innerHTML = chapters.map(ch => {
          const active = this.subtopic === ch;
          return `<button data-chapter="${ch}" onclick="window.app.setSubtopic('${ch.replace(/'/g, "\\'")}')" class="px-2.5 py-1 rounded-lg text-[11px] font-medium whitespace-nowrap transition ${
            active
              ? "bg-indigo-400/30 text-amber-300 border border-amber-400/50 font-bold shadow-sm"
              : "bg-white/5 text-white/70 hover:bg-white/15 border border-transparent"
          }">${ch}</button>`;
        }).join("");

        // Auto-scroll active chapter button into view if selected
        if (this.subtopic !== "All") {
          requestAnimationFrame(() => {
            const activeBtn = container.querySelector(`[data-chapter="${CSS.escape(this.subtopic)}"]`);
            if (activeBtn) {
              activeBtn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
            }
          });
        }
      }

      renderSubfilters() {
        const bar = document.getElementById("subfilter-bar");
        const levelBar = document.getElementById("level-bar");

        if (this.section === "revise") {
          bar.className = "flex space-x-2 overflow-x-auto no-scrollbar pb-0.5";
          const scoped = this.getTopicScopedConcepts();
          const savedCnt = scoped.filter(c => this.state.savedConcepts.includes(c.id)).length;
          const queueCnt = scoped.filter(c => this.state.reviseQueue.includes(c.id)).length;
          const mastCnt = scoped.filter(c => this.state.masteredConcepts.includes(c.id)).length;

          const items = [
            { id: "all", label: `All Concepts (${scoped.length})` },
            { id: "saved", label: `🔖 Saved (${savedCnt})` },
            { id: "queue", label: `⚡ Revise Queue (${queueCnt})` },
            { id: "mastered", label: `✅ Mastered (${mastCnt})` }
          ];
          bar.innerHTML = items.map(i => `
            <button onclick="window.app.setReviseSub('${i.id}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap border transition ${
              this.reviseSub === i.id
                ? "bg-[#1e1b4b] text-white border-[#1e1b4b] shadow-sm"
                : "bg-white text-slate-700 border-indigo-100 hover:border-indigo-300"
            }">${i.label}</button>
          `).join("");

          // Level Ladder Filter (All Levels | 🌱 Foundations | 🚀 Advanced)
          const fndCnt = scoped.filter(c => (c.level || "Foundation") === "Foundation").length;
          const advCnt = scoped.filter(c => c.level === "Advanced").length;
          const levels = [
            { id: "All", label: `All Levels (${scoped.length})` },
            { id: "Foundation", label: `🌱 Foundations (${fndCnt})` },
            { id: "Advanced", label: `🚀 Advanced (${advCnt})` }
          ];
          levelBar.classList.remove("hidden");
          levelBar.innerHTML = levels.map(l => `
            <button onclick="window.app.setLevelFilter('${l.id}')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold whitespace-nowrap border transition ${
              this.levelFilter === l.id
                ? "bg-amber-400 text-slate-950 border-amber-400 shadow-sm"
                : "bg-indigo-50 text-indigo-900 border-indigo-200 hover:bg-indigo-100"
            }">${l.label}</button>
          `).join("");
        } else {
          levelBar.classList.add("hidden");
          bar.className = "flex space-x-2 overflow-x-auto no-scrollbar pb-1";
          const games = [
            { id: "afterimage", label: "✧ Afterimage" },
            { id: "faultline", label: "⌁ Faultline" }
          ];
          bar.innerHTML = games.map((g, index) => `
            <button aria-pressed="${this.arcadeGame === g.id}" onclick="window.app.setArcadeGame('${g.id}')" class="game-mode-button flex-1 min-w-[145px] px-5 py-3 rounded-xl text-sm sm:text-base font-black whitespace-nowrap border transition ${
              this.arcadeGame === g.id
                ? "bg-amber-400 text-slate-950 border-amber-300 shadow-lg shadow-amber-500/25 scale-[1.02]"
                : "bg-slate-800 text-slate-300 border-slate-700 hover:border-slate-500 hover:bg-slate-700"
            }">${g.id === "afterimage" ? "✧ Afterimage" : "⌁ Faultline"}<span class="block text-[10px] font-medium opacity-75 mt-0.5">${g.id === "afterimage" ? "Memory trace" : "Catch and repair errors"}</span></button>
          `).join("");
        }
      }

      renderMain() {
        const main = document.getElementById("main-content");
        if (this.section === "revise") {
          main.innerHTML = this.renderReviseSection();
        } else {
          main.innerHTML = this.renderArcadeSection();
        }
      }

      // -----------------------------------------------------------------------
      // REVISE VIEW (With Foundation -> Advanced Badges & Inline SVG Diagrams)
      // -----------------------------------------------------------------------
      renderReviseSection() {
        const list = this.getFilteredConcepts();
        if (list.length === 0) {
          return `<div class="p-8 text-center bg-white rounded-2xl border border-indigo-100 text-slate-500 text-sm">No concept cards match this filter selection.</div>`;
        }
        return `<div class="space-y-4">${list.map(c => {
          const isSaved = this.state.savedConcepts.includes(c.id);
          const inQueue = this.state.reviseQueue.includes(c.id);
          const isMastered = this.state.masteredConcepts.includes(c.id);
          const isAdv = c.level === "Advanced";
          const levelBadge = isAdv
            ? `<span class="text-[10px] font-mono-code uppercase px-2 py-0.5 rounded-full bg-rose-500/25 text-rose-200 border border-rose-400/40 font-semibold">🚀 Advanced</span>`
            : `<span class="text-[10px] font-mono-code uppercase px-2 py-0.5 rounded-full bg-emerald-500/25 text-emerald-200 border border-emerald-400/40 font-semibold">🌱 Foundation</span>`;

          return `
            <article class="revise-card-gradient text-white rounded-2xl p-5 shadow-lg border border-indigo-400/20">
              <div class="flex flex-wrap justify-between items-center gap-2 mb-2.5">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="text-[10px] font-mono-code uppercase px-2.5 py-0.5 rounded-full bg-indigo-500/30 text-indigo-200 border border-indigo-400/30">${c.topic}</span>
                  <span class="text-xs text-amber-300 font-semibold">› ${c.subtopic}</span>
                  ${levelBadge}
                </div>
                <div class="flex space-x-1.5">
                  <button title="Save Bookmark" onclick="window.app.toggleArrayItem(window.app.state.savedConcepts, '${c.id}')" class="px-2 py-1 rounded-lg text-xs border ${isSaved ? 'bg-amber-400 text-slate-950 border-amber-300 font-bold' : 'bg-white/10 text-white/70 border-white/10'}">🔖</button>
                  <button title="Revise Queue" onclick="window.app.toggleArrayItem(window.app.state.reviseQueue, '${c.id}')" class="px-2 py-1 rounded-lg text-xs border ${inQueue ? 'bg-rose-500 text-white border-rose-400 font-bold' : 'bg-white/10 text-white/70 border-white/10'}">⚡</button>
                  <button title="Mark Mastered" onclick="window.app.toggleArrayItem(window.app.state.masteredConcepts, '${c.id}')" class="px-2 py-1 rounded-lg text-xs border ${isMastered ? 'bg-emerald-400 text-slate-950 border-emerald-300 font-bold' : 'bg-white/10 text-white/70 border-white/10'}">✅</button>
                </div>
              </div>

              <h2 class="text-base font-bold text-white mb-2.5">${c.title}</h2>

              ${c.svg ? `<div class="mb-2.5">${c.svg}</div>` : ""}

              <div class="p-3 rounded-xl bg-black/35 border border-indigo-300/20 font-mono-code text-xs text-indigo-100 mb-2.5 overflow-x-auto whitespace-pre-line leading-relaxed">${this.formatMathText(c.formula)}</div>
              <div class="p-2.5 rounded-xl bg-amber-400/15 border border-amber-400/40 text-amber-200 text-xs font-semibold mb-3">★ ${this.formatMathText(c.highlight)}</div>
              <ul class="space-y-1.5 text-xs text-indigo-100/90 mb-3 pl-4 list-disc">
                ${c.bullets.map(b => `<li>${this.formatMathText(b)}</li>`).join("")}
              </ul>
              <div class="pt-2.5 border-t border-white/10 text-xs text-amber-300 font-medium flex items-center justify-between">
                <span>🧠 <em>${this.formatMathText(c.hook)}</em></span>
              </div>
            </article>
          `;
        }).join("")}</div>`;
      }

      // -----------------------------------------------------------------------
      // ARCADE VIEW: TWO LIGHTWEIGHT FORMULA GAMES
      // -----------------------------------------------------------------------
      renderArcadeSection() {
        const arcade = this.state.arcade || {};
        const statsBar = `
          <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="arcade-card border border-slate-800 rounded-xl p-3 text-center">
              <div class="text-[10px] font-mono-code uppercase text-slate-400">Total XP</div>
              <div class="text-base font-black text-amber-400">✦ ${Number(arcade.xp || 0)}</div>
            </div>
            <div class="arcade-card border border-slate-800 rounded-xl p-3 text-center">
              <div class="text-[10px] font-mono-code uppercase text-slate-400">Afterimage Best</div>
              <div class="text-base font-black text-violet-300">${Number(arcade.afterimageBest || 0)}</div>
            </div>
            <div class="arcade-card border border-slate-800 rounded-xl p-3 text-center">
              <div class="text-[10px] font-mono-code uppercase text-slate-400">Faultline Best</div>
              <div class="text-base font-black text-amber-300">${Number(arcade.faultlineBest || 0)}</div>
            </div>
          </div>
        `;
        return statsBar + (this.arcadeGame === "faultline" ? this.renderFaultlineGame() : this.renderAfterimageGame());
      }

      renderGameLanding(gameName) {
        const isAfter = gameName === "afterimage";
        const state = isAfter ? this.afterimageState : this.faultlineState;
        const complete = state.phase === "complete";
        const title = isAfter ? "Afterimage" : "Faultline";
        const subtitle = isAfter ? "Watch it. Hold it. Rebuild it." : "Spot the slip. Repair the reasoning.";
        const description = isAfter
          ? "A formula flashes, then vanishes. Choose the matching expression before the trace fades."
          : "Inspect a worked step. Find the fault. Choose the repair.";
        const missedCount = this.state.reviseQueue.length;
        const scopePreview = isAfter
          ? (this.subtopic !== "All" ? `Starts in ${this.subtopic}; expands only when needed.` : this.topic !== "All" ? `Starts within ${this.topic}; expands only when needed.` : "A varied run across the available concepts.")
          : (this.subtopic !== "All" ? `Starting chapter: ${this.subtopic}.` : this.topic !== "All" ? `Starting topic: ${this.topic}.` : "Challenges across all chapters.");
        const startButton = isAfter ? "Start Afterimage" : "Start Faultline";
        const action = isAfter ? "startAfterimage" : "startFaultline";
        const accent = isAfter ? "violet" : "amber";
        const lastScore = Number(state.lastRunScore || 0);
        const bestKey = isAfter ? "afterimageBest" : "faultlineBest";
        const best = Number(this.state.arcade[bestKey] || 0);
        return `
          <section class="game-panel rounded-2xl p-5 sm:p-6 overflow-hidden relative">
            <div class="absolute -top-20 -right-16 w-56 h-56 rounded-full blur-3xl opacity-10 ${isAfter ? "bg-violet-400" : "bg-amber-400"}"></div>
            <div class="relative">
              <div class="flex items-start justify-between gap-3 mb-5">
                <div>
                  <div class="text-[10px] font-mono-code tracking-[.24em] uppercase ${isAfter ? "text-violet-300" : "text-amber-300"}">${isAfter ? "MEMORY TRACE" : "ERROR ANALYSIS"}</div>
                  <h2 class="text-2xl sm:text-3xl font-black text-white mt-1">${title}</h2>
                  <p class="text-sm text-slate-300 mt-1">${subtitle}</p>
                </div>
                <div class="text-3xl sm:text-4xl ${isAfter ? "text-violet-300" : "text-amber-300"}">${isAfter ? "✧" : "⌁"}</div>
              </div>
              <p class="text-xs sm:text-sm text-slate-300 leading-relaxed max-w-xl mb-2">${description}</p>
              <p class="text-xs text-amber-200/80 leading-relaxed max-w-xl mb-5">${this.escapeHTML(scopePreview)}</p>
              ${isAfter ? `<div class="grid grid-cols-2 gap-2 mb-5"><div class="rounded-xl border border-white/10 bg-white/[.035] p-3"><div class="text-[10px] uppercase tracking-wider text-slate-500 mb-1">Rounds</div><div class="text-sm font-bold text-white">10 per run</div></div><div class="rounded-xl border border-white/10 bg-white/[.035] p-3"><div class="text-[10px] uppercase tracking-wider text-slate-500 mb-1">Answer window</div><div class="text-sm font-bold text-white">15 seconds</div></div></div>` : `<div class="inline-flex flex-wrap gap-2 mb-5"><span class="rounded-full border border-white/10 bg-white/[.035] px-3 py-1.5 text-xs text-slate-300">10 challenges per run</span><span class="rounded-full border border-white/10 bg-white/[.035] px-3 py-1.5 text-xs text-slate-300">25 seconds each</span><span class="rounded-full border border-white/10 bg-white/[.035] px-3 py-1.5 text-xs text-slate-300">Misses → Revise Queue</span></div>`}
              ${complete ? `<div class="rounded-xl border ${isAfter ? "border-violet-400/30 bg-violet-400/10" : "border-amber-400/30 bg-amber-400/10"} p-4 mb-4"><div class="text-xs text-slate-300">Last run complete</div><div class="text-2xl font-black text-white mt-1">${lastScore.toLocaleString()} pts</div><div class="text-xs text-slate-400 mt-1">Best: ${best.toLocaleString()} pts</div>${!isAfter ? (() => { const rs = state.runResults || []; const right = rs.filter(r => r.correct).length; const avg = rs.length ? (rs.reduce((sum, r) => sum + r.elapsedSeconds, 0) / rs.length).toFixed(1) : "—"; return `<div class="grid grid-cols-3 gap-2 mt-3"><div class="rounded-lg bg-black/20 p-2"><div class="text-[9px] text-slate-400 uppercase">Accuracy</div><div class="text-sm font-black text-white">${rs.length ? Math.round(right / rs.length * 100) : 0}%</div></div><div class="rounded-lg bg-black/20 p-2"><div class="text-[9px] text-slate-400 uppercase">Avg. time</div><div class="text-sm font-black text-white">${avg}s</div></div><div class="rounded-lg bg-black/20 p-2"><div class="text-[9px] text-slate-400 uppercase">Best streak</div><div class="text-sm font-black text-white">${Number(state.maxStreak || 0)}</div></div></div>`; })() : ""}</div>` : (lastScore > 0 ? `<div class="text-xs text-slate-400 mb-4">Last run: <strong class="text-white">${lastScore.toLocaleString()} pts</strong></div>` : "")}
              <button onclick="window.app.${action}()" class="w-full sm:w-auto px-6 py-3 rounded-xl font-black text-sm text-slate-950 shadow-lg transition hover:brightness-110 ${isAfter ? "bg-violet-300 shadow-violet-500/15" : "bg-amber-300 shadow-amber-500/15"}">${startButton} <span aria-hidden="true">→</span></button>
              ${missedCount ? `<button onclick="window.app.goToReviseQueue()" class="w-full sm:w-auto sm:ml-2 mt-3 px-5 py-3 rounded-xl border border-rose-400/40 bg-rose-400/10 text-rose-200 text-sm font-bold hover:bg-rose-400/20 transition">Review missed cards (${missedCount}) →</button>` : ""}
              ${isAfter ? "" : `<p class="text-[10px] text-slate-500 mt-4">Diagnose first; speed is a bonus, not the goal.</p>`}
            </div>
          </section>
        `;
      }

      renderAfterimageGame() {
        const state = this.afterimageState;
        if (!state.active || !state.current) return this.renderGameLanding("afterimage");
        const current = state.current;
        const target = current.target;
        const phase = state.phase;
        const isPreview = phase === "preview";
        const isAnswer = phase === "answer";
        const result = current.result;
        const formula = this.formatMathText(current.formula);
        const title = this.escapeHTML(target.title);
        const roundCount = `${state.index + 1} / ${state.deck.length}`;
        const topic = this.escapeHTML(`${target.topic} · ${target.subtopic}`);
        const progress = ((state.index + (isPreview ? 0.25 : isAnswer ? 0.6 : 1)) / state.deck.length) * 100;
        const optionsHtml = current.options.map((option, idx) => {
          let cls = "border-violet-400/20 bg-slate-900/90 text-slate-100 hover:border-violet-300/70 hover:bg-violet-950/30";
          if (phase === "feedback") {
            if (idx === current.correctIndex) cls = "border-emerald-400/80 bg-emerald-950/60 text-emerald-100";
            else if (idx === current.selectedIndex) cls = "border-rose-400/80 bg-rose-950/50 text-rose-100";
            else cls = "border-slate-800 bg-slate-950/50 text-slate-500 opacity-60";
          }
          return `<button ${isAnswer ? "" : "disabled"} onclick="window.app.answerAfterimage(${idx})" class="game-option w-full text-left rounded-xl border p-3 sm:p-4 font-mono-code text-xs sm:text-sm ${cls} ${phase === "feedback" ? "cursor-default" : ""}"><span class="text-violet-300/80 text-[10px] block mb-1">${String.fromCharCode(65 + idx)}</span>${this.formatMathText(option)}</button>`;
        }).join("");
        const feedback = result ? `
          <div class="rounded-xl border ${result.correct ? "border-emerald-400/40 bg-emerald-400/10" : "border-rose-400/40 bg-rose-400/10"} p-4 mt-4">
            <div class="font-bold text-sm ${result.correct ? "text-emerald-200" : "text-rose-200"}">${result.timedOut ? "Trace lost — time expired" : result.correct ? `Locked in · +${result.points} pts` : "Not this pattern · +0 pts"}</div>
            <div class="text-xs text-slate-300 mt-1">${result.correct ? `Base 100 + speed bonus ${result.bonus}${result.multiplier > 1 ? ` · ${result.multiplier.toFixed(1)}× streak` : ""}` : `Correct pattern: ${formula}`}</div>
            ${!result.correct ? `<div class="font-mono-code text-xs text-white whitespace-pre-line mt-2">${formula}</div><button onclick="window.app.goToReviseQueue()" class="mt-3 text-xs font-bold text-rose-200 underline underline-offset-2">Review missed cards in Revise Queue →</button>` : ""}
          </div>
          <button onclick="window.app.continueAfterimage()" class="w-full mt-3 px-4 py-3 rounded-xl bg-violet-300 hover:bg-violet-200 text-slate-950 text-sm font-black">${state.index >= state.deck.length - 1 ? "Finish run" : "Next trace →"}</button>
        ` : "";
        return `
          <section class="game-panel rounded-2xl p-4 sm:p-5 overflow-hidden">
            <div class="flex items-center justify-between gap-2 mb-4">
              <div><div class="text-[10px] uppercase tracking-[.2em] text-violet-300">AFTERIMAGE</div><div class="text-xs text-slate-400 mt-1">${this.escapeHTML(state.scopeLabel || topic)}</div></div>
              <div class="text-right"><div class="text-[10px] text-slate-500">ROUND</div><div class="font-mono-code font-bold text-white">${roundCount}</div></div>
              <div class="text-right"><div class="text-[10px] text-slate-500">SCORE</div><div class="font-mono-code font-black text-violet-200">${state.score.toLocaleString()}</div></div>
              <div class="text-right"><div class="text-[10px] text-slate-500">STREAK</div><div class="font-mono-code font-bold text-amber-300">${state.streak}</div></div>
            </div>
            <div class="w-full h-1.5 rounded-full bg-slate-800 overflow-hidden mb-4"><div class="game-progress h-full rounded-full bg-violet-400" style="width:${progress}%"></div></div>
            <div class="rounded-2xl border border-violet-400/30 bg-gradient-to-br from-violet-950/60 to-slate-950 p-4 sm:p-6 mb-4 min-h-[176px] flex flex-col justify-center items-center text-center">
              <div class="text-[10px] uppercase tracking-[.22em] text-violet-300 mb-2">${isPreview ? "Hold this trace" : isAnswer ? "Rebuild the pattern" : "Trace resolved"}</div>
              <h2 class="text-base sm:text-lg font-bold text-white mb-4 max-w-2xl">${title}</h2>
              ${isPreview ? `<div class="afterimage-glow w-full max-w-2xl rounded-xl border border-violet-300/35 bg-slate-950/80 p-4 sm:p-5"><div class="font-mono-code text-sm sm:text-lg text-violet-100 whitespace-pre-line break-words">${formula}</div></div><div id="after-time-label" class="text-xs text-violet-200 mt-3">Preview 2.3s</div><div class="w-full max-w-xs h-1 bg-slate-800 rounded-full overflow-hidden mt-2"><div id="after-preview-progress" class="h-full bg-violet-300 rounded-full" style="width:100%"></div></div>` : isAnswer ? `<div class="text-sm text-slate-300">Which version matches the trace?</div><div class="mt-3 text-xs text-violet-200">Time left <strong id="after-time-label" class="font-mono-code">15.0s</strong></div><div class="w-full max-w-xs h-1.5 bg-slate-800 rounded-full overflow-hidden mt-2"><div id="after-answer-progress" class="game-progress h-full bg-violet-300" style="width:100%"></div></div>` : `<div class="text-xs text-slate-300">Response time: ${result.elapsedSeconds.toFixed(2)}s</div>`}
            </div>
            ${isAnswer || phase === "feedback" ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">${optionsHtml}</div>` : ""}
            ${feedback}
            <div class="flex items-center justify-between gap-3 mt-4 text-[10px] text-slate-500"><span>Fast correct picks earn a bonus for the first 10 seconds.</span><span>${state.deck.length - state.index - (phase === "feedback" ? 1 : 0)} left</span></div>
          </section>
        `;
      }

      renderFaultlineGame() {
        const state = this.faultlineState;
        if (!state.active || !state.current) return this.renderGameLanding("faultline");
        const current = state.current;
        const phase = state.phase;
        const isAnswer = phase === "answer";
        const result = current.result;
        const scenarioHtml = this.formatMathText(current.scenario || "");
        const questionHtml = this.formatMathText(current.question || "");
        const roundCount = `${state.index + 1} / ${state.deck.length}`;
        const progress = ((state.index + (isAnswer ? 0.55 : 1)) / state.deck.length) * 100;
        const difficultyLabel = ["EASY", "MID", "HARD"][Math.max(0, Math.min(2, Number(current.difficulty || 0)))];
        const optionsHtml = current.options.map((option, idx) => {
          let cls = "border-amber-400/20 bg-slate-900/90 text-slate-100 hover:border-amber-300/70 hover:bg-amber-950/30";
          if (phase === "feedback") {
            if (idx === current.correctIndex) cls = "border-emerald-400/80 bg-emerald-950/60 text-emerald-100";
            else if (idx === current.selectedIndex) cls = "border-rose-400/80 bg-rose-950/50 text-rose-100";
            else cls = "border-slate-800 bg-slate-950/50 text-slate-500 opacity-60";
          }
          return `<button ${isAnswer ? "" : "disabled"} onclick="window.app.answerFaultline(${idx})" class="game-option game-answer-copy w-full text-left rounded-xl border p-3 sm:p-4 font-mono-code text-xs sm:text-sm ${cls}"><span class="text-amber-300/80 text-[10px] block mb-1">${String.fromCharCode(65 + idx)}</span>${this.formatMathText(String(option ?? ""))}</button>`;
        }).join("");
        const feedback = result ? `
          <div class="rounded-xl border ${result.correct ? "border-emerald-400/40 bg-emerald-400/10" : "border-rose-400/40 bg-rose-400/10"} p-4 mt-4">
            <div class="font-bold text-sm ${result.correct ? "text-emerald-200" : "text-rose-200"}">${result.timedOut ? "Time expired — fault not repaired" : result.correct ? `Fault repaired · +${result.points} pts` : "Fault not repaired · +0 pts"}</div>
            <div class="text-xs text-slate-200 mt-3"><span class="uppercase tracking-wider text-[10px] text-amber-200 font-bold block mb-1">Correct repair</span>${this.formatMathText(current.correction || current.answer || "")}</div>
            <div class="text-xs text-slate-300 mt-3"><span class="uppercase tracking-wider text-[10px] text-slate-400 font-bold block mb-1">Why it matters</span>${this.formatMathText(current.explanation || "Review the source concept for the underlying rule.")}</div>
            <div class="text-[10px] text-slate-500 mt-3 border-t border-white/10 pt-2">Reference card: ${this.escapeHTML(current.target.title)} · ${this.escapeHTML(current.target.subtopic)} · ${this.escapeHTML(current.target.level || "Foundation")}</div>
            ${!result.correct ? `<div class="text-xs text-amber-200/90 mt-2">Added to the Revise Queue.</div><button onclick="window.app.goToReviseQueue()" class="mt-2 text-xs font-bold text-amber-200 underline underline-offset-2">Review missed cards in Revise Queue →</button>` : ""}
          </div>
          <button onclick="window.app.continueFaultline()" class="w-full mt-3 px-4 py-3 rounded-xl bg-amber-300 hover:bg-amber-200 text-slate-950 text-sm font-black">${state.index >= state.deck.length - 1 ? "Finish run" : "Next challenge →"}</button>
        ` : "";
        return `
          <section class="game-panel rounded-2xl p-4 sm:p-5 overflow-hidden">
            <div class="flex items-center justify-between gap-2 mb-4">
              <div><div class="text-[10px] uppercase tracking-[.2em] text-amber-300">FAULTLINE · ${difficultyLabel}</div><div class="text-xs text-slate-400 mt-1">${this.escapeHTML(state.scopeLabel || "Reviewed challenge run")}</div></div>
              <div class="text-right"><div class="text-[10px] text-slate-500">ROUND</div><div class="font-mono-code font-bold text-white">${roundCount}</div></div>
              <div class="text-right"><div class="text-[10px] text-slate-500">SCORE</div><div class="font-mono-code font-black text-amber-200">${state.score.toLocaleString()}</div></div>
              <div class="text-right"><div class="text-[10px] text-slate-500">STREAK</div><div class="font-mono-code font-bold text-emerald-300">${state.streak}</div></div>
            </div>
            <div class="w-full h-1.5 rounded-full bg-slate-800 overflow-hidden mb-4"><div class="game-progress h-full rounded-full bg-amber-400" style="width:${progress}%"></div></div>
            <div class="faultline-work rounded-xl p-4 sm:p-5 mb-4">
              <div class="faultline-tag text-[10px] uppercase text-amber-300 font-bold mb-2">Inspect the work</div>
              <div class="text-sm sm:text-base text-slate-100 leading-relaxed whitespace-pre-line">${scenarioHtml}</div>
            </div>
            <div class="rounded-xl border border-amber-400/25 bg-slate-950/70 p-4 sm:p-5 mb-4">
              <div class="faultline-tag text-[10px] uppercase text-amber-300 font-bold mb-2">Find the fault</div>
              <h2 class="text-base sm:text-lg font-bold text-white leading-relaxed">${questionHtml}</h2>
              ${isAnswer ? `<div class="flex justify-between items-center mt-4 text-xs text-slate-400"><span>Choose the valid repair</span><span class="font-mono-code font-bold text-amber-200" id="faultline-time-label">25.0s</span></div><div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mt-2"><div id="faultline-answer-progress" class="game-progress h-full bg-amber-400" style="width:100%"></div></div>` : `<div class="text-xs text-slate-300 mt-3">Response time: ${result.elapsedSeconds.toFixed(2)}s</div>`}
            </div>
            ${isAnswer || phase === "feedback" ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">${optionsHtml}</div>` : ""}
            ${feedback}
            <div class="flex items-center justify-between gap-3 mt-4 text-[10px] text-slate-500"><span>Diagnose first; speed earns up to 30 bonus points.</span><span>${state.deck.length - state.index - (phase === "feedback" ? 1 : 0)} left</span></div>
          </section>
        `;
      }

    }

    window.addEventListener("DOMContentLoaded", () => {
      window.app = new QuantApp();
    });
  </script>
</body>
</html>
