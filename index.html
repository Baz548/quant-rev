<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QuantByProf v4.0 — Foundation to CAT/GMAT Mastery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap');

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    /* 1. Revise Theme: Royal Indigo & Warm Study Ivory */
    body.theme-revise {
      background-color: #f6f5ff;
      color: #1e1b4b;
    }
    .revise-card-gradient {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 55%, #3730a3 100%);
    }

    /* 2. Arcade Theme: Electric Amber & Deep Slate */
    body.theme-arcade {
      background-color: #0f172a;
      color: #f8fafc;
    }
    .arcade-gradient {
      background: linear-gradient(135deg, #311042 0%, #7c2d12 50%, #b45309 100%);
    }
    .arcade-card {
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
    }

    /* Hide scrollbars for horizontal pill bars */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }


    /* v4.0: Afterimage + expanded, source-linked Faultline challenge bank */
    .game-panel {
      background: linear-gradient(145deg, rgba(15,23,42,.97), rgba(2,6,23,.98));
      border: 1px solid rgba(148,163,184,.22);
      box-shadow: 0 20px 50px rgba(0,0,0,.22);
    }
    .game-option {
      min-height: 66px;
      overflow-wrap: anywhere;
      white-space: pre-line;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .game-option:not(:disabled):active { transform: scale(.985); }
    .game-option:focus-visible { outline: 2px solid #fbbf24; outline-offset: 2px; }
    .afterimage-glow { animation: afterimageGlow 2.2s ease-in-out infinite alternate; }
    @keyframes afterimageGlow {
      from { box-shadow: 0 0 10px rgba(129,140,248,.12); opacity: .88; }
      to { box-shadow: 0 0 30px rgba(129,140,248,.35); opacity: 1; }
    }
    .faultline-work {
      border-left: 3px solid rgba(251,191,36,.8);
      background: linear-gradient(120deg, rgba(120,53,15,.20), rgba(15,23,42,.72));
    }
    .faultline-tag { letter-spacing: .18em; }
    .faultline-step { border: 1px solid rgba(251,191,36,.22); background: rgba(2,6,23,.55); }
    .game-progress { transition: width .12s linear; }

    /* v3.1: larger navigation targets while games are active */
    body.theme-arcade #subtopic-select {
      font-size: 12.65px !important;
      padding-top: .29rem !important;
      padding-bottom: .29rem !important;
      padding-left: .72rem !important;
      padding-right: .72rem !important;
      max-width: min(48vw, 270px) !important;
      min-height: 34px;
    }
    body.theme-arcade #subtopic-bar button {
      font-size: 12.65px !important;
      padding: .29rem .72rem !important;
      min-height: 32px;
    }
    .game-mode-button { min-height: 54px; animation: gameButtonPop .36s cubic-bezier(.2,.85,.25,1.2) both; }
    .game-mode-button:nth-child(2) { animation-delay: .06s; }
    @keyframes gameButtonPop {
      from { opacity: .5; transform: translateY(5px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    body.theme-arcade #subfilter-bar { gap: .55rem; }
    .game-answer-copy { overflow-wrap: anywhere; white-space: pre-line; }

    /* Math scripts: keep subscript and superscript alignment independent. */
    .math-text sub { font-size: .72em; line-height: 0; vertical-align: sub; }
    .math-text sup { font-size: .72em; line-height: 0; vertical-align: super; }
    @media (max-width: 640px) {
      body.theme-arcade #subtopic-select { max-width: 42vw !important; }
      body.theme-arcade #subtopic-bar button { padding-left: .62rem !important; padding-right: .62rem !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      .afterimage-glow { animation-duration: 8s !important; }
      .game-option, .game-progress { transition: none !important; }
    }

  </style>
</head>
<body class="theme-revise min-h-screen flex flex-col pb-20">

  <!-- TOP NAVIGATION BAR -->
  <header id="app-header" class="sticky top-0 z-40 shadow-md transition-colors duration-300 bg-[#1e1b4b] text-white">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="font-black text-lg tracking-tight">QuantByProf</span>
        <span id="version-badge" class="text-[10px] font-mono-code uppercase px-2 py-0.5 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/40 font-semibold">v4.0</span>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="window.app.openAddModal()" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/15 transition">+ Add</button>
        <button onclick="window.app.openSyncModal()" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 border border-white/15 transition">Sync</button>
      </div>
    </div>

    <!-- PRIMARY MODE SWITCHER (Revise | Arcade) -->
    <div class="max-w-4xl mx-auto px-4 pb-2.5">
      <div class="grid grid-cols-2 gap-1.5 bg-black/25 p-1 rounded-xl">
        <button id="tab-revise" onclick="window.app.setSection('revise')" class="py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1">
          <span>📖 Revise (52)</span>
        </button>
        <button id="tab-arcade" onclick="window.app.setSection('arcade')" class="py-2 rounded-lg text-xs font-bold transition flex items-center justify-center space-x-1">
          <span>🎮 Minigames</span>
        </button>
      </div>
    </div>

    <!-- PARENT TOPIC PILL BAR (6 Core Categories) -->
    <div class="border-t border-white/10 bg-black/15">
      <div id="topic-bar" class="max-w-4xl mx-auto px-4 py-2 flex space-x-2 overflow-x-auto no-scrollbar"></div>
    </div>

    <!-- SCOPED CHAPTER BAR: v2.4 DYNAMIC DROPDOWN ON THE LEFT + SCOPED CHAPTER BUTTONS ON THE RIGHT -->
    <div class="border-t border-white/5 bg-black/25">
      <div class="max-w-4xl mx-auto px-4 py-1.5 flex items-center space-x-2">
        <!-- Left: Sectional Chapter Dropdown (Includes "All 26 Chapters" reset + Topic/Chapter options) -->
        <div class="relative shrink-0">
          <select
            id="subtopic-select"
            aria-label="Select Chapter or Scope"
            onchange="window.app.handleDropdownChange(this.value)"
            class="bg-slate-900/90 text-amber-300 border border-amber-400/40 rounded-lg px-2.5 py-1 text-[11px] font-semibold focus:outline-none focus:border-amber-400 max-w-[180px] sm:max-w-[230px] truncate cursor-pointer shadow-sm"
          ></select>
        </div>
        <!-- Divider -->
        <span class="text-white/20 text-xs select-none">|</span>
        <!-- Right: Neighboring Chapter Buttons (Dynamically scoped by dropdown selection; no duplicate "All" button) -->
        <div id="subtopic-bar" class="flex space-x-1.5 overflow-x-auto no-scrollbar flex-1 items-center"></div>
      </div>
    </div>
  </header>

  <!-- SUB-FILTER & LEVEL LADDER BAR -->
  <div id="subfilter-container" class="max-w-4xl w-full mx-auto px-4 pt-3 space-y-2">
    <div id="subfilter-bar" class="flex space-x-2 overflow-x-auto no-scrollbar pb-0.5"></div>
    <div id="level-bar" class="flex space-x-2 overflow-x-auto no-scrollbar"></div>
  </div>

  <!-- MAIN VIEWPORT -->
  <main id="main-content" class="max-w-4xl w-full mx-auto px-4 pt-3 flex-1"></main>

  <!-- CONCEPT SHIELD / REFERENCE POPUP MODAL -->
  <div id="concept-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl border border-indigo-400/30 bg-[#1e1b4b] text-white p-5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-start mb-2">
        <div class="flex items-center space-x-2">
          <span id="modal-concept-badge" class="text-[10px] font-mono-code uppercase px-2.5 py-0.5 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/40">🛡️ Concept Shield</span>
          <span id="modal-concept-level" class="text-[10px] font-mono-code uppercase px-2 py-0.5 rounded-full"></span>
        </div>
        <button onclick="window.app.closeConceptModal()" class="text-white/60 hover:text-white text-xl leading-none">&times;</button>
      </div>
      <h3 id="modal-concept-title" class="text-base font-bold text-white mb-2.5"></h3>
      <div id="modal-concept-svg" class="mb-2.5 hidden"></div>
      <div class="p-3 rounded-xl bg-black/35 border border-white/10 font-mono-code text-xs text-indigo-100 mb-2.5 whitespace-pre-line leading-relaxed" id="modal-concept-formula"></div>
      <div class="p-2.5 rounded-lg bg-amber-400/15 border border-amber-400/40 text-amber-200 text-xs font-semibold mb-3" id="modal-concept-highlight"></div>
      <ul id="modal-concept-bullets" class="space-y-1.5 text-xs text-indigo-100 mb-3 list-disc pl-4"></ul>
      <div class="text-xs italic text-amber-300 bg-black/20 p-2.5 rounded-lg border border-white/5" id="modal-concept-hook"></div>
      <button onclick="window.app.closeConceptModal()" class="mt-4 w-full py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs transition">Got It — Continue</button>
    </div>
  </div>

  <!-- + ADD CUSTOM ITEM MODAL -->
  <div id="add-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="w-full max-w-lg rounded-2xl bg-white text-slate-900 p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-base">Add Custom Concept Card</h3>
        <button onclick="window.app.closeAddModal()" class="text-slate-400 hover:text-slate-700 text-xl">&times;</button>
      </div>
      <form id="add-form" onsubmit="window.app.saveCustomConcept(event)" class="space-y-3 text-xs">
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block font-semibold mb-1">Parent Topic</label>
            <select id="add-topic" onchange="window.app.populateModalSubtopics()" class="w-full p-2 rounded-lg border border-slate-300">
              <option value="Algebra">Algebra</option>
              <option value="Number Theory">Number Theory</option>
              <option value="Geometry">Geometry</option>
              <option value="Ratio & Mixtures">Ratio & Mixtures</option>
              <option value="Arithmetic">Arithmetic</option>
              <option value="Modern Math">Modern Math</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold mb-1">Chapter (Subtopic)</label>
            <select id="add-subtopic" class="w-full p-2 rounded-lg border border-slate-300"></select>
          </div>
          <div>
            <label class="block font-semibold mb-1">Stage / Level</label>
            <select id="add-level" class="w-full p-2 rounded-lg border border-slate-300">
              <option value="Foundation">🌱 Foundation</option>
              <option value="Advanced">🚀 Advanced</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block font-semibold mb-1">Concept Title</label>
          <input id="add-title" required placeholder="e.g., Remainder Cycle Theorem" class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Core Formula</label>
          <textarea id="add-formula" rows="2" required placeholder="e.g., log_b(xy) = log_b(x) + log_b(y)" class="w-full p-2 rounded-lg border border-slate-300 font-mono-code"></textarea>
        </div>
        <div>
          <label class="block font-semibold mb-1">Gold Highlight (Key Rule / Condition)</label>
          <input id="add-highlight" required placeholder="e.g., Base and argument must be strictly positive" class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Building Block / Recognition Bullet 1</label>
          <input id="add-b1" required placeholder="Step-by-step intuition or pattern cue..." class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">Exam Trap / Shortcut Bullet 2</label>
          <input id="add-b2" required placeholder="Common converse trap to avoid..." class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <div>
          <label class="block font-semibold mb-1">1-Line Memory Hook</label>
          <input id="add-hook" required placeholder="Short punchy mnemonic..." class="w-full p-2 rounded-lg border border-slate-300" />
        </div>
        <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold">Save Concept Card</button>
      </form>
    </div>
  </div>

  <!-- SYNC (EXPORT / IMPORT JSON) MODAL -->
  <div id="sync-modal" class="fixed inset-0 bg-black/75 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="w-full max-w-lg rounded-2xl bg-white text-slate-900 p-5 shadow-2xl">
      <div class="flex justify-between items-center mb-2">
        <h3 class="font-bold text-base">State Backup & JSON Sync</h3>
        <button onclick="window.app.closeSyncModal()" class="text-slate-400 hover:text-slate-700 text-xl">&times;</button>
      </div>
      <p class="text-xs text-slate-500 mb-3">Copy your <code>quantbyprof_v2_state</code> JSON backup or paste an existing state string below to restore progress and arcade stats.</p>
      <textarea id="sync-textarea" rows="7" class="w-full p-3 rounded-xl border border-slate-300 font-mono-code text-[11px] mb-3 focus:outline-none focus:border-indigo-600"></textarea>
      <div class="flex space-x-2">
        <button onclick="window.app.copySyncState()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-white font-bold text-xs">📋 Copy Backup</button>
        <button onclick="window.app.restoreSyncState()" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs">⚡ Restore State</button>
      </div>
    </div>
  </div>

  <!-- APPLICATION SCRIPT (ZERO-COMPILE ES6) -->
  <script>
    // =========================================================================
    // 1. STRICT TOPIC <-> 26 CHAPTER TAXONOMY (Verified Across All 3 T.I.M.E. Booklets)
    //    Booklet 1 (SM1002406): 7 Chapters
    //    Booklet 2 (SM1002408): 9 Chapters
    //    Booklet 3 (SM1002410): 10 Chapters
    //    Total = 26 Chapters
    // =========================================================================
    const TOPIC_CHAPTER_MAP = {
      "Algebra": [
        "Simple Equations",           // Booklet 1, Ch 1
        "Special Equations",          // Booklet 3, Ch 1
        "Quadratic Equations",        // Booklet 3, Ch 2
        "Inequalities and Modulus",   // Booklet 3, Ch 3
        "Sequences and Series",       // Booklet 3, Ch 4
        "Functions",                  // Booklet 3, Ch 5
        "Graphs",                     // Booklet 3, Ch 6
        "Indices – Surds",            // Booklet 3, Ch 7
        "Logarithms",                 // Booklet 3, Ch 8
        "Operator Based Questions"    // Booklet 2, Ch 8
      ],
      "Number Theory": [
        "Numbers – I",                // Booklet 2, Ch 1
        "Numbers – II",               // Booklet 2, Ch 2
        "Number Systems"              // Booklet 2, Ch 3
      ],
      "Geometry": [
        "Geometry",                   // Booklet 2, Ch 4
        "Mensuration",                // Booklet 2, Ch 5
        "Co-ordinate Geometry",       // Booklet 2, Ch 6
        "Trigonometry"                // Booklet 2, Ch 7
      ],
      "Ratio & Mixtures": [
        "Ratio – Proportion – Variation",     // Booklet 1, Ch 2
        "Averages – Mixtures – Alligations"   // Booklet 1, Ch 7
      ],
      "Arithmetic": [
        "Percentages – Profit & Loss – Partnerships", // Booklet 1, Ch 3
        "Simple Interest and Compound Interest",      // Booklet 1, Ch 4
        "Time and Distance",                          // Booklet 1, Ch 5
        "Time and Work"                               // Booklet 1, Ch 6
      ],
      "Modern Math": [
        "Permutations and Combinations", // Booklet 3, Ch 9
        "Probability",                   // Booklet 3, Ch 10
        "Statistics"                     // Booklet 2, Ch 9
      ]
    };

    const TOPICS = ["All", ...Object.keys(TOPIC_CHAPTER_MAP)];

    // =========================================================================
    // 2. AUDITED & MATHEMATICALLY VERIFIED INLINE SVG DIAGRAMS
    // =========================================================================
    const SVG_DIAGRAMS = {
      // Quadratic Parabola y = a(x - α)(x - β)
      parabola_roots: `
        <svg viewBox="0 0 320 98" class="w-full h-24 rounded-xl bg-slate-950/60 border border-indigo-400/25 p-1.5">
          <line x1="25" y1="52" x2="295" y2="52" stroke="#94a3b8" stroke-width="1.3"/>
          <line x1="65" y1="10" x2="65" y2="90" stroke="#64748b" stroke-width="1.2"/>
          <line x1="165" y1="12" x2="165" y2="88" stroke="#f43f5e" stroke-width="1.1" stroke-dasharray="3,3"/>
          <path d="M 85 14 Q 165 130 245 14" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
          <circle cx="117" cy="52" r="3.8" fill="#fbbf24"/>
          <circle cx="213" cy="52" r="3.8" fill="#fbbf24"/>
          <circle cx="165" cy="72" r="4" fill="#f43f5e"/>
          <text x="108" y="45" fill="#fde68a" font-size="10" font-weight="bold" font-family="monospace">α</text>
          <text x="217" y="45" fill="#fde68a" font-size="10" font-weight="bold" font-family="monospace">β</text>
          <text x="172" y="85" fill="#fda4af" font-size="9.5" font-family="monospace">Vertex (-b/2a, -D/4a)</text>
          <text x="28" y="48" fill="#94a3b8" font-size="8.5" font-family="monospace">y=0</text>
        </svg>`,

      // Flat-bottom modulus graph y = |x - a| + |x - b|
      modulus_bucket: `
        <svg viewBox="0 0 320 98" class="w-full h-24 rounded-xl bg-slate-950/60 border border-indigo-400/25 p-1.5">
          <line x1="25" y1="80" x2="295" y2="80" stroke="#64748b" stroke-width="1.2"/>
          <polyline points="55,14 115,56 205,56 265,14" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
          <line x1="115" y1="56" x2="115" y2="80" stroke="#94a3b8" stroke-dasharray="3,3"/>
          <line x1="205" y1="56" x2="205" y2="80" stroke="#94a3b8" stroke-dasharray="3,3"/>
          <circle cx="115" cy="56" r="3.2" fill="#38bdf8"/>
          <circle cx="205" cy="56" r="3.2" fill="#38bdf8"/>
          <text x="103" y="92" fill="#e2e8f0" font-size="9.5" font-family="monospace">x = a</text>
          <text x="193" y="92" fill="#e2e8f0" font-size="9.5" font-family="monospace">x = b</text>
          <text x="122" y="47" fill="#fde68a" font-size="9.5" font-family="monospace">Min = |b − a|</text>
        </svg>`,

      // Enclosed Diamond |x| + |y| <= a
      diamond_graph: `
        <svg viewBox="0 0 320 98" class="w-full h-24 rounded-xl bg-slate-950/60 border border-indigo-400/25 p-1.5">
          <line x1="40" y1="49" x2="280" y2="49" stroke="#64748b" stroke-width="1.2"/>
          <line x1="160" y1="6" x2="160" y2="92" stroke="#64748b" stroke-width="1.2"/>
          <polygon points="160,13 214,49 160,85 106,49" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2.2"/>
          <circle cx="214" cy="49" r="3" fill="#fbbf24"/>
          <circle cx="160" cy="13" r="3" fill="#fbbf24"/>
          <text x="219" y="46" fill="#fde68a" font-size="9.5" font-family="monospace">(a,0)</text>
          <text x="166" y="16" fill="#fde68a" font-size="9.5" font-family="monospace">(0,a)</text>
          <text x="45" y="24" fill="#e2e8f0" font-size="9.5" font-family="monospace">|x| + |y| ≤ a</text>
          <text x="45" y="38" fill="#38bdf8" font-size="9.5" font-weight="bold" font-family="monospace">Area = 2a²</text>
        </svg>`,

      // Triangle Centroid G dividing median AD in 2:1 ratio
      triangle_centroid: `
        <svg viewBox="0 0 320 98" class="w-full h-24 rounded-xl bg-slate-950/60 border border-indigo-400/25 p-1.5">
          <polygon points="155,10 65,82 245,82" fill="none" stroke="#a5b4fc" stroke-width="2"/>
          <line x1="155" y1="10" x2="155" y2="82" stroke="#fbbf24" stroke-width="2"/>
          <line x1="65" y1="82" x2="200" y2="46" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
          <line x1="245" y1="82" x2="110" y2="46" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
          <circle cx="155" cy="58" r="4" fill="#f43f5e"/>
          <text x="143" y="11" fill="#ffffff" font-size="9.5" font-family="monospace">A</text>
          <text x="53" y="86" fill="#94a3b8" font-size="9.5" font-family="monospace">B</text>
          <text x="250" y="86" fill="#94a3b8" font-size="9.5" font-family="monospace">C</text>
          <text x="151" y="94" fill="#fde68a" font-size="9" font-family="monospace">D</text>
          <text x="163" y="56" fill="#fda4af" font-size="10" font-weight="bold" font-family="monospace">G (2:1)</text>
          <text x="160" y="36" fill="#fde68a" font-size="8.5" font-family="monospace">AG = 2</text>
          <text x="160" y="74" fill="#fde68a" font-size="8.5" font-family="monospace">GD = 1</text>
        </svg>`,

      // Circle Secant-Tangent Power Theorem: PT² = PA × PB
      circle_secant: `
        <svg viewBox="0 0 320 98" class="w-full h-24 rounded-xl bg-slate-950/60 border border-indigo-400/25 p-1.5">
          <circle cx="210" cy="49" r="36" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-width="2"/>
          <line x1="50" y1="75" x2="196" y2="15.8" stroke="#fbbf24" stroke-width="2.2"/>
          <line x1="50" y1="75" x2="245.5" y2="48.3" stroke="#a5b4fc" stroke-width="2"/>
          <circle cx="50" cy="75" r="3.5" fill="#ffffff"/>
